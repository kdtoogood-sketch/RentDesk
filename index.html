// ── MAIN METER MONTHLY REMINDER ──
// Every property needs one main meter reading per month. Done = reading saved for this month.
// Staff can also tap "Mark Taken" (e.g. photo clicked, reading to be typed later) — it stays amber until the reading is entered.
const METER_DUE_DAY=5; // after this date a missing reading turns red
function meterStatus(p,month){
  if(p.noMainMeter)return'na';
  if((p.mainMeter||[]).some(x=>x.month===month))return'done';
  if(p.meterTaken&&p.meterTaken.month===month)return'taken';
  return'pending';
}
function dashMeterReminderH(){
  const cm=mk(),props=(S.properties||[]).filter(p=>!p.noMainMeter);
  if(!props.length)return'';
  const st=props.map(p=>({p,s:meterStatus(p,cm)}));
  const open=st.filter(x=>x.s!=='done');
  if(!open.length)return`<div style="background:var(--green-dim);border:1.5px solid var(--green);border-radius:var(--r);padding:10px 16px;margin-bottom:16px;font-size:13px;font-weight:600;color:var(--green);">⚡ All main meter readings done for ${ml(cm)} ✅</div>`;
  const late=new Date().getDate()>METER_DUE_DAY&&open.some(x=>x.s==='pending');
  const rows=st.map(({p,s})=>{
    const readings=(p.mainMeter||[]).slice().sort((a,b)=>a.month.localeCompare(b.month));
    const last=readings[readings.length-1];
    const lastTxt=last?'Last: '+last.reading+' units ('+ml(last.month)+')':'No reading yet';
    let badge,btns;
    if(s==='done'){const c=readings.find(x=>x.month===cm);badge=`<span class="badge badge-grn">✅ Done · ${c.reading}</span>`;btns='';}
    else if(s==='taken'){badge=`<span class="badge badge-amb">📸 Taken ${fd(p.meterTaken.on)} by ${p.meterTaken.by} — enter reading</span>`;btns=`<button class="btn btn-orange btn-sm" onclick="openMainMeter('${p.id}')">⚡ Enter Reading</button>`;}
    else{badge=`<span class="badge ${late?'badge-red':'badge-amb'}">${late?'⚠️ Overdue':'⏳ Pending'}</span>`;
      btns=`<button class="btn btn-orange btn-sm" onclick="openMainMeter('${p.id}')">⚡ Enter Reading</button><button class="btn btn-ghost btn-sm" onclick="markMeterTaken('${p.id}')">✓ Mark Taken</button>`;}
    return`<div class="urgent-row" style="border-bottom-color:${late?'rgba(239,68,68,.18)':'rgba(245,158,11,.2)'};${s==='done'?'opacity:.6;':''}">
      <div style="min-width:0;"><div style="font-weight:700;font-size:14px;color:var(--ink);">${p.name}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px;">${lastTxt}</div><div style="margin-top:4px;">${badge}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">${btns}</div></div>`;
  }).join('');
  const pend=open.length;
  return`<div class="${late?'urgent-card':'soon-card'}">
    <div class="${late?'urgent-head':'soon-head'}" style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><span>⚡ Main Meter Readings — ${ml(cm)}</span><span style="font-size:12px;">${pend} of ${props.length} pending</span></div>
    ${rows}
    <div style="padding:8px 16px;font-size:11px;color:var(--muted);">Done when the reading is saved. "Mark Taken" if you've noted it and will enter it later.${late?'':' Turns red after the '+METER_DUE_DAY+'th.'}</div>
  </div>`;
}
function markMeterTaken(pid){
  const p=S.properties.find(x=>x.id===pid);if(!p)return;
  p.meterTaken={month:mk(),on:today(),by:user};
  actLog('Main meter reading taken — '+p.name+' ('+ml(mk())+')');
  sched();renderTab();toast('📸 Marked taken — enter the reading when you can');
}
function toggleNoMainMeter(pid){
  const p=S.properties.find(x=>x.id===pid);if(!p)return;
  if(!p.noMainMeter&&!confirm('This site has no main meter? It will stop showing in the monthly reminder.'))return;
  p.noMainMeter=!p.noMainMeter;sched();renderPropDetail();
  toast(p.noMainMeter?'Main meter reminder off for '+p.name:'Main meter reminder on for '+p.name);
}

function openMainMeter(pid){
  const p=S.properties.find(x=>x.id===pid);
  const readings=(p.mainMeter||[]).slice().sort((a,b)=>a.month.localeCompare(b.month));
  const cm=mk(),cur=readings.find(x=>x.month===cm),prev=prevReadingForMonth(readings,cm);

  openM('⚡ Main Meter — '+p.name,`
  <div class="frow"><div><label class="flabel">Month</label><input class="finput" id="mmM" type="month" value="${cm}" oninput="mmMonthChanged('${pid}')"/></div><div><label class="flabel">Rate per Unit (₹)</label><input class="finput" id="mmR" type="number" step="0.01" value="${(cur&&cur.rate)||mainMeterRate()}" placeholder="8.30" oninput="mmCalc()"/></div></div>

    <div><label class="flabel">Current Reading *</label><input class="finput" id="mmN" type="number" value="${(cur&&cur.reading)||''}" placeholder="Enter new reading" oninput="mmCalc()"/></div>
  </div>
  <div class="ecalc" id="mmBox"><div class="ecalc-title">📊 Main Meter Calculation</div><div class="ecalc-row"><span>Previous</span><span id="mm1">—</span></div><div class="ecalc-row"><span>Current</span><span id="mm2">—</span></div><div class="ecalc-row"><span>Units</span><span id="mm3" style="color:var(--blue)">—</span></div><div class="ecalc-row"><span>Rate</span><span id="mm4">—</span></div><div class="ecalc-total"><span>Building Bill</span><span id="mm5">—</span></div></div>
  <div class="frow1" style="margin-top:10px;"><label class="flabel">This reading / bill covers</label><select class="fselect" id="mmSpan">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${Number((cur&&cur.span)||1)===n?'selected':''}>${n===1?'1 month (normal)':n+' months — spread the bill evenly'}</option>`).join('')}</select><div class="fhint">If the reading was taken after a gap (e.g. 4 months), the profit report spreads this bill over those months.</div></div>
  <div class="frow1" style="margin-top:10px;"><label class="flabel">Actual Bill Paid (₹) <span style="color:var(--muted);font-weight:400;text-transform:none;">optional — from the DHBVN bill</span></label><input class="finput" id="mmA" type="number" value="${cur?(cur.actualBill!=null?cur.actualBill:(cur.bill!=null&&Math.round(cur.bill)!==Math.round((cur.units||0)*(cur.rate||0))?cur.bill:'')):''}" placeholder="Leave blank if not known yet"/><div class="fhint">Month = billing month. A reading taken on 1 Oct is entered as Oct (covers Sep usage).</div></div>`,
  `<button class="btn btn-ghost" onclick="closeM()">Cancel</button><button class="btn btn-orange" onclick="saveMainMeter('${pid}')">Save</button>`);
  setTimeout(mmCalc,80);
}
function mmMonthChanged(pid){
  const p=S.properties.find(x=>x.id===pid);if(!p)return;
  const mo=document.getElementById('mmM').value;
  const readings=(p.mainMeter||[]).slice().sort((a,b)=>a.month.localeCompare(b.month));
  const cur=readings.find(x=>x.month===mo),prev=prevReadingForMonth(readings,mo);
  document.getElementById('mmO').value=cur&&cur.oldReading!=null?cur.oldReading:(prev&&prev.reading!=null?prev.reading:'');
  document.getElementById('mmN').value=(cur&&cur.reading)||'';
  document.getElementById('mmR').value=(cur&&cur.rate)||mainMeterRate();
  document.getElementById('mmA').value=cur?(cur.actualBill!=null?cur.actualBill:''):'';
  { const sp=document.getElementById('mmSpan'); if(sp)sp.value=String((cur&&cur.span)||1); }
  const hint=document.getElementById('mmHint');
  if(hint)hint.textContent=prev?'📌 From '+ml(prev.month)+': '+prev.reading+' units':'No previous reading';
  mmCalc();
}
function mmCalc(){const o=Number((document.getElementById('mmO')||{}).value||0),n=Number((document.getElementById('mmN')||{}).value||0),r=Number((document.getElementById('mmR')||{}).value||0),box=document.getElementById('mmBox');if(!box)return;if(n>0&&r>0){const u=n-o,t=u*r;box.classList.add('show');document.getElementById('mm1').textContent=o+' units';document.getElementById('mm2').textContent=n+' units';document.getElementById('mm3').textContent=u+' units';document.getElementById('mm4').textContent='₹'+r+'/unit';document.getElementById('mm5').textContent=fm(t);}else box.classList.remove('show');}
function saveMainMeter(pid){
  const n=document.getElementById('mmN').value;if(!n){toast('❌ Enter reading');return;}
  const p=S.properties.find(x=>x.id===pid);if(!p.mainMeter)p.mainMeter=[];
  const mo=document.getElementById('mmM').value,o=Number(document.getElementById('mmO').value||0),nR=Number(n),r=Number(document.getElementById('mmR').value||0),u=nR-o,man=document.getElementById('mmA').value;
  p.mainMeter=p.mainMeter.filter(x=>x.month!==mo);p.mainMeter.push({month:mo,oldReading:o,reading:nR,units:u,rate:r,calcBill:Math.round(u*r),actualBill:man?Number(man):null,bill:man?Number(man):Math.round(u*r*100)/100,...(Number((document.getElementById('mmSpan')||{}).value||1)>1?{span:Number(document.getElementById('mmSpan').value)}:{})});
  // main meter rate is kept separate from the tenants' per-unit rate (p.electricityRate)
  if(p.meterTaken&&p.meterTaken.month===mo)delete p.meterTaken;
  actLog('Main meter reading saved — '+p.name+' '+ml(mo)+': '+nR);
  sched();closeM();if(vProp===pid)renderPropDetail();else renderTab();toast('✅ Main meter saved');
}

function backProp(){vRoom=null;renderPropDetail();}
function editRoom(pid,rid){const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);openM('Edit Room',roomFormH(r),`<button class="btn btn-ghost" onclick="closeM()">Cancel</button>${isAdmin?`<button class="btn btn-red btn-sm" onclick="delRoom('${pid}','${rid}')">🗑</button>`:''}<button class="btn btn-orange" onclick="updRoom('${pid}','${rid}')">Update</button>`);}
function updRoom(pid,rid){
  const p=S.properties.find(x=>x.id===pid),idx=((p&&p.rooms)||[]).findIndex(x=>x.id===rid);
  if(idx===-1)return;
  const oldRent=Number(p.rooms[idx].rent||0);
  const newRentVal=document.getElementById('rR').value;
  const newRent=Number(newRentVal||0);
  if(newRent&&oldRent&&newRent!==oldRent){
    // Rent is actually changing — ask which month the new rate starts applying from,
    // rather than silently assuming. Without this, a rent increase would retroactively
    // recalculate every past month at the new rate, making already-correctly-paid months
    // suddenly show a shortfall.
    openM('📅 Rent Change — From Which Month?',`
      <div style="background:var(--orange-dim);border:1px solid var(--orange);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;">
        Rent is changing from ${fm(oldRent)} to ${fm(newRent)}. Past months will keep using the old rate — only choose the month this new rate actually starts from.
      </div>
      <div class="frow1"><label class="flabel">New Rate Effective From *</label>
        <input class="finput" type="month" id="rc_effFrom" value="${mk()}"/></div>`,
      `<button class="btn btn-ghost" onclick="closeM();${_reopenEditRoomCall(pid,rid)}">Back</button>
       <button class="btn btn-orange" onclick="confirmRentChange('${pid}','${rid}',${newRent})">Confirm</button>`);
    return;
  }
  p.rooms[idx]=collectRoom(p.rooms[idx]);
  // Clear the cached balance history — editing security or move-in date can change
  // what any given month's due amount should be, and a stale cached figure from before the
  // edit would otherwise keep showing indefinitely (getCarryIn trusts the cache first and
  // never re-checks whether the underlying tenant details it was computed from have since
  // changed). Safe to clear: it just means the next view recalculates fresh from actual
  // payment/deduction/reading history, which is always correct.
  p.rooms[idx].balanceByMonth={};
  p.rooms[idx].balance=0;
  sched();closeM();renderRoomDetail();toast('✅ Updated');
}
function _reopenEditRoomCall(pid,rid){return "editRoom('"+pid+"','"+rid+"')";}
function confirmRentChange(pid,rid,newRent){
  const p=S.properties.find(x=>x.id===pid),idx=((p&&p.rooms)||[]).findIndex(x=>x.id===rid);
  if(idx===-1)return;
  const effFrom=document.getElementById('rc_effFrom').value;
  if(!effFrom){toast('❌ Choose the effective month');return;}
  const r=p.rooms[idx];
  if(!r.rentHistory)r.rentHistory=[];
  // Record the OLD rate as having applied up to now, if this is the first change being
  // tracked (so months before this point still resolve to the old rate via rentForMonth's
  // fallback), then add the new rate starting from the chosen month.
  if(!r.rentHistory.length)r.rentHistory.push({rent:Number(r.rent||0),effectiveFrom:TRACKING_START_MONTH});
  const newEntry={rent:newRent,effectiveFrom:effFrom+'-01'};
  // If a history entry already exists for this exact effective month (e.g. correcting an
  // earlier mistaken change), replace it rather than appending a duplicate — two entries
  // for the same month would leave their resolution order ambiguous.
  const dupIdx=r.rentHistory.findIndex(h=>h.effectiveFrom&&h.effectiveFrom.slice(0,7)===effFrom);
  if(dupIdx>=0)r.rentHistory[dupIdx]=newEntry;
  else r.rentHistory.push(newEntry);
  // Only update rent and its history here — do NOT call collectRoom(), since this dialog
  // has replaced the Edit Room form entirely and none of collectRoom's expected fields
  // (rAdv, tN, rT, etc.) exist in the DOM at this point, which was crashing this function.
  r.rent=newRent;
  r.rentHistory=r.rentHistory;
  r.balanceByMonth={};
  r.balance=0;
  sched();closeM();renderRoomDetail();
  actLog('Rent changed — '+(r.tenant&&r.tenant.name?r.tenant.name:'room')+' to '+fm(newRent)+' from '+ml(effFrom));
  toast('✅ Rent updated to '+fm(newRent)+', effective '+ml(effFrom));
}
function delRoom(pid,rid){if(!confirm('Delete this room?'))return;const p=S.properties.find(x=>x.id===pid);p.rooms=p.rooms.filter(x=>x.id!==rid);sched();vRoom=null;closeM();renderPropDetail();toast('🗑 Deleted');}

  `<button class="btn btn-ghost" onclick="closeM()">Cancel</button><button class="btn btn-blue" onclick="openElecBillFromForm('${pid}','${rid}')">📄 View Bill</button><button class="btn btn-orange" onclick="saveElec('${pid}','${rid}')">💾 Save</button>`);
  setTimeout(eCalc,80);
}
function eMonthChanged(pid,rid){
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!p||!r)return;
  const mo=document.getElementById('eM').value;
  const readings=(r.electricityReadings||[]).slice().sort((a,b)=>a.month.localeCompare(b.month));
  const cur=readings.find(x=>x.month===mo),prev=prevReadingForMonth(readings,mo);
  document.getElementById('eO').value=cur&&cur.oldReading!=null?cur.oldReading:(prev&&prev.reading!=null?prev.reading:'');
  document.getElementById('eN').value=(cur&&cur.reading)||'';
  document.getElementById('eRt').value=(cur&&cur.rate)||p.electricityRate||'';
  document.getElementById('eA').value=(cur&&cur.manualAmt)||'';
  const hint=document.getElementById('eHint');
  if(hint)hint.textContent=prev?'📌 Auto: '+ml(prev.month)+' → '+prev.reading+' units':'First reading';
  eCalc();
}
function eCalc(){const o=Number((document.getElementById('eO')||{}).value||0),n=Number((document.getElementById('eN')||{}).value||0),r=Number((document.getElementById('eRt')||{}).value||0),box=document.getElementById('eBox');if(!box)return;if(n>0&&r>0){const u=n-o,t=u*r;box.classList.add('show');document.getElementById('e1').textContent=o+' units';document.getElementById('e2').textContent=n+' units';document.getElementById('e3').textContent=u+' units';document.getElementById('e4').textContent='₹'+r+'/unit';document.getElementById('e5').textContent=fm(t);}else box.classList.remove('show');}
function openElecBillFromForm(pid,rid){openElecBill(pid,rid,document.getElementById('eM').value);}
function saveElec(pid,rid){
  const n=document.getElementById('eN').value,rt=document.getElementById('eRt').value;
  if(!n){toast('❌ Enter current reading');return;}if(!rt){toast('❌ Enter rate');return;}
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r.electricityReadings)r.electricityReadings=[];p.electricityRate=rt;
  const mo=document.getElementById('eM').value,o=Number(document.getElementById('eO').value||0),nR=Number(n),rtN=Number(rt),u=nR-o,man=document.getElementById('eA').value;
  r.electricityReadings=r.electricityReadings.filter(x=>x.month!==mo);
  r.electricityReadings.push({month:mo,oldReading:o,reading:nR,units:u,rate:rtN,amount:man?Number(man):u*rtN,manualAmt:man?Number(man):null});
  sched();closeM();if(vRoom)renderRoomDetail();else renderBilling();toast('✅ Reading saved');
}

// ── PRINT / PDF ──
function pdfName(title){return title.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')+'.pdf';}
function downloadPdfBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function sharePdfHtml(fullHtml,title,orientation){
  if(!window.html2pdf)return false;
  const name=pdfName(title);
  const frame=document.createElement('iframe');
  frame.style.cssText='position:fixed;left:-10000px;top:0;width:1200px;height:1800px;border:0;opacity:0;pointer-events:none;';
  document.body.appendChild(frame);
  try{
    const doc=frame.contentDocument||frame.contentWindow.document;
    doc.open();doc.write(fullHtml);doc.close();
    await new Promise(resolve=>setTimeout(resolve,700));
    toast('📄 Preparing PDF...',3000);
    const opt={
      margin:orientation==='landscape'?5:10,
      filename:name,
      image:{type:'jpeg',quality:0.98},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},
      jsPDF:{unit:'mm',format:'a4',orientation:orientation||'portrait'}
    };
    const blob=await html2pdf().set(opt).from(doc.body).outputPdf('blob');
    if(window.File&&navigator.canShare&&navigator.share){
      const file=new File([blob],name,{type:'application/pdf'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:title,text:title});
        toast('✅ PDF ready to share',2500);
        return true;
      }
    }
    downloadPdfBlob(blob,name);
    toast('📄 PDF downloaded — share it from Downloads',5000);
    return true;
  }catch(e){
    return false;
  }finally{
    if(frame.parentNode)frame.parentNode.removeChild(frame);
  }
}
// Reliable landscape PDF for monthly reports — dynamic iframe height avoids clipping multi-property reports
async function shareReportPdfBlob(fullHtml,title){
  if(!window.html2pdf){toast('❌ PDF library not loaded — try refresh',4000);return false;}
  const name=pdfName(title);
  const frame=document.createElement('iframe');
  frame.style.cssText='position:fixed;left:-10000px;top:0;width:1123px;height:10px;border:0;opacity:0;pointer-events:none;';
  document.body.appendChild(frame);
  try{
    const doc=frame.contentDocument||frame.contentWindow.document;
    doc.open();doc.write(fullHtml);doc.close();
    await new Promise(r=>setTimeout(r,800));
    // Resize iframe to fit ALL content — fixes landscape multi-property clipping
    const fullH=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight,doc.body.offsetHeight)+80;
    frame.style.height=fullH+'px';
    await new Promise(r=>setTimeout(r,200));
    toast('📄 Preparing PDF...',3000);
    const opt={
      margin:8,
      filename:name,
      image:{type:'jpeg',quality:0.95},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:1123,height:fullH},
      jsPDF:{unit:'mm',format:'a4',orientation:'landscape'},
      pagebreak:{mode:['avoid-all','css','legacy']}
    };
    const blob=await html2pdf().set(opt).from(doc.body).outputPdf('blob');
    if(window.File&&navigator.canShare&&navigator.share){
      const file=new File([blob],name,{type:'application/pdf'});
      if(navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file],title:title,text:title});
          toast('✅ Pick WhatsApp from share menu',3000);
          return true;
        }catch(err){
          if(err.name==='AbortError')return true; // user cancelled — that's fine
          // any other error → fall through to download
        }
      }
    }
    downloadPdfBlob(blob,name);
    toast('📄 PDF saved — open WhatsApp & attach from Downloads',5000);
    return true;
  }catch(e){
    console.error('Report PDF failed:',e);
    toast('❌ PDF generation failed — falling back to print',3000);
    return false;
  }finally{
    if(frame.parentNode)frame.parentNode.removeChild(frame);
  }
}
// ── pdfmake (lazy-loaded) — produces TRUE vector PDFs that match print preview quality ──
function loadPdfMake(){
  return new Promise((resolve,reject)=>{
    if(window.pdfMake&&window.pdfMake.vfs){resolve();return;}
    toast('📦 Loading PDF library (first time only)...',3000);
    const s1=document.createElement('script');
    s1.src='https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js';
    s1.onload=()=>{
      const s2=document.createElement('script');
      s2.src='https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.min.js';
      s2.onload=()=>resolve();
      s2.onerror=()=>reject(new Error('vfs_fonts load failed'));
      document.head.appendChild(s2);
    };
    s1.onerror=()=>reject(new Error('pdfmake load failed'));
    document.head.appendChild(s1);
  });
}

// Generate true vector PDF via pdfmake and share to WhatsApp / share sheet
async function shareMonthlyReportPdfMake(month,filterPropId){
  try{await loadPdfMake();}
  catch(e){console.error('pdfmake load failed:',e);return false;}
  if(!window.pdfMake)return false;
  const fileName=pdfName('KDC-Report-'+month);
  const fileTitle='KDC Monthly Report \u2014 '+ml(month);
  toast('📄 Building PDF...',2500);
  return new Promise(resolve=>{
    try{
      const docDef=buildMonthlyReportDocDef(month,filterPropId);
      pdfMake.createPdf(docDef).getBlob(async blob=>{
        try{
          if(window.File&&navigator.canShare&&navigator.share){
            const file=new File([blob],fileName,{type:'application/pdf'});
            if(navigator.canShare({files:[file]})){
              try{
                await navigator.share({files:[file],title:fileTitle,text:fileTitle});
                toast('✅ Pick WhatsApp from share menu',3000);
                resolve(true);return;
              }catch(err){
                if(err.name==='AbortError'){resolve(true);return;}
              }
            }
          }
          downloadPdfBlob(blob,fileName);
          toast('📄 PDF saved — open WhatsApp & attach from Downloads',5000);
          resolve(true);
        }catch(e){
          console.error('share step failed:',e);
          try{downloadPdfBlob(blob,fileName);resolve(true);}
          catch(e2){resolve(false);}
        }
      });
    }catch(e){
      console.error('pdfmake build failed:',e);
      toast('❌ PDF build failed — falling back',3000);
      resolve(false);
    }
  });
}

// Cleans a stored phone number into exactly 10 digits before it goes into a wa.me link.
// Strips spaces/dashes/+, strips a leading 91 (country code) if already present so it's
// never doubled up (e.g. saved as "917011195586" -> would become "91917011195586" otherwise),
// strips a leading 0, and returns null if what's left isn't a plausible 10-digit mobile number.
function cleanPhoneForWA(raw){
  let d=String(raw||'').replace(/[^0-9]/g,''); // digits only
  if(d.length===12&&d.startsWith('91'))d=d.slice(2);
  else if(d.length===11&&d.startsWith('0'))d=d.slice(1);
  if(d.length!==10)return null;
  return d;
}

// ── PAYMENT ──
let _pyPid=null,_pyRid=null;
// ── PER-MONTH BALANCE HELPERS ──
function prevMonth(mo){
  const[y,m]=mo.split('-').map(Number);
  const d=new Date(y,m-2);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function calcClosingBalance(r,mo){
  // Compute what's left unpaid after a given month, purely from payment history
  // This is deterministic — no stored state needed
  const elec=(r.electricityReadings||[]).find(x=>x.month===mo);
  const carryIn=getCarryIn(r,mo);
  const dedTotal=(r.deductions||[]).filter(d=>d.month===mo).reduce((s,d)=>s+Number(d.amount||0),0);
  const activeStart=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const rentAmt=activeStart?proratedRentForMonth(rentForMonth(r,mo),activeStart,mo):Number(r.rent||0);
  const secAdvDue=securityAdvanceDueForMonth(r,mo);
  const isMoveInMonth=activeStart&&sameMonthDate(activeStart,mo);
  const secPending=(secAdvDue&&isMoveInMonth)?secAdvDue.secPending:0;
  const due=rentAmt+Number((elec&&elec.amount)||0)+carryIn-dedTotal+secPending;
  const paid=(r.payments||[]).filter(x=>x.month===mo).reduce((s,x)=>s+Number(x.amount||0),0);
  return Math.max(0,due-paid);
}
const TRACKING_START_MONTH='2026-05';
function getCarryIn(r,mo,_depth){
  _depth=_depth||0;
  if(!r.balanceByMonth)r.balanceByMonth={};
  // Hard floor: May 2026 is the true start of data entry for every tenant, regardless of
  // what any individual tenant's stored move-in/lease-start date says. Some tenants ended
  // up with an earlier date on record (e.g. a blank date field defaulting to an earlier
  // "today" during initial setup), which the recursive calculation below would otherwise
  // trust and walk back from — inflating balances with months that predate real tracking.
  // Declaring May as a hard boundary sidesteps having to audit every tenant's exact stored
  // date individually.
  if(mo<=TRACKING_START_MONTH)return 0;
  const pm=prevMonth(mo);
  // First check stored history for previous month
  if(r.balanceByMonth[pm]!==undefined)return r.balanceByMonth[pm];
  // Safety guard against runaway recursion on malformed data (e.g. a corrupted date that
  // never resolves to "tenant didn't exist yet") — 240 months is 20 years, far beyond any
  // realistic tenancy.
  if(_depth>240)return 0;
  // Determine whether the tenant actually existed in the previous month at all — using
  // their move-in date (checked across all the places it can live), not just "did they
  // make a payment that month". A tenant who made ZERO payments in a month they were
  // present for (e.g. moved in but never paid) still owes that month's rent — that must
  // not be silently treated as "nothing owed" just because there's no payment record.
  const pmActiveStart=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const tenantExistedInPm=pmActiveStart&&pmActiveStart.slice(0,7)<=pm;
  const pmPayments=(r.payments||[]).filter(x=>x.month===pm);
  const pmElec=(r.electricityReadings||[]).find(x=>x.month===pm);
  const pmDed=(r.deductions||[]).filter(d=>d.month===pm).reduce((s,d)=>s+Number(d.amount||0),0);
  if(tenantExistedInPm||pmPayments.length>0){
    // Compute the previous month's closing balance — due minus whatever was actually paid
    // (zero payments is a valid, common case: it just means the full amount carries over).
    // Recurse to get pm's own carry-in (its balance from the month before it) — this must
    // be a genuine recursive call, not a direct cache read, otherwise a "cold" view (e.g.
    // opening August billing without ever having visited July) would only look one month
    // back correctly and silently drop anything further behind since the cache was never
    // populated by a prior write.
    const pmCarryIn=getCarryIn(r,pm,_depth+1);
    // Match what the billing row actually shows as "Total Due" for that month: prorated
    // rent (not flat rent) plus any pending security amount — otherwise a security amount
    // shown and included in one month's Total Due would silently vanish from the carry-in
    // chain instead of following through to the next month, the same way an unpaid rent
    // shortfall does.
    const pmRentAmt=proratedRentForMonth(rentForMonth(r,pm),pmActiveStart,pm);
    const pmSecAdvDue=securityAdvanceDueForMonth(r,pm);
    const pmIsMoveInMonth=pmActiveStart&&sameMonthDate(pmActiveStart,pm);
    const pmSecPending=(pmSecAdvDue&&pmIsMoveInMonth)?pmSecAdvDue.secPending:0;
    const pmDue=pmRentAmt+Number((pmElec&&pmElec.amount)||0)+pmCarryIn-pmDed+pmSecPending;
    const pmPaid=pmPayments.reduce((s,x)=>s+Number(x.amount||0),0);

function setBalanceAfterMonth(r,mo,val){

  return{elec,bal,dedTotal,due:Number(r.rent||0)+Number((elec&&elec.amount)||0)+bal-dedTotal};
}

        <td style="color:var(--blue);font-weight:600">${elecRec?elecRec.units:'—'}</td>
        <td>${elecAmt>0?`<span style="color:var(--green);font-weight:600">${fm(elecAmt)}</span>`:'—'}</td>
        <td><span style="color:var(--purple);font-weight:600">${fm(t.securityHeld||0)}</span><br/><span style="font-size:10px;color:var(--muted)">held</span>${secAdj>0?`<br/><span style="font-size:10px;color:var(--orange);">adj: ${fm(secAdj)}</span>`:''}</td>
        <td>${dedAmt>0?`<span style="color:var(--purple)">${fm(dedAmt)}</span>`:'—'}</td>
        <td style="color:var(--orange);font-weight:700">${fm(total)}</td>
        <td style="color:var(--green);font-weight:600">${fm(totalPaid)}${cashPaid>0?`<br/><span style="font-size:10px;">cash: ${fm(cashPaid)}</span>`:''}</td>
        <td>${pend>0?`<span style="color:var(--red);font-weight:700;">${fm(pend)}</span>`:'<span style="color:var(--green);">—</span>'}</td>
        <td><div style="display:flex;flex-direction:column;gap:3px;">
          <span class="badge ${pend<=0?'badge-grn':'badge-red'}">${pend<=0?'✓ Settled':'🔴 Pending'}</span>
          <span style="font-size:10px;color:${netRefund>0?'var(--green)':netRefund<0?'var(--red)':'var(--muted)'};">
            ${netRefund>0?'Refund: '+fm(netRefund):netRefund<0?'Owes: '+fm(Math.abs(netRefund)):'Settled'}
          </span>
        </div></td>
        <td>${refundActionH(t)}</td>
      </tr>`;
    });
    const vacantArr=vacantRooms.map(r=>`<tr style="background:#F9FAFB;color:var(--muted);">
        <td><strong>${r.type}${r.unitNo?' #'+r.unitNo:''}</strong></td>
        <td colspan="2" style="font-style:italic;">Vacant</td>
        <td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td>
        <td>₹0</td><td>₹0</td><td>—</td>
        <td><span class="badge" style="background:#E5E7EB;color:#6B7280;">Vacant</span></td>
        <td>—</td>
      </tr>`);
    // Keep every row in its room's position (floor order): a tenant who vacated this month stays in her
    // room's slot, followed by the room's new tenant (if any) or nothing if it's now empty.
    const _rowFor={};
    liveTenants.forEach((r,i)=>{(_rowFor[r.id]=_rowFor[r.id]||{}).live=rowsArr[i];});
    vacatedThisMonth.forEach((t,i)=>{((_rowFor[t.roomId]=_rowFor[t.roomId]||{}).vac=_rowFor[t.roomId].vac||[]).push(vacatedArr[i]);});
    vacantRooms.forEach((r,i)=>{(_rowFor[r.id]=_rowFor[r.id]||{}).vacant=vacantArr[i];});
    const _seen=new Set();
    let orderedRows=allSortedRooms.map(r=>{ const x=_rowFor[r.id]; if(!x)return''; _seen.add(r.id); return (x.vac||[]).join('')+(x.live||'')+((x.vac&&x.vac.length)||x.live?'':(x.vacant||'')); }).join('');
    vacatedThisMonth.forEach((t,i)=>{ if(!_seen.has(t.roomId))orderedRows+=vacatedArr[i]; }); // room since deleted
    { const cards=[], liveBy={}, vacBy={}; liveTenants.forEach((r,i)=>liveBy[r.id]=cLive[i]); vacatedThisMonth.forEach((t,i)=>(vacBy[t.roomId]=vacBy[t.roomId]||[]).push(cVac[i]));
      const seen=new Set(); allSortedRooms.forEach(r=>{ seen.add(r.id); (vacBy[r.id]||[]).forEach(c=>cards.push(c)); if(liveBy[r.id])cards.push(liveBy[r.id]); });
      vacatedThisMonth.forEach((t,i)=>{ if(!seen.has(t.roomId))cards.push(cVac[i]); });
      _sites.push({p,cards,vacant:vacantRooms,pDue,pPaid,pPend,pElec}); }
    return`<div style="margin-bottom:16px;">
      <div style="background:var(--orange);color:#fff;padding:8px 12px;border-radius:8px 8px 0 0;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;">
        <span>🏢 ${p.name}</span>
        <span style="font-size:11px;opacity:0.85;">${liveTenants.length+vacatedThisMonth.length} tenant${(liveTenants.length+vacatedThisMonth.length)!==1?'s':''}${vacantRooms.length?' · '+vacantRooms.length+' vacant':''}</span>
      </div>
      <div style="overflow-x:auto;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;">
      <table class="tbl" style="margin:0;">
        <thead><tr><th>Unit</th><th>Tenant</th><th>Rent</th><th>Deposits</th><th>Prev→New</th><th>Units</th><th>Elec Bill</th><th>Carry-In</th><th>Deduct</th><th>Total Due</th><th>Paid</th><th>Closing Bal</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${orderedRows}</tbody>
        <tfoot><tr style="background:var(--bg);font-weight:700;">
          <td colspan="2" style="color:var(--ink);">Subtotal — ${p.name}</td>
          <td style="color:var(--ink);">${fm(pRent)}</td>
          <td style="color:var(--purple);font-size:11px;">${pDeposits>0?fm(pDeposits):'—'}</td>
          <td colspan="2"></td>
          <td style="color:var(--blue,#2563eb);font-size:12px;">⚡ ${fm(pElec)}</td>
          <td colspan="2"></td>
          <td style="color:var(--orange);font-weight:700;">${fm(pDue)}</td>
          <td style="color:var(--green);font-weight:700;">${fm(pPaid)}</td>
          <td></td>
          <td style="color:${pPend>0?'var(--red)':'var(--green)'};">${pPend>0?fm(pPend):'✓'}</td>
          <td></td>
        </tr></tfoot>
      </table></div></div>`;
  }).join('');

  if(_billView()==='cards'){ mc.innerHTML=billCardsViewH(_sites,{grandDue,grandPaid,grandPend,anyTenant,movementCard}); billApplySearch(); return; }
  mc.innerHTML=`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
    <div style="font-family:'Space Grotesk';font-size:18px;font-weight:700;">⚡ Billing & Collections</div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div class="mnav"><button onclick="chBill(-1)">‹</button><span>${ml(billMo)}</span><button onclick="chBill(1)">›</button></div>
      <button class="btn btn-orange btn-sm" onclick="openMonthlyReport('${billMo}')">📊 Monthly Report</button>
      <button class="btn btn-ghost btn-sm" onclick="_billSetView('cards')">▦ Card view</button>
    </div>
  </div>
  ${movementCard}
  ${elecReconCardH(billMo)}
  ${anyTenant?`
    ${propSections}
    <div style="background:var(--ink);color:#fff;padding:14px 16px;border-radius:8px;margin-top:4px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="font-size:13px;">Total Due</span><span style="font-weight:700;">${fm(grandDue)}</span></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="font-size:13px;color:#aaa;">Total Collected</span><span style="font-weight:700;color:#6EE7A0;">${fm(grandPaid)}</span></div>
      <div style="border-top:1px solid rgba(255,255,255,0.2);padding-top:8px;margin-top:4px;display:flex;justify-content:space-between;">
        <span style="font-size:14px;font-weight:700;">Grand Total Pending</span>
        <span style="font-size:16px;font-weight:700;color:${grandPend>0?'#FCA5A5':'#6EE7A0'};">${grandPend>0?fm(grandPend):'✓ All collected'}</span>
      </div>
    </div>`
  :`<div class="empty"><div class="empty-icon">💰</div><div class="empty-text">No occupied units</div></div>`}`;
}

// ══════════════════════════════════════════════════════
// 💳 BILLING — CARD VIEW (screen only; bills, receipts and the Monthly Report PDF are unchanged)
// ══════════════════════════════════════════════════════
let billFilter='all', billQ='';
function _lsGet(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function _lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function _billView(){ return _lsGet('rentdesk_bill_view','cards'); }
function _billSetView(v){ _lsSet('rentdesk_bill_view',v); renderBilling(); }
let BILL_FOLD=(()=>{ try{ return JSON.parse(_lsGet('rentdesk_bill_fold','{}'))||{}; }catch(e){ return {}; } })();
function billFold(pid){ BILL_FOLD[pid]=!BILL_FOLD[pid]; _lsSet('rentdesk_bill_fold',JSON.stringify(BILL_FOLD)); renderBilling(); }
function billSetFilter(f){ billFilter=billFilter===f&&f!=='all'?'all':f; renderBilling(); }
function billApplySearch(){
  const q=String(billQ||'').trim().toLowerCase();
  document.querySelectorAll('#billCards .bc').forEach(el=>{ el.style.display=!q||(el.getAttribute('data-q')||'').includes(q)?'':'none'; });
  document.querySelectorAll('#billCards .bsite').forEach(sec=>{ const any=[...sec.querySelectorAll('.bc')].some(el=>el.style.display!=='none'&&!el.classList.contains('bc-hid')); const e=sec.querySelector('.bsite-empty'); if(e)e.style.display=any?'none':''; });
}
function _bcNeedsElec(c){ return c.kind==='live'&&!c.elec&&(Number(c.p.electricityRate)>0||(c.r.electricityReadings||[]).length>0); }
function _bcMatch(c){
  if(billFilter==='pending')return c.pend>0;
  if(billFilter==='paid')return c.pend<=0;
  if(billFilter==='noelec')return _bcNeedsElec(c);
  return true;
}
function billMore(pid,rid){
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid); if(!r)return;
  const mo=billMo, elec=(r.electricityReadings||[]).find(x=>x.month===mo), ded=(r.deductions||[]).some(d=>d.month===mo);
  const b=(ic,t,fn,sub)=>`<button class="bm-item" onclick="closeM();${fn}"><span style="font-size:18px;width:26px;text-align:center;">${ic}</span><span style="flex:1;text-align:left;"><b>${t}</b>${sub?`<div style="font-size:11px;color:var(--muted);font-weight:500;">${sub}</div>`:''}</span><span style="color:var(--muted);">›</span></button>`;
  openM(((r.tenant&&r.tenant.name)||r.type)+' — '+ml(mo),`<div style="display:flex;flex-direction:column;gap:6px;">
    ${b('💰','Record payment',`openPayment('${pid}','${rid}','${mo}')`)}
    ${b('⚡',elec?'Edit electricity reading':'Enter electricity reading',`openElec('${pid}','${rid}','${mo}')`,elec?elec.oldReading+' → '+elec.reading+' · '+elec.units+' units':'')}
    ${elec?b('📄','Send electricity bill only',`openElecBill('${pid}','${rid}','${mo}')`):''}
    ${b('📱','Send full bill',`openCombinedBill('${pid}','${rid}','${mo}')`)}
    ${b('💬','Other WhatsApp messages',`openWaMenu('${pid}','${rid}')`,'Reminder, documents, lease, birthday, festival…')}
    ${b('🧾','Receipt',`openReceipt('${pid}','${rid}')`)}
    ${b('✏️','Edit carry-in balance',`openEditBalance('${pid}','${rid}')`)}
    ${ded?b('➖','Manage deductions',`openManageDeductions('${pid}','${rid}','${mo}')`):b('➖','Add deduction',`openDeduction('${pid}','${rid}','${mo}')`)}
    ${b('🔐','Collect security / token / advance',`openDepositEntry('${pid}','${rid}','${mo}')`)}
    ${remainingAdvanceBalance(r)>0?b('💸','Apply advance to rent',`openApplyAdvance('${pid}','${rid}','${mo}')`,fm(remainingAdvanceBalance(r))+' unused'):''}
    ${b('🏠','Open room',`goRoom('${pid}','${rid}')`)}
  </div>`,`<button class="btn btn-ghost" onclick="closeM()">Close</button>`);
}
function _bcLiveH(c){
  const {p,r,elec}=c, mo=billMo, args=`'${p.id}','${r.id}','${mo}'`, t=r.tenant||{};
  const needElec=_bcNeedsElec(c);
  const pill=c.pend<=0?`<span class="bc-pill grn">✓ Paid</span>`:c.paid>0?`<span class="bc-pill amb" onclick="openPayment(${args})">⚠️ ${fm(c.pend)} left</span>`:`<span class="bc-pill red" onclick="openPayment(${args})">🔴 ${fm(c.pend)} due</span>`;
  const parts=[`Rent <b>${fm(c.rentAmt)}</b>${c.isProrated?' <i>(pro-rata)</i>':''}`];
  if(elec)parts.push(`⚡ <b>${fm(elec.amount)}</b> <i>(${elec.units}u)</i>`);
  else if(needElec)parts.push(`⚡ <span style="color:var(--red);font-weight:700;">no reading</span>`);
  if(c.bal>0)parts.push(`Carry-in <b style="color:var(--red);">${fm(c.bal)}</b>`);
  if(c.secOnlyPending>0)parts.push(`Security <b style="color:var(--amber);">${fm(c.secOnlyPending)}</b>`);
  let line=parts.join(' + ');
  if(c.dedTotal>0)line+=` − Ded <b style="color:var(--purple);">${fm(c.dedTotal)}</b>`;
  const main=needElec?`<button class="btn btn-blue btn-sm" onclick="openElec(${args})">⚡ Enter reading</button>`
    :c.pend>0?`<button class="btn btn-orange btn-sm" onclick="openPayment(${args})">💰 Record payment</button>`
    :`<button class="btn btn-ghost btn-sm" onclick="openReceipt('${p.id}','${r.id}')">🧾 Receipt</button>`;
  const extra=[];
  if(c.secAdvDue&&c.secAdvDue.pending>0)extra.push(`<span style="color:var(--amber);">🔐 Security/advance pending ${fm(c.secAdvDue.pending)}</span> <a href="#" onclick="openDepositEntry(${args});return false;" style="color:var(--purple);font-weight:700;">+ Collect</a>`);
  if(c.monthDepositsTotal>0)extra.push(`<span style="color:var(--purple);">🔐 ${fm(c.monthDepositsTotal)} deposit received this month</span>`);
  const q=[t.name,t.phone,r.type,r.unitNo,p.name].join(' ').toLowerCase();
  return `<div class="bc ${_bcMatch(c)?'':'bc-hid'} ${c.pend>0?(c.paid>0?'st-amb':'st-red'):'st-grn'}" data-q="${_escHtml(q)}">
    <div class="bc-top"><div style="min-width:0;"><div class="bc-unit">${_escHtml(r.type+(r.unitNo?' #'+r.unitNo:''))}</div><div class="bc-name">${_escHtml(t.name||'—')}</div></div>${pill}</div>
    <div class="bc-line">${line}</div>
    <div class="bc-tot"><span>Due <b>${fm(c.total)}</b></span><span>Paid <b style="color:var(--green);">${fm(c.paid)}</b></span>${c.pend>0?`<span>Balance <b style="color:var(--red);">${fm(c.pend)}</b></span>`:''}</div>
    ${extra.length?`<div class="bc-extra">${extra.join('<br/>')}</div>`:''}
    ${payChipsH(p,r,mo)}
    <div class="bc-act">${main}<button class="btn btn-ghost btn-sm" onclick="openCombinedBill(${args})">📱 Send bill</button><button class="btn btn-ghost btn-sm bc-more" onclick="billMore('${p.id}','${r.id}')" title="More">⋯</button></div>
  </div>`;
}
function _bcVacH(c){
  const {t}=c;
  const q=[t.name,t.phone,t.roomType,t.unitNo,c.p.name].join(' ').toLowerCase();
  const line=[`Rent <b>${fm(c.rentDue)}</b>`,c.elecAmt>0?`⚡ <b>${fm(c.elecAmt)}</b>${c.elecRec?` <i>(${c.elecRec.units}u)</i>`:''}`:null].filter(Boolean).join(' + ')+(c.dedAmt>0?` − Ded <b style="color:var(--purple);">${fm(c.dedAmt)}</b>`:'');
  return `<div class="bc st-vac ${_bcMatch(c)?'':'bc-hid'}" data-q="${_escHtml(q)}">
    <div class="bc-top"><div style="min-width:0;"><div class="bc-unit">${_escHtml((t.roomType||'')+(t.unitNo?' #'+t.unitNo:''))} · <span style="color:var(--orange);">VACATED ${fd(t.vacatingDate)}</span></div><div class="bc-name">${_escHtml(t.name||'—')}</div></div>
      <span class="bc-pill ${c.pend<=0?'grn':'red'}">${c.pend<=0?'✓ Settled':'🔴 '+fm(c.pend)+' due'}</span></div>
    <div class="bc-line">${line}</div>
    <div class="bc-tot"><span>Due <b>${fm(c.total)}</b></span><span>Paid <b style="color:var(--green);">${fm(c.totalPaid)}</b>${c.secAdj>0?` <i style="font-size:11px;color:var(--muted);">(incl. ${fm(c.secAdj)} from security)</i>`:''}</span></div>
    <div class="bc-extra">Security held ${fm(t.securityHeld||0)} · <span style="color:${c.netRefund>0?'var(--green)':c.netRefund<0?'var(--red)':'var(--muted)'};font-weight:700;">${c.netRefund>0?'Refund '+fm(c.netRefund):c.netRefund<0?'Owes '+fm(Math.abs(c.netRefund)):'Settled'}</span></div>
    <div class="bc-act">${refundActionH(t)}</div>
  </div>`;
}
function billCardsViewH(sites,G){
  const all=sites.flatMap(x=>x.cards);
  const nPend=all.filter(c=>c.pend>0).length, nPaid=all.filter(c=>c.pend<=0).length, nElec=all.filter(_bcNeedsElec).length;
  const chip=(f,t,n)=>`<button class="bchip ${billFilter===f?'on':''}" onclick="billSetFilter('${f}')">${t}${n!=null?` <span>${n}</span>`:''}</button>`;
  const head=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
    <div style="font-family:'Space Grotesk';font-size:18px;font-weight:700;">⚡ Billing & Collections</div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <div class="mnav"><button onclick="chBill(-1)">‹</button><span>${ml(billMo)}</span><button onclick="chBill(1)">›</button></div>
      <button class="btn btn-orange btn-sm" onclick="openMonthlyReport('${billMo}')">📊 Monthly Report</button>
      <button class="btn btn-ghost btn-sm" onclick="_billSetView('table')">☰ Table view</button>
    </div></div>`;
  if(!G.anyTenant)return head+`<div class="empty"><div class="empty-icon">💰</div><div class="empty-text">No occupied units</div></div>${G.movementCard}`;
  const pct=G.grandDue>0?Math.min(100,Math.round(G.grandPaid/G.grandDue*100)):100;
  const strip=`<div class="bsum">
    <div class="bsum-t" onclick="billSetFilter('all')"><div class="l">Due</div><div class="v">${fm(G.grandDue)}</div></div>
    <div class="bsum-t" onclick="billSetFilter('paid')"><div class="l">Collected</div><div class="v" style="color:var(--green);">${fm(G.grandPaid)}</div></div>
    <div class="bsum-t" onclick="billSetFilter('pending')"><div class="l">Pending</div><div class="v" style="color:${G.grandPend>0?'var(--red)':'var(--green)'};">${G.grandPend>0?fm(G.grandPend):'✓ All'}</div></div>
    <div class="bsum-bar"><div style="width:${pct}%;"></div></div>
    <div class="bsum-sub">${nPend?`<a href="#" onclick="billSetFilter('pending');return false;">🔴 ${nPend} tenant${nPend>1?'s':''} pending</a>`:'<span style="color:var(--green);">✓ Everyone has paid</span>'}${nElec?` · <a href="#" onclick="billSetFilter('noelec');return false;" style="color:var(--blue);">⚡ ${nElec} room${nElec>1?'s':''} without reading</a>`:''} · ${pct}% collected</div>
  </div>`;
  const filters=`<div class="bfilt">${chip('all','All',all.length)}${chip('pending','Pending',nPend)}${chip('paid','Paid',nPaid)}${chip('noelec','No elec reading',nElec)}
    <input class="finput bsearch" placeholder="🔍 Search tenant / unit" value="${_escHtml(billQ)}" oninput="billQ=this.value;billApplySearch()"/></div>`;
  const secs=sites.map(x=>{
    const p=x.p, fold=!!BILL_FOLD[p.id], shown=x.cards.filter(_bcMatch);
    const ask=isAdmin&&!bankOn(p)&&ownerPhoneOf(p)?ownerAskItems(p,billMo):[];
    const pct2=x.pDue>0?Math.min(100,Math.round(x.pPaid/x.pDue*100)):100;
    return `<div class="bsite">
      <div class="bsite-h" onclick="billFold('${p.id}')">
        <div style="min-width:0;"><div style="font-weight:800;font-size:14px;">${fold?'▸':'▾'} 🏢 ${_escHtml(p.name)}</div>
          <div style="font-size:11.5px;opacity:.92;">${x.cards.length} tenant${x.cards.length!==1?'s':''}${x.vacant.length?' · '+x.vacant.length+' vacant':''}${x.pElec?' · ⚡ '+fm(x.pElec):''}</div></div>
        <div style="text-align:right;white-space:nowrap;"><div style="font-weight:800;font-size:14px;">${fm(x.pPaid)} <span style="opacity:.8;font-weight:600;font-size:12px;">/ ${fm(x.pDue)}</span></div>
          <div style="font-size:11.5px;font-weight:700;">${x.pPend>0?fm(x.pPend)+' pending':'✓ All collected'}</div></div>
        <div class="bsite-bar"><div style="width:${pct2}%;"></div></div>
      </div>
      ${fold?'':`
      ${ask.length?`<div class="bsite-ask"><span>📲 ${ask.length} UPI / bank payment${ask.length>1?'s':''} (${fm(ask.reduce((a,i)=>a+Number(i.x.amount||0),0))}) not confirmed by owner</span><button class="btn btn-green btn-sm" onclick="askOwnerConfirm('${p.id}','${billMo}')">Ask owner to confirm</button></div>`:''}
      <div class="bgrid">${x.cards.map(c=>c.kind==='live'?_bcLiveH(c):_bcVacH(c)).join('')}
        <div class="bsite-empty" style="${shown.length?'display:none;':''}">Nothing here for this filter</div></div>
      ${x.vacant.length&&billFilter==='all'?`<div class="bvac">Vacant: ${x.vacant.map(r=>_escHtml(r.type+(r.unitNo?' #'+r.unitNo:''))).join(', ')}</div>`:''}`}
    </div>`;
  }).join('');
  const fold=(id,title,body)=>body?`<details class="bfold" ${_lsGet('rentdesk_bf_'+id,'')==='1'?'open':''} ontoggle="_lsSet('rentdesk_bf_${id}',this.open?'1':'')"><summary>${title}</summary><div style="margin-top:10px;">${body}</div></details>`:'';
  return head+strip+filters+`<div id="billCards">${secs}</div>`
    +fold('elec','⚡ Electricity check — main meter vs tenants',elecReconCardH(billMo))

// Keeps the older single-value balance fields (securityBalance, advanceRentStatus) in sync
// with the deposit ledger's running totals, so room detail / booking badges / cards never
// show a stale "pending" balance after a payment has actually been logged.
function syncBalancesFromLedger(r){
  if(!r)return;
  const target=r.tenant||r.token; // whichever is active right now
  if(!target)return;
  const secTotal=Number(target.securityDeposit!=null?target.securityDeposit:(target.security||0));
  const secPaid=depositLedgerTotal(r,'security')+depositLedgerTotal(r,'token'); // token counts toward security
  const secBal=Math.max(0,secTotal-secPaid);
  const advTotal=Number(target.advanceRent||0);
  const advPaid=depositLedgerTotal(r,'advance');
  if(secTotal>0){
    target.securityBalance=secBal;
    if(r.token)r.token.securityBalance=secBal;
    if(r.tenant)r.tenant.securityBalance=secBal;
  }
  if(advTotal>0){
    const advStatus=advPaid>=advTotal?'paid':'pending';
    target.advanceRentStatus=advStatus;
    if(r.token)r.token.advanceRentStatus=advStatus;
    if(r.tenant)r.tenant.advanceRentStatus=advStatus;
  }
}

// One passbook per staff member. Built on the existing data — nothing is migrated:
//   IN  : S.cash type 'given' (cash from KD / client / other)
//         room payments with mode 'Cash' and receivedBy = this staff member
//   OUT : S.cash type 'spent' (older cash-tab expenses, already linked to an expense)
//         S.expenses with paidBy = this staff member (not fromCash)

function staffList(){ if(!Array.isArray(S.staff)||!S.staff.length)S.staff=['Preeti']; return S.staff; }

// Period for Cash & Exp: 'm' = one month (cbMo), '3m' / '6m' = months ending cbMo, 'fy' = Apr..cbMo, 'custom' = cbFrom..cbTo
let cbPer='m', cbFrom='', cbTo='';
function _mEnd(m){ const [y,mo]=m.split('-').map(Number); return m+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0'); }
function _mAdd(m,d){ const [y,mo]=m.split('-').map(Number); const dt=new Date(y,mo-1+d,1); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }
function _mShortL(m){ const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('en-IN',{month:'short',year:'numeric'}); }
function cbPeriod(){

  if(cbPer==='custom'&&cbFrom&&cbTo&&cbFrom<=cbTo){ from=cbFrom; to=cbTo; label=fd(cbFrom)+' – '+fd(cbTo); }
  else if(cbPer==='3m'||cbPer==='6m'){ const st=_mAdd(cbMo,-((cbPer==='3m'?3:6)-1)); from=st+'-01'; to=_mEnd(cbMo); label=_mShortL(st)+' – '+_mShortL(cbMo); }
  else if(cbPer==='fy'){ const [y,mo]=cbMo.split('-').map(Number), fy=mo>=4?y:y-1; from=fy+'-04-01'; to=_mEnd(cbMo); label='FY '+fy+'-'+String(fy+1).slice(2)+' (Apr – '+_mShortL(cbMo).split(' ')[0]+')'; }
  else { from=cbMo+'-01'; to=_mEnd(cbMo); label=ml(cbMo); month=cbMo; }
  const months=[]; for(let m=from.slice(0,7); m<=to.slice(0,7); m=_mAdd(m,1)) months.push(m);

// 798 + Misc (= every site whose cash is KD's, plus Misc) also counts "Cash from / to KD", so it equals All sites minus the owner sites

function cashBookEntries(staff){
  const out=[];

    const who=c.staff||'Preeti'; if(who!==staff)return;
    const amt=Number(c.amount||0);
    if(c.type==='given') out.push({kind:'given',fund:'kd',dir:1,date:c.date||'',amount:amt,site:'',siteName:'',text:'Cash received'+(c.source?' from '+c.source:'')+(c.note?' — '+c.note:''),src:'cash',id:c.id,raw:c});
    else if(c.type==='spent') out.push({kind:'expense',fund:fundOfSite(c.propertyId),dir:-1,date:c.date||'',amount:amt,site:c.propertyId||'',siteName:_pName(c.propertyId),text:c.note||'Expense',src:'cash',id:c.id,raw:c});
    else if(c.type==='handover') out.push({kind:'handover',fund:fundOfSite(c.propertyId),dir:-1,date:c.date||'',amount:amt,site:c.propertyId||'',siteName:_pName(c.propertyId),text:'Handed to owner'+(c.note?' — '+c.note:''),src:'cash',id:c.id,raw:c});
    else if(c.type==='returned') out.push({kind:'returned',fund:'kd',dir:-1,date:c.date||'',amount:amt,site:'',siteName:'',text:'Returned to KD'+(c.note?' — '+c.note:''),src:'cash',id:c.id,raw:c});
    else if(c.type==='refundout') out.push({kind:'refund',fund:fundOfSite(c.propertyId),dir:-1,date:c.date||'',amount:amt,site:c.propertyId||'',siteName:_pName(c.propertyId),text:c.note||'Security refund',src:'refund',id:c.id,raw:c});
    else if(c.type==='tenantpay') out.push({kind:'rent',fund:fundOfSite(c.propertyId),dir:1,date:c.date||'',amount:amt,site:c.propertyId||'',siteName:_pName(c.propertyId),text:c.note||'Final balance from tenant',src:'refund',id:c.id,raw:c});
  });
  (S.expenses||[]).filter(e=>e.paidBy===staff&&!e.fromCash).forEach(e=>{
    out.push({kind:'expense',fund:fundOfSite(e.propertyId),dir:-1,date:e.date||'',amount:_expAmt(e),site:e.propertyId||'',siteName:_pName(e.propertyId),text:(e.items||[]).map(i=>i.desc).join(', ')||'Expense',src:'exp',id:e.id,raw:e});
  });
  const rents=[];
  (S.properties||[]).forEach(p=>(p.rooms||[]).forEach(r=>(r.payments||[]).forEach(py=>{
    if(py.mode!=='Cash'||py.receivedBy!==staff)return;
    rents.push({kind:'rent',fund:isOwnerSite(p)?p.id:'kd',dir:1,date:py.date||((py.month||'')+'-01'),amount:Number(py.amount||0),site:p.id,siteName:p.name,
      text:'Cash rent — '+((r.tenant&&r.tenant.name)||r.type)+' ('+r.type+(r.unitNo?' #'+r.unitNo:'')+') for '+ml(py.month),src:'pay',id:py.id,pid:p.id,rid:r.id});
  })));
  rents.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const taken={};
  rents.forEach(e=>{
    out.push(e);
    const p=siteById(e.site); if(!isOwnerSite(p))return;
    const charge=Number(p.maintCharge||0); if(!charge)return;
    const key=e.site+'|'+(e.date||'').slice(0,7);
    const t=Math.min(charge-(taken[key]||0),e.amount); if(t<=0)return;
    taken[key]=(taken[key]||0)+t;
    out.push({kind:'maint',fund:e.site,dir:-1,date:e.date,amount:t,site:e.site,siteName:p.name,text:'Maintenance charge → KD’s account',src:'auto',id:'m_'+e.id});

  });
  return out.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.kind==='maintin'||a.kind==='maint'?1:0)-(b.kind==='maintin'||b.kind==='maint'?1:0)||(b.dir-a.dir));
}
function directExpenses(from,to){ // paid by KD / client / not set — listed under the right account, not part of staff cash

function chCb(d){ const[y,m]=cbMo.split('-').map(Number);const step=cbPer==='3m'?3:cbPer==='6m'?6:cbPer==='fy'?12:1;const dt=new Date(y,m-1+d*step);cbMo=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');renderCashBook(); }
const CB_KIND={refund:['💸','Security refund','var(--purple)'],rent:['💵','Cash rent','var(--green)'],given:['➕','Cash received','var(--green)'],expense:['🧾','Expense','var(--amber)'],handover:['🤝','To owner','var(--purple)'],returned:['↩️','Returned to KD','var(--blue)'],maint:['🔁','Maintenance charge','var(--blue)'],maintin:['🔁','Maintenance charge','var(--green)']};
// A site is treated as an "owner's account" if it's set that way in ⚙️ Sites OR if cash has ever been handed to its owner.
function ownerLike(pid){ const p=siteById(pid); if(!p)return false; return isOwnerSite(p)||(S.cash||[]).some(c=>c.type==='handover'&&c.propertyId===pid); }
function _secKey(e){ return (e.kind==='given'||e.kind==='returned'||e.kind==='maintin')?'_kd':(e.site||'_misc'); }
function cashBookMonth(staff,month,filter){ return cashBookRange(staff,month+'-01',_mEnd(month),filter,month); }
function cashBookRange(staff,from,to,filter,month){
  const all=cashBookEntries(staff);
  const inM=e=>(e.date||'')>=from&&(e.date||'')<=to, before=e=>(e.date||'')<from;
  const direct=directExpenses(from,to);
  const keys=new Set();
  all.filter(inM).forEach(e=>keys.add(_secKey(e)));
  direct.forEach(x=>keys.add(x.site||'_misc'));
  S.properties.forEach(p=>{ if(ownerLike(p.id)&&all.some(e=>_secKey(e)===p.id&&before(e)))keys.add(p.id); }); // owner money still held from earlier months
  const order=[...S.properties.map(p=>p.id).filter(id=>keys.has(id)),...(keys.has('_misc')?['_misc']:[]),...(keys.has('_kd')?['_kd']:[])];
  const sum=(rows,k)=>rows.filter(e=>e.kind===k).reduce((s,e)=>s+e.amount,0);
  const mk_=k=>{
    const ke=all.filter(e=>_secKey(e)===k), rows=ke.filter(inM);
    const owner=k[0]!=='_'&&ownerLike(k);
    const openAll=ke.filter(before).reduce((s,e)=>s+e.dir*e.amount,0);
    const opening=owner?openAll:0;
    const net=rows.reduce((s,e)=>s+e.dir*e.amount,0);
    const p=k[0]==='_'?null:siteById(k);
    return{key:k,name:k==='_kd'?'Cash from / to KD':k==='_misc'?'Misc / General':(p?p.name:'?'),owner,charge:p?Number(p.maintCharge||0):0,
      rows,opening,net,closing:opening+net,openAll,closeAll:openAll+net,
      collected:sum(rows,'rent'),maint:sum(rows,'maint'),maintIn:sum(rows,'maintin'),given:sum(rows,'given'),expenses:sum(rows,'expense'),handover:sum(rows,'handover'),returned:sum(rows,'returned'),refund:sum(rows,'refund'),
      direct:direct.filter(x=>(x.site||'_misc')===k)};
  };
  const allSecs=order.map(mk_);
  const sections=filter==='all'?allSecs:(Array.isArray(filter)?filter:[filter]).map(k=>allSecs.find(s=>s.key===k)||mk_(k));
  const real=e=>e.kind!=='maint'&&e.kind!=='maintin';
  const inMonth=all.filter(e=>inM(e)&&real(e));
  const opening=all.filter(before).reduce((s,e)=>s+e.dir*e.amount,0);
  const tIn=inMonth.filter(e=>e.dir>0).reduce((s,e)=>s+e.amount,0), tOut=inMonth.filter(e=>e.dir<0).reduce((s,e)=>s+e.amount,0);
  const closing=opening+tIn-tOut;
  const ownerHeld=allSecs.filter(s=>s.owner).map(s=>({name:s.name,amount:s.closing}));
  const kdHeld=closing-ownerHeld.reduce((s,x)=>s+x.amount,0);
  const close=month?((S.cashCloses||[]).find(c=>c.staff===staff&&c.month===month)||null):null;
  const closes=[]; for(let m=from.slice(0,7); m<=to.slice(0,7); m=_mAdd(m,1)) closes.push({month:m,c:(S.cashCloses||[]).find(c=>c.staff===staff&&c.month===m)||null});
  // totals for the ticked sites only: each site's own running balance (opening on the From date → closing on the To date)
  const sel={opening:0,inn:0,out:0,direct:0,closing:0};
  sections.forEach(x=>{ sel.opening+=x.openAll; x.rows.forEach(e=>{ if(e.dir>0)sel.inn+=e.amount; else sel.out+=e.amount; }); sel.direct+=x.direct.reduce((a,y)=>a+y.amount,0); });
  sel.closing=sel.opening+sel.inn-sel.out;
  return{from,to,opening,tIn,tOut,closing,nowBal:all.reduce((s,e)=>s+e.dir*e.amount,0),sections,ownerHeld,kdHeld,close,closes,sel,unassigned:unassignedCash(from,to)};
}

function _cbReportData(){
  const per=cbPeriod(), eff=cbEffFilter(), fArg=eff.f, staff=_cbStaff(), d=cashBookRange(staff,per.from,per.to,fArg,per.month);
  const filtered=fArg!=='all';
  const sel=d.sel;
  const tiles=filtered
    ?[['OPENING · '+fd(per.from).toUpperCase(),sel.opening,'#1A1A1A'],['CASH IN',sel.inn,'#10B981'],['CASH OUT',sel.out,'#F97316'],['CLOSING · '+fd(per.to).toUpperCase(),sel.closing,sel.closing<0?'#EF4444':'#3B82F6']]
    :[['OPENING · '+fd(per.from).toUpperCase(),d.opening,'#1A1A1A'],['CASH IN',d.tIn,'#10B981'],['CASH OUT',d.tOut,'#F97316'],[staff.toUpperCase()+' SHOULD HAVE',d.closing,d.closing<0?'#EF4444':'#3B82F6']];
  // each section with a running balance
  const secs=d.sections.map(s=>{
    const showOpen=s.owner||filtered;
    let bal=showOpen?s.openAll:0;
    const rows=s.rows.map(e=>{ bal+=e.dir*e.amount; return {...e,bal}; });
    const tin=s.rows.filter(e=>e.dir>0).reduce((a,e)=>a+e.amount,0), tout=s.rows.filter(e=>e.dir<0).reduce((a,e)=>a+e.amount,0);
    const st=cbSecStatus(s,staff);
    return {...s,showOpen,rows,tin,tout,end:bal,statusText:st?st[0].replace('✓ ',''):'',statusTone:st?(st[1]==='badge-grn'?'#10B981':st[1]==='badge-red'?'#EF4444':'#D97706'):'#9CA3AF'};
  });
  return {per,autoKd:eff.autoKd,fArg,staff,d,filtered,sel,tiles,secs,label:cbSelLabel()+(eff.autoKd?' + Cash from/to KD':''),printDate:new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'})};
}

      {text:e.dir>0?M(e.amount):'',fontSize:8,alignment:'right',color:'#10B981',bold:true},{text:e.dir<0?M(e.amount):'',fontSize:8,alignment:'right',color:'#D97706',bold:true},
      {text:M(e.bal),fontSize:8,alignment:'right',bold:true,color:e.bal<0?'#EF4444':'#1A1A1A'}]));

    const last=body.length-1;
    blk.push({table:{headerRows:1,widths:[58,70,'*',62,62,66],body,dontBreakRows:true},

        fillColor:(ri,node)=>(ri>0&&ri<node.table.body.length-1&&ri%2===0)?'#FAFAFA':null,paddingLeft:()=>4,paddingRight:()=>4,paddingTop:()=>4,paddingBottom:()=>4}});
    if(s.direct.length){
      const db=[[{text:'Paid directly — not from '+R.staff+'\'s cash · '+M(s.direct.reduce((a,x)=>a+x.amount,0)),colSpan:4,bold:true,color:'#92400E',fillColor:'#FEF3C7',fontSize:8},{},{},{}]];

  });
  const nr=(l,v,lc,vc,big)=>({margin:[0,2,0,2],columns:[{text:l,color:lc,fontSize:big?12:10,bold:!!big},{text:typeof v==='string'?v:M(v),color:vc,fontSize:big?13:10,bold:!!big,alignment:'right'}]});

      R.per.month?small('Cash counted'+(cl?' ('+fd(cl.on)+', '+cl.by+')':''),cl?M(cl.actual)+(cl.diff?'  (difference '+(cl.diff>0?'+':'−')+M(Math.abs(cl.diff))+')':'  matches'):'______________')
        :small('Monthly cash count',d.closes.map(x=>_mShortL(x.month)+' '+(x.c?(x.c.diff?'diff '+M(x.c.diff):'✓'):'✗')).join(' · '))];
  content.push({margin:[0,10,0,0],unbreakable:true,table:{widths:['*'],body:[[{stack,fillColor:'#1A1A1A',margin:[12,10,12,10]}]]},layout:'noBorders'});
  content.push({margin:[0,30,0,0],unbreakable:true,columns:[R.staff,'Checked by (KD)','Date'].map(t=>({stack:[{canvas:[{type:'line',x1:0,y1:0,x2:220,y2:0,lineWidth:0.6,lineColor:'#9CA3AF'}]},{text:t,fontSize:9,color:'#6B7280',alignment:'center',margin:[0,4,0,0]}]})),columnGap:30});
  content.push({margin:[0,16,0,0],columns:[{text:'K.D. Constructions · www.kdcinfra.in',fontSize:8,color:'#9CA3AF'},{text:'Cash & Expense Report · '+R.label+' · '+R.per.label,fontSize:8,color:'#9CA3AF',alignment:'right'}]});
  return {pageSize:'A4',pageOrientation:'landscape',pageMargins:[20,20,20,25],content,defaultStyle:{fontSize:9},styles:{th:{bold:true,fontSize:8,color:'#6B7280',fillColor:'#F9FAFB'}}};
}
function _cbFileTitle(){ const f=cbFilterArg(); const label=f==='all'?'All-Sites':f.map(cbKeyName).join('-'); return 'Cash-Expenses-'+label+'-'+cbPeriod().slug; }
async function shareCashBook(){
  const f=cbFilterArg(); if(f!=='all'&&!f.length){toast('Tick at least one site');return;}
  // 1. vector PDF (pdfmake) — same as Billing   2. html2pdf fallback   3. print
  try{
    await loadPdfMake();
    if(window.pdfMake){
      const fileName=pdfName(_cbFileTitle()), title='Cash & Expense Report — '+cbSelLabel()+' — '+cbPeriod().label;
      toast('📄 Building PDF...',2500);
      const ok=await new Promise(resolve=>{
        try{
          pdfMake.createPdf(buildCashBookDocDef()).getBlob(async blob=>{
            try{
              if(window.File&&navigator.canShare&&navigator.share){
                const file=new File([blob],fileName,{type:'application/pdf'});
                if(navigator.canShare({files:[file]})){
                  try{ await navigator.share({files:[file],title,text:title}); toast('✅ Pick WhatsApp from share menu',3000); resolve(true); return; }
                  catch(err){ if(err.name==='AbortError'){resolve(true);return;} }
                }
              }
              downloadPdfBlob(blob,fileName); toast('📄 PDF saved — open WhatsApp & attach from Downloads',5000); resolve(true);
            }catch(e){ try{downloadPdfBlob(blob,fileName);resolve(true);}catch(e2){resolve(false);} }
          });
        }catch(e){ console.error('cash pdf build failed',e); resolve(false); }
      });
      if(ok)return;
    }
  }catch(e){ console.error('pdfmake load failed',e); }
  if(await shareReportPdfBlob(buildCashBookHtml(),_cbFileTitle()))return;
  printCashBook();
}
function printCashBook(){
  const html=buildCashBookHtml();
  try{ const url=URL.createObjectURL(new Blob([html],{type:'text/html'})); const w=window.open(url,'_blank');
    if(w){ setTimeout(()=>{try{w.print();}catch(e){}},900); toast('📄 Choose Save as PDF or Share in the print screen',5000); }
    else{ const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); toast('📄 Opened printable report — use browser Print / Save as PDF',5000); }
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ toast('❌ Could not open print view'); }
}

function saveCbEntry(){
  const v=id=>(document.getElementById(id)||{}).value;
  const date=v('cbD'), amt=Number(v('cbA')||0), note=(v('cbN')||'').trim();
  if(!date){toast('❌ Pick a date');return;} if(!(amt>0)){toast('❌ Enter the amount');return;}
  if(!S.cash)S.cash=[]; if(!S.expenses)S.expenses=[];
  const k=_cbKind;
  if(_cbEdit){
    const x=_cbEdit; x.date=date; x.amount=amt; x.note=note;
    if(document.getElementById('cbP')){ x.propertyId=v('cbP'); x.propertyLabel=_pName(x.propertyId)||'Other / General'; }
    if(document.getElementById('cbS')) x.staff=v('cbS');
    if(document.getElementById('cbSrc')) x.source=v('cbSrc');
    if(x.type==='spent'){ const e=S.expenses.find(e=>e.cashId===x.id); if(e){ e.date=date; e.month=date.slice(0,7); e.propertyId=x.propertyId; e.items=[{desc:note,amount:amt}]; } }
    actLog('Cash entry edited — '+fm(amt)+' ('+(x.type)+')');
    sched(); closeM(); renderTab(); toast('✅ Updated'); return;
  }
  if(k==='expense'){
    if(!note){toast('❌ Say what the expense was for');return;}
    const pid=v('cbP'), by=v('cbBy');
    S.expenses.push({id:uid(),propertyId:pid,date,month:date.slice(0,7),items:[{desc:note,amount:amt}],addedBy:user,paidBy:by});
    actLog('Expense added — '+(_pName(pid)||'Misc')+' '+fm(amt)+' paid by '+by+' ('+note+')');
  } else if(k==='handover'){
    const pid=v('cbP'); if(!pid){toast('❌ Pick the site');return;}
    S.cash.push({id:uid(),type:'handover',staff:v('cbS'),date,amount:amt,propertyId:pid,propertyLabel:_pName(pid),note,by:user});
    actLog('Cash handed to owner — '+_pName(pid)+' '+fm(amt)+' by '+v('cbS'));

function chCash(d){
  if(cashMo==='all'){cashMo=mk();return renderCash();}
  const[y,m]=cashMo.split('-').map(Number);
  const dt=new Date(y,m-1+d);
  cashMo=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
  renderCash();
}

// Build combined cash ledger entries (S.cash + Expenses Tab entries by Preeti)
function buildCashLedger(){
  if(!S.cash)S.cash=[];
  if(!S.expenses)S.expenses=[];
  // Existing cash entries
  const cashEntries=S.cash.map(x=>({
    _src:'cash',id:x.id,type:x.type,date:x.date,amount:Number(x.amount||0),
    propertyLabel:x.propertyLabel||'Other / General',note:x.note||'',
    by:x.by||'',source:x.source||'',fromCash:false
  }));
  // Expenses Tab entries paid by Preeti (not already in cash via fromCash flag)
  const expEntries=S.expenses
    .filter(e=>e.paidBy==='Preeti'&&!e.fromCash)
    .map(e=>{
      const amt=(e.items||[]).reduce((s,i)=>s+Number(i.amount||0),0);
      const propName=e.propertyId?((S.properties.find(p=>p.id===e.propertyId)||{}).name||'Other'):'Other / General';
      const desc=(e.items||[]).map(i=>i.desc).join(', ');
      return{_src:'exp',id:e.id,type:'spent',date:e.date||'',amount:amt,
        propertyLabel:propName,note:desc,by:e.addedBy||'Preeti',source:'',fromCash:false,_expId:e.id};
    });
  return [...cashEntries,...expEntries].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}

function saveSpendCash(){

  const pLabel=pid?((S.properties.find(x=>x.id===pid)||{}).name||'Unknown'):'Other / General';

function delCash(id){

// ══════════════════════════════════════════════════════
// 📎 TENANT DOCUMENTS (v2)
// Documents belong to the TENANT (and each co-tenant), not the room.
//   holder = r.tenant (or r.token for a pre-booked tenant)
//   holder.docs = { main:{aadhaar:[file,…], pan:[…], …}, co_<name>:{…} }
//   file = {ref, n, name, size, bytes, mime, at, by, drive}  — data in rentdesk_docs/f_<ref>_<i> (chunks)
//   older uploads (room-based r.docs, one file in rentdesk_docs/<roomId>_<key>) are kept as {lr, lk, …}
// When the tenant vacates, the whole docs object moves to their Past Tenant record.
// ══════════════════════════════════════════════════════
const DOC_CHUNK=700000;
const _docMem={};                       // ref → data URL (this session)
function _docHolder(r){ return r?(r.tenant||r.token||null):null; }
function _slug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function _coKey(c){ return 'co_'+_slug(c&&c.name); }
function _docPersons(h,coList){
  if(!h)return [];
  const out=[{key:'main',name:h.name||'Tenant',role:'Tenant'}];
  (coList||[]).forEach(c=>{ if(c&&c.name&&!out.some(o=>o.key===_coKey(c)))out.push({key:_coKey(c),name:c.name,role:'Co-tenant'}); });
  return out;
}
function _roomCo(r){ return (r.coTenants&&r.coTenants.length?r.coTenants:((r.token&&r.token.coTenants)||[])); }
function _slot(h,pk,dk){ return ((((h||{}).docs||{})[pk]||{})[dk])||[]; }
function _hasDoc(h,pk,dk){ return _slot(h,pk,dk).length>0; }
function _isoDay(s){ return String(s||'').slice(0,10); }
function _minusDays(d,n){ if(!d)return ''; const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()-n); return x.toISOString().slice(0,10); }

// Move old room-based uploads (r.docs) onto the right person: the current tenant if uploaded after they
// booked/moved in, otherwise the past tenant who lived there at the time. Runs once per room, silently.
function _settleLegacyDocs(p,r){
  if(!r||!r.docs||!Object.keys(r.docs).length)return false;
  const h=_docHolder(r);
  const cutoff=h?_minusDays(_isoDay(h.tokenDate||h.createdAt||h.moveInDate),45):'';
  Object.keys(r.docs).forEach(dk=>{
    const m=r.docs[dk]; if(!m)return;
    const at=_isoDay(m.uploadedAt);
    const file={lr:r.id,lk:dk,name:m.name||dk,size:Number(m.size||0),bytes:Math.round(Number(m.size||0)*1.37),mime:m.mimeType||'',at:m.uploadedAt||'',by:''};
    let target=null;
    if(h&&(!at||!cutoff||at>=cutoff))target=h;
    else{
      const cands=(S.pastTenants||[]).filter(t=>t.roomId===r.id&&(!at||!t.vacatingDate||at<=t.vacatingDate)).sort((a,b)=>(a.vacatingDate||'').localeCompare(b.vacatingDate||''));
      target=cands[0]||h||null;
    }
    if(!target)return;
    if(!target.docs)target.docs={};
    if(!target.docs.main)target.docs.main={};
    const arr=target.docs.main[dk]||(target.docs.main[dk]=[]);
    if(!arr.some(f=>f.lr===file.lr&&f.lk===file.lk))arr.unshift(file);
  });
  delete r.docs;
  return true;
}
let _legacyDone=false;
function _settleAllLegacyDocs(){
  if(_legacyDone||!dataLoadedFromFirebase)return;
  _legacyDone=true; let ch=false;
  (S.properties||[]).forEach(p=>(p.rooms||[]).forEach(r=>{ if(_settleLegacyDocs(p,r))ch=true; }));
  if(ch){ actLog('Documents moved from rooms to tenants (one-time)'); sched(); }
}

// Required-document status for the room card / dashboard (main tenant only)
function docCompleteness(r){
  const h=_docHolder(r);
  const has=dk=>h?_hasDoc(h,'main',dk):!!((r.docs||{})[dk]);
  const mr=DOC_TYPES.filter(d=>d.required&&!has(d.key));
  return{uploaded:DOC_TYPES.filter(d=>has(d.key)).length,missingRequired:mr.length,total:DOC_TYPES.length,missing:mr,police:has('police_ver')};
}

// ── storage of the actual files (chunked, so big PDFs work) ──
async function _putFileData(dataUrl,name,mime){
  const ref=uid(), n=Math.ceil(dataUrl.length/DOC_CHUNK);
  for(let i=0;i<n;i++){
    const ok=await saveDocToFS('f',ref+'_'+i,dataUrl.slice(i*DOC_CHUNK,(i+1)*DOC_CHUNK),name,mime);
    if(!ok){ for(let j=0;j<i;j++)deleteDocFromFS('f',ref+'_'+j); return null; }
  }
  _docMem[ref]=dataUrl;
  return {ref,n};
}
async function _getFileData(f){
  const k=f.ref||(f.lr+'_'+f.lk);
  if(_docMem[k])return _docMem[k];
  let data='';
  if(f.ref){
    const parts=await Promise.all(Array.from({length:f.n||1},(_,i)=>loadDocFromFS('f',f.ref+'_'+i)));
    if(parts.some(x=>!(x&&x.data)))return null;
    data=parts.map(x=>x.data).join('');
  }else{
    const d=await loadDocFromFS(f.lr,f.lk); if(!(d&&d.data))return null; data=d.data;
  }
  _docMem[k]=data; return data;
}
function _delFileData(f){ if(f.ref){ for(let i=0;i<(f.n||1);i++)deleteDocFromFS('f',f.ref+'_'+i); } else if(f.lr)deleteDocFromFS(f.lr,f.lk); }

// ── shrinking ──
function _readAsDataURL(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=e=>res(e.target.result); fr.onerror=rej; fr.readAsDataURL(file); }); }
function _loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function _shrinkPhoto(file){
  const src=await _readAsDataURL(file);
  let img; try{ img=await _loadImg(src); }catch(e){ return null; }
  const go=(max,q)=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',q); };
  let d=go(1700,0.72); if(d.length>620000)d=go(1400,0.62); if(d.length>620000)d=go(1200,0.55);
  return d;
}
async function _ensurePdfJs(){
  if(window.pdfjsLib)return;
  await new Promise((resolve,reject)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload=resolve; s.onerror=reject; document.head.appendChild(s); });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
function _dataUrlToU8(d){ const b=atob(d.split(',')[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return u; }
// Big scanned PDFs: re-save each page as a compressed image (keeps it readable, ~1/4 the size)
async function _shrinkPdf(dataUrl,onPage){
  await _ensurePdfJs();
  if(!(window.jspdf&&window.jspdf.jsPDF))await new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); });
  const JS=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF; if(!JS)return null;
  const pdf=await window.pdfjsLib.getDocument({data:_dataUrlToU8(dataUrl)}).promise;
  let out=null;
  for(let i=1;i<=pdf.numPages;i++){
    if(onPage)onPage(i,pdf.numPages);
    const page=await pdf.getPage(i); const v1=page.getViewport({scale:1});
    const sc=Math.min(2,1400/Math.max(v1.width,v1.height)*1.0); const vp=page.getViewport({scale:Math.max(sc,1)});
    const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:x,viewport:vp}).promise;
    const jpg=c.toDataURL('image/jpeg',0.62);
    const w=v1.width, hgt=v1.height, o=w>hgt?'l':'p';
    if(!out)out=new JS({orientation:o,unit:'pt',format:[w,hgt]}); else out.addPage([w,hgt],o);
    out.addImage(jpg,'JPEG',0,0,w,hgt);
  }
  return out?out.output('datauristring').replace(/^data:application\/pdf;filename=[^;]*;/,'data:application/pdf;'):null;
}

// ── where documents live: a room's current tenant, or a past tenant ──
// ctx = {kind:'room',pid,rid} | {kind:'past',tid}
function _ctxHolder(ctx){
  if(ctx.kind==='past')return (S.pastTenants||[]).find(t=>t.id===ctx.tid)||null;
  const p=S.properties.find(x=>x.id===ctx.pid), r=((p&&p.rooms)||[]).find(x=>x.id===ctx.rid);
  return _docHolder(r);
}
function _ctxCo(ctx){
  if(ctx.kind==='past'){ const t=_ctxHolder(ctx); return (t&&t.coTenants)||[]; }
  const p=S.properties.find(x=>x.id===ctx.pid), r=((p&&p.rooms)||[]).find(x=>x.id===ctx.rid); return r?_roomCo(r):[];
}

// The lease period a newly uploaded lease deed belongs to: the room's latest lease deed in the Lease tab, else the room's lease dates

  if(ctx.kind!=='room')return null;
  const p=S.properties.find(x=>x.id===ctx.pid), r=((p&&p.rooms)||[]).find(x=>x.id===ctx.rid); if(!r)return null;

  if(ls.length)return {start:ls[0].leaseStart,end:ls[0].leaseEnd};

let _docTarget=null;
function setDocTarget(ctx,person,docKey){ _docTarget={ctx,person,docKey}; const el=document.getElementById('docFileInput'); if(el){el.value=''; el.multiple=true;} }
async function handleDocUpload(event){
  const tg=_docTarget; if(!tg)return;
  const files=Array.from((event.target&&event.target.files)||[]); if(!files.length)return;
  if(!_ctxHolder(tg.ctx)){toast('❌ Tenant not found');return;}
  const dt=DOC_TYPES.find(d=>d.key===tg.docKey)||{label:tg.docKey};
  let done=0;
  const hold=()=>{ window._lastEdit=Date.now(); };          // stop the 20-second cloud refresh from swapping data mid-upload
  hold(); const holdT=setInterval(hold,5000);
  try{
  for(const file of files){
    const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
    const isImg=(file.type||'').startsWith('image/')||/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name);
    if(!isPdf&&!isImg){toast('❌ '+file.name+': please use a PDF or photo');continue;}
    try{
      let data, mime, name=file.name;
      if(isImg){
        toast('⏳ Shrinking '+file.name+'…',8000);
        data=await _shrinkPhoto(file);
        if(!data){toast('❌ Could not read '+file.name+' (iPhone HEIC? take a screenshot of it and upload that)',6000);continue;}
        mime='image/jpeg'; name=name.replace(/\.(heic|heif|png|webp)$/i,'.jpg');
      }else{
        if(file.size>15*1048576){toast('❌ '+file.name+' is over 15 MB — scan it in "document" mode and try again',6000);continue;}
        data=await _readAsDataURL(file); mime='application/pdf';
        if(file.size>2*1048576){
          toast('⏳ Shrinking big PDF…',15000);
          try{ const s=await _shrinkPdf(data,(i,n)=>toast('⏳ Shrinking PDF — page '+i+' of '+n+'…',15000)); if(s&&s.length<data.length)data=s; }catch(e){}
        }
        if(data.length>14000000){toast('❌ '+file.name+' is still over 10 MB after shrinking',6000);continue;}
      }
      toast('⏳ Uploading '+name+'…',15000);
      const put=await _putFileData(data,name,mime);
      if(!put){toast('❌ Upload failed — check internet and try again',5000);continue;}
      const meta={ref:put.ref,n:put.n,name,size:Math.round(data.length*0.75),bytes:data.length,mime,at:new Date().toISOString(),by:user||''};
      if(tg.docKey==='lease_deed'){ const per=_leasePeriodFor(tg.ctx); if(per){ meta.period=per; meta.label='Lease Deed '+fd(per.start)+' – '+fd(per.end)+(files.length>1?' (part '+(done+1)+')':''); } }
      const h=_ctxHolder(tg.ctx);                              // look the tenant up again AFTER the upload (data may have refreshed)
      if(!h){ toast('❌ Tenant not found after upload'); continue; }
      if(!h.docs)h.docs={};
      if(!h.docs[tg.person])h.docs[tg.person]={};
      (h.docs[tg.person][tg.docKey]||(h.docs[tg.person][tg.docKey]=[])).push(meta);
      sched();                                                  // save right away, file by file
      actLog('Document uploaded — '+dt.label+' for '+(h.name||'tenant'));
      driveQueueFile(tg.ctx,tg.person,tg.docKey,meta);
      done++;
    }catch(e){ console.error(e); toast('❌ Could not upload '+file.name,5000); }
  }
  }finally{ clearInterval(holdT); }
  if(done){ sched(); toast('✅ '+done+' file'+(done>1?'s':'')+' uploaded'); }
  _openDocsCtx(tg.ctx,tg.person); if(vRoom)try{renderRoomDetail();}catch(e){}
}
async function delDocFile(ctx,person,docKey,i){

async function viewDocSlot(ctx,person,docKey,only){

    <div class="dv-body" id="dvBody"><div class="dv-msg">⏳ Loading…</div></div>
    <div class="dv-bar"><button class="btn btn-ghost btn-sm" id="dvShare" disabled onclick="dvShare()">📤 Share</button><button class="btn btn-ghost btn-sm" id="dvDl" disabled onclick="dvDownload()">⬇ Download</button><button class="btn btn-orange btn-sm" id="dvPrint" disabled onclick="dvPrint()">🖨 Print</button></div>`;
  ov.classList.add('open'); document.body.style.overflow='hidden';
