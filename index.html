function renderBilling(){
  curTab='billing';
  const mc=document.getElementById('mc');
  const isCurMonth=billMo===mk();
  const monthData=buildMonthlyReportData(billMo);
  // Build property sections with sorted rooms
  let anyTenant=false;
  let grandDue=0,grandPaid=0,grandPend=0;
  const movementCard=monthData.movements.length?`
    <div class="card" style="margin-bottom:14px;">
      <div class="card-head"><div class="card-title">🔁 Month Movements — ${ml(billMo)}</div></div>
      <div class="card-body" style="padding:0;">
        <div style="overflow-x:auto;">
          <table class="tbl">
            <thead><tr><th>Type</th><th>Unit</th><th>Tenant</th><th>Due</th><th>Paid</th><th>Pending</th></tr></thead>
            <tbody>
              ${monthData.movements.map(m=>`
                <tr>
                  <td><span class="badge ${m.kind==='vacated'?'badge-red':'badge-pur'}">${m.kind==='vacated'?'Vacated':'Pre-booked'}</span></td>
                  <td><strong>${m.unit||'—'}</strong></td>
                  <td><strong>${m.tenant||'—'}</strong></td>
                  <td>${fm(m.due||m.rent||0)}</td>
                  <td style="color:var(--green);font-weight:600;">${fm(m.paid||0)}</td>
                  <td style="color:${(m.pending||0)>0?'var(--red)':'var(--green)'};font-weight:700;">${(m.pending||0)>0?fm(m.pending):'✓'}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`:'';
  const propSections=S.properties.map(p=>{
    const allSortedRooms=sortRooms(p.rooms||[]);
    const liveTenants=allSortedRooms.filter(r=>{
      if(!isRoomOccupied(r))return false;
      // Exclude a currently-active tenant from months before they actually existed —
      // otherwise someone who moved in in August still shows a (zeroed-out) row in June
      // and July, which is confusing clutter even though the rent amount itself already
      // correctly computes to 0 for those months. They show as a vacant row instead
      // (see vacantRooms below), not disappear entirely.
      const moveInDate=(r.tenant&&(r.tenant.activeFrom||r.tenant.moveInDate))||(r.lease&&r.lease.startDate)||'';
      if(moveInDate&&moveInDate.slice(0,7)>billMo)return false;
      return true;
    });
    const vacatedThisMonth=(S.pastTenants||[]).filter(t=>t.propertyId===p.id&&sameMonthDate(t.vacatingDate,billMo));
    // Rooms that were genuinely vacant for this specific month — either a room with no
    // current occupant at all, or a currently-occupied room whose tenant hadn't moved in
    // yet during this month. Shown as a visible vacant row (₹0 everywhere) rather than
    // silently missing from the list, so the room count stays accurate at a glance.
    const liveIds=new Set(liveTenants.map(r=>r.id));
    const vacatedIds=new Set(vacatedThisMonth.map(t=>t.roomId));
    const vacantRooms=allSortedRooms.filter(r=>!liveIds.has(r.id)&&!vacatedIds.has(r.id));
    const hasAny=liveTenants.length||vacatedThisMonth.length;
    if(!hasAny)return'';
    anyTenant=true;
    let pRent=0,pDue=0,pPaid=0,pPend=0,pElec=0,pDeposits=0;
    const rows=liveTenants.map(r=>{
      const elec=(r.electricityReadings||[]).find(x=>x.month===billMo);
      const paid=(r.payments||[]).filter(x=>x.month===billMo).reduce((s,x)=>s+Number(x.amount||0),0);
      const bal=getCarryIn(r,billMo);
      const dedTotal=(r.deductions||[]).filter(d=>d.month===billMo).reduce((s,d)=>s+Number(d.amount||0),0);
      const activeStart=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
      const rentAmt=proratedRentForMonth(rentForMonth(r,billMo),activeStart,billMo);
      const isProrated=rentAmt<Number(r.rent||0);
      // Security due — only folded into Total Due during the tenant's actual move-in
      // month, when it's a fresh charge. In every month after that, an unpaid security
      // amount is already flowing forward through the carry-in (bal) above — adding it
      // again here would double-count the same debt a second time.
      const secAdvDue=securityAdvanceDueForMonth(r,billMo);
      const isMoveInMonth=activeStart&&sameMonthDate(activeStart,billMo);
      const secOnlyPending=(secAdvDue&&isMoveInMonth)?secAdvDue.secPending:0;
      const total=rentAmt+Number((elec&&elec.amount)||0)+bal-dedTotal+secOnlyPending,pend=total-paid;
      const closingBal=Math.max(0,pend);
      const monthDeposits=depositLedgerForMonth(r,billMo);
      const monthDepositsTotal=monthDeposits.reduce((s,e)=>s+Number(e.amount||0),0);
      // Cumulative total-to-date (all months), broken down by type — this is what answers
      // "how much security have we collected in total" at a glance, any month you're viewing.
      const cumSec=depositLedgerTotal(r,'security'),cumToken=depositLedgerTotal(r,'token'),cumAdv=depositLedgerTotal(r,'advance');
      const cumSecTotal=cumSec+cumToken;
      pRent+=rentAmt;pDue+=total;pPaid+=paid;pPend+=pend;pElec+=Number((elec&&elec.amount)||0);pDeposits+=monthDepositsTotal;
      grandDue+=total;grandPaid+=paid;grandPend+=pend;
      const depositLabel={token:'🔑 Token',security:'🔐 Security',advance:'💸 Advance'};
      const depositBreakdown=[cumToken>0?`🔑${fm(cumToken)}`:null,cumSec>0?`🔐${fm(cumSec)}`:null].filter(Boolean).join(' + ');
      return`<tr>
        <td><strong>${r.type}${r.unitNo?' #'+r.unitNo:''}</strong></td>

        <td style="font-weight:600">${fm(rentAmt)}${isProrated?`<div style="font-size:10px;color:var(--blue);font-weight:400;">pro-rata</div>`:''}${secOnlyPending>0?`<div style="font-size:10px;color:var(--amber);font-weight:600;">+ ${fm(secOnlyPending)} security</div>`:''}</td>
        <td style="font-size:11px;">
          ${secAdvDue?`<div style="background:${secAdvDue.pending>0?'#FEF3C7':'#F0FDF4'};border-radius:6px;padding:5px 7px;margin-bottom:5px;">
            <div style="font-size:10px;color:var(--muted);">Security+Advance Due</div>
            <div style="color:${secAdvDue.pending>0?'var(--amber)':'var(--green)'};font-weight:700;">${secAdvDue.pending>0?fm(secAdvDue.pending)+' pending':'✓ Fully collected'}</div>
            <div style="font-size:9px;color:var(--muted);">Target ${fm(secAdvDue.totalTarget)} (Sec ${fm(secAdvDue.secTarget)}+Adv ${fm(secAdvDue.advTarget)}) − ${fm(secAdvDue.collected)} collected</div>
            ${secAdvDue.pending>0?`<button class="btn btn-purple btn-xs" style="margin-top:3px;" onclick="openDepositEntry('${p.id}','${r.id}','${billMo}')">+ Collect</button>`:''}
          </div>`:''}
          ${(isMoveInMonth&&cumSecTotal>0)?`<div style="color:var(--purple);font-weight:700;">🔐 ${fm(cumSecTotal)} total</div><div style="color:var(--muted);font-size:10px;">(${depositBreakdown})</div>`:(secAdvDue?'':'<span style="color:var(--muted);">—</span>')}
          ${(isMoveInMonth&&cumAdv>0)?`<div style="color:var(--muted);font-size:10px;margin-top:2px;">💸 Advance ${fm(cumAdv)}</div>`:''}
          ${monthDeposits.length?`<div style="margin-top:4px;padding-top:4px;border-top:1px dashed var(--border);color:var(--orange);font-size:10px;font-weight:600;">+${fm(monthDepositsTotal)} this month</div>`:''}
        </td>
        <td style="font-size:12px;color:var(--muted)">${elec?elec.oldReading+'→'+elec.reading:'—'}</td>
        <td style="color:var(--blue);font-weight:600">${elec?elec.units:'—'}</td>
        <td>${elec?`<span style="color:var(--green);font-weight:600">${fm(elec.amount)}</span> <button class="btn btn-orange btn-xs" onclick="openElecBill('${p.id}','${r.id}','${billMo}')">Bill</button> <button class="btn btn-ghost btn-xs" onclick="openElec('${p.id}','${r.id}','${billMo}')" title="Edit reading">✏</button>`:`<button class="btn btn-ghost btn-xs" onclick="openElec('${p.id}','${r.id}','${billMo}')">+Add</button>`}</td>
        <td>${bal>0?`<span style="color:var(--red);font-weight:600">${fm(bal)}</span> <button class="btn btn-ghost btn-xs" onclick="openEditBalance('${p.id}','${r.id}')" title="Edit balance">✏</button>`:`<span style="color:var(--muted);">—</span> <button class="btn btn-ghost btn-xs" onclick="openEditBalance('${p.id}','${r.id}')" title="Edit balance">✏</button>`}</td>
        <td>${dedTotal>0?`<span style="color:var(--purple);font-weight:600">-${fm(dedTotal)}</span> <button class="btn btn-ghost btn-xs" onclick="openManageDeductions('${p.id}','${r.id}','${billMo}')" title="Manage deductions">✏</button>`:`<button class="btn btn-ghost btn-xs" onclick="openDeduction('${p.id}','${r.id}','${billMo}')">+Add</button>`}</td>
        <td style="color:var(--orange);font-weight:700">${fm(total)}
          <div style="margin-top:4px;"><button class="btn btn-orange btn-xs" onclick="openCombinedBill('${p.id}','${r.id}','${billMo}')">📄 Send Bill</button></div>
        </td>
        <td style="color:var(--green);font-weight:600">${fm(paid)}</td>
        <td>${closingBal>0?`<span style="color:var(--red);font-weight:700;font-size:13px;">${fm(closingBal)}</span>`:'<span style="color:var(--green);font-weight:600;">—</span>'}</td>
        <td><div style="display:flex;flex-direction:column;gap:5px;align-items:flex-start;">
          ${pend<=0

    const vacatedRows=vacatedThisMonth.map(t=>{

      const rentDue=t.finalMonthRentCharged!=null?Number(t.finalMonthRentCharged||0):Number(t.settlement&&t.settlement.rentPending!=null?t.settlement.rentPending:t.rentAmount||0);
      const total=rentDue+elecAmt-dedAmt;

      pRent+=rentDue;pDue+=total;pPaid+=totalPaid;pPend+=pend;

      return`<tr style="background:#FFF7ED;">
        <td><strong>${t.roomType||''}${t.unitNo?' #'+t.unitNo:''}</strong><br/><span style="font-size:10px;color:var(--orange);font-weight:700;">VACATED ${fd(t.vacatingDate)}</span>${t.rentPayableTill&&t.rentPayableTill!==t.vacatingDate?`<br/><span style="font-size:9px;color:var(--muted);">rent till ${fd(t.rentPayableTill)}</span>`:''}</td>
        <td>${t.name||'—'}<br/><span style="font-size:11px;color:var(--muted)">${t.phone||''}</span></td>
        <td style="font-weight:600">${fm(rentDue)}</td>
        <td style="font-size:11px;">${secLedgerThisMonth>0?`<div style="color:var(--purple);font-weight:600;">🔐/🔑 ${fm(secLedgerThisMonth)}</div>`:'<span style="color:var(--muted);">—</span>'}</td>

          <span style="font-size:10px;color:${netRefund>0?'var(--green)':netRefund<0?'var(--red)':'var(--muted)'};">

        <td>—</td>

    }).join('');
    const vacantRows=vacantRooms.map(r=>`<tr style="background:#F9FAFB;color:var(--muted);">
        <td><strong>${r.type}${r.unitNo?' #'+r.unitNo:''}</strong></td>
        <td colspan="2" style="font-style:italic;">Vacant</td>
        <td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td>
        <td>₹0</td><td>₹0</td><td>—</td>
        <td><span class="badge" style="background:#E5E7EB;color:#6B7280;">Vacant</span></td>
        <td>—</td>
      </tr>`).join('');
    return`<div style="margin-bottom:16px;">
      <div style="background:var(--orange);color:#fff;padding:8px 12px;border-radius:8px 8px 0 0;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;">
        <span>🏢 ${p.name}</span>
        <span style="font-size:11px;opacity:0.85;">${liveTenants.length+vacatedThisMonth.length} tenant${(liveTenants.length+vacatedThisMonth.length)!==1?'s':''}${vacantRooms.length?' · '+vacantRooms.length+' vacant':''}</span>
      </div>
      <div style="overflow-x:auto;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;">

        <tbody>${rows}${vacatedRows}${vacantRows}</tbody>

  }).join('');

  mc.innerHTML=`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
    <div style="font-family:'Space Grotesk';font-size:18px;font-weight:700;">⚡ Billing & Collections</div>

function chBill(d){const[y,m]=billMo.split('-').map(Number);const dt=new Date(y,m-1+d);billMo=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');renderBilling();}

function openDepositEntry(pid,rid,defaultMonth){
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r||!p)return;
  const tn=(r.tenant&&r.tenant.name)||'Tenant';
  openM('🔐 Log Security / Token / Advance — '+tn,`
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px;">Use this any time a tenant pays security, token, or advance rent outside of regular monthly rent — so it shows up in that month's billing and stays lookup-able later, even after the tenant vacates.</div>
    <div class="frow"><div><label class="flabel">Type *</label>
      <select class="fselect" id="dep_kind">
        <option value="security">🔐 Security Deposit</option>
        <option value="token">🔑 Token</option>
        <option value="advance">💸 Advance Rent</option>
      </select></div>
    <div><label class="flabel">Amount (₹) *</label>
      <input class="finput" type="number" id="dep_amt" placeholder="0"/></div></div>
    <div class="frow"><div><label class="flabel">Date *</label>
      <input class="finput" type="date" id="dep_date" value="${defaultMonth?defaultMonth+'-01':today()}"/></div>
    <div><label class="flabel">Payment Mode</label>
      <select class="fselect" id="dep_mode"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option></select></div></div>
    <div class="frow1"><label class="flabel">Notes <span style="color:var(--muted);font-weight:400;text-transform:none;">optional</span></label>
      <input class="finput" id="dep_notes" placeholder="e.g. Full security paid on move-in"/></div>`,
    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button>
     <button class="btn btn-orange" onclick="saveDepositEntry('${pid}','${rid}')">Save</button>`);
}
function delDepositEntry(pid,rid,eid){
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r||!r.depositLedger)return;
  if(!confirm('Delete this deposit entry? This cannot be undone.'))return;
  r.depositLedger=r.depositLedger.filter(e=>e.id!==eid);
  syncBalancesFromLedger(r);
  sched();renderRoomDetail();
  toast('🗑 Deposit entry deleted');
}
function saveDepositEntry(pid,rid){
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r)return;
  const kind=document.getElementById('dep_kind').value;
  const amt=Number(document.getElementById('dep_amt').value||0);
  const date=document.getElementById('dep_date').value||today();
  const mode=document.getElementById('dep_mode').value;
  const notes=(document.getElementById('dep_notes')||{}).value||'';
  if(!amt){toast('❌ Enter amount');return;}
  addDepositEntry(r,kind,amt,date,mode,notes);
  syncBalancesFromLedger(r);
  sched();closeM();renderBilling();
  actLog('Deposit logged — '+kind+' ₹'+amt.toLocaleString('en-IN')+' for '+((r.tenant&&r.tenant.name)||'tenant'));
  toast('✅ Logged '+fm(amt)+' as '+kind);
}
function openApplyAdvance(pid,rid,defaultMonth){
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r||!p)return;
  const tn=(r.tenant&&r.tenant.name)||'Tenant';
  const remaining=remainingAdvanceBalance(r);
  if(remaining<=0){toast('❌ No unused advance rent balance for this tenant');return;}
  const mo=defaultMonth||mk();
  const alreadyPaidThisMonth=(r.payments||[]).filter(x=>x.month===mo).reduce((s,x)=>s+Number(x.amount||0),0);
  openM('💸 Apply Advance to Rent — '+tn,`
    <div style="background:var(--blue-dim,#EFF6FF);border:1px solid rgba(59,130,246,0.25);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;">
      <strong>Unused advance balance:</strong> ${fm(remaining)}<br/>
      This applies part or all of it as a rent payment for the month you choose — it's recorded like a real payment, just tagged "Advance Rent" so it stays traceable.
    </div>
    <div class="frow"><div><label class="flabel">Apply to Month *</label>
      <input class="finput" type="month" id="aa_month" value="${mo}"/></div>
    <div><label class="flabel">Amount to Apply (₹) *</label>
      <input class="finput" type="number" id="aa_amt" value="${Math.min(remaining,Number(r.rent||0))}" max="${remaining}"/></div></div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px;">Max available: ${fm(remaining)}${alreadyPaidThisMonth>0?` · This month already has ${fm(alreadyPaidThisMonth)} paid via other methods`:''}</div>`,
    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button>
     <button class="btn btn-orange" onclick="saveApplyAdvance('${pid}','${rid}')">Apply</button>`);
}
function saveApplyAdvance(pid,rid){
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r)return;
  const mo=document.getElementById('aa_month').value;
  const amt=Number(document.getElementById('aa_amt').value||0);
  if(!mo){toast('❌ Choose a month');return;}
  if(!amt){toast('❌ Enter amount');return;}
  const remaining=remainingAdvanceBalance(r);
  if(amt>remaining){toast('❌ Only '+fm(remaining)+' available to apply');return;}
  if(!r.payments)r.payments=[];
  r.payments.push({id:uid(),month:mo,amount:amt,mode:'Advance Rent',date:today(),notes:'Applied from advance rent balance'});
  sched();closeM();
  if(curTab==='billing')renderBilling();else renderRoomDetail();
  actLog('Applied advance rent — '+(r.tenant&&r.tenant.name?r.tenant.name:'tenant')+' ₹'+amt.toLocaleString('en-IN')+' to '+ml(mo));
  toast('✅ Applied '+fm(amt)+' from advance to '+ml(mo));
}
// Keeps the older single-value balance fields (securityBalance, advanceRentStatus) in sync
// with the deposit ledger's running totals, so room detail / booking badges / cards never
// show a stale "pending" balance after a payment has actually been logged.
function syncBalancesFromLedger(r){
  if(!r)return;
  const target=r.tenant||r.token; // whichever is active right now
  if(!target)return;
  const secTotal=Number(target.securityDeposit!=null?target.securityDeposit:(target.security||0));
  const secPaid=depositLedgerTotal(r,'security')+depositLedgerTotal(r,'token'); // token counts toward security
  const secBal=Math.max(0,secTotal-secPaid);
  const advTotal=Number(target.advanceRent||0);
  const advPaid=depositLedgerTotal(r,'advance');
  if(secTotal>0){
    target.securityBalance=secBal;
    if(r.token)r.token.securityBalance=secBal;
    if(r.tenant)r.tenant.securityBalance=secBal;
  }
  if(advTotal>0){
    const advStatus=advPaid>=advTotal?'paid':'pending';
    target.advanceRentStatus=advStatus;
    if(r.token)r.token.advanceRentStatus=advStatus;
    if(r.tenant)r.tenant.advanceRentStatus=advStatus;
  }
}

// ══ CASH & EXPENSES (single tab) ══════════════════════════════════════════
// One passbook per staff member. Built on the existing data — nothing is migrated:
//   IN  : S.cash type 'given' (cash from KD / client / other)
//         room payments with mode 'Cash' and receivedBy = this staff member
//   OUT : S.cash type 'spent' (older cash-tab expenses, already linked to an expense)
//         S.expenses with paidBy = this staff member (not fromCash)
//         S.cash type 'handover' (to a site's owner)  ·  type 'returned' (back to KD)
// Expenses paid by KD / client directly are shown per site but don't touch staff cash.
function staffList(){ if(!Array.isArray(S.staff)||!S.staff.length)S.staff=['Preeti']; return S.staff; }
let cbMo='', cbStaff='', cbSite='all';
function _cbStaff(){ const l=staffList(); if(!cbStaff||!l.includes(cbStaff))cbStaff=(l.includes(user)?user:l[0]); return cbStaff; }
function _pName(pid){ return pid?((S.properties.find(p=>p.id===pid)||{}).name||'Unknown'):''; }
function _expAmt(e){ return (e.items||[]).reduce((s,i)=>s+Number(i.amount||0),0); }
// Every money movement for one staff member, oldest first
// Cash-book setting per site (does NOT affect income or any other report):
//   p.cashMode = 'owner' → cash collected belongs to the site's owner, after p.maintCharge (KD's maintenance charge) per month
//   otherwise           → cash collected belongs to KD (e.g. 798)
function isOwnerSite(p){ return !!p&&p.cashMode==='owner'; }
function siteById(pid){ return S.properties.find(p=>p.id===pid)||null; }
function fundOfSite(pid){ const p=siteById(pid); return isOwnerSite(p)?pid:'kd'; }
// Every money movement for one staff member, oldest first, tagged with the account ("fund") it belongs to.
// Maintenance charges are moved from an owner site's account to KD's account automatically, taken from the
// first cash collected for that site each month (up to the monthly charge).
function cashBookEntries(staff){
  const out=[];
  (S.cash||[]).forEach(c=>{
    const who=c.staff||'Preeti'; if(who!==staff)return;
    const amt=Number(c.amount||0);
    if(c.type==='given') out.push({kind:'given',fund:'kd',dir:1,date:c.date||'',amount:amt,site:'',siteName:'',text:'Cash received'+(c.source?' from '+c.source:'')+(c.note?' — '+c.note:''),src:'cash',id:c.id,raw:c});
    else if(c.type==='spent') out.push({kind:'expense',fund:fundOfSite(c.propertyId),dir:-1,date:c.date||'',amount:amt,site:c.propertyId||'',siteName:_pName(c.propertyId),text:c.note||'Expense',src:'cash',id:c.id,raw:c});
    else if(c.type==='handover') out.push({kind:'handover',fund:fundOfSite(c.propertyId),dir:-1,date:c.date||'',amount:amt,site:c.propertyId||'',siteName:_pName(c.propertyId),text:'Handed to owner'+(c.note?' — '+c.note:''),src:'cash',id:c.id,raw:c});
    else if(c.type==='returned') out.push({kind:'returned',fund:'kd',dir:-1,date:c.date||'',amount:amt,site:'',siteName:'',text:'Returned to KD'+(c.note?' — '+c.note:''),src:'cash',id:c.id,raw:c});
  });
  (S.expenses||[]).filter(e=>e.paidBy===staff&&!e.fromCash).forEach(e=>{
    out.push({kind:'expense',fund:fundOfSite(e.propertyId),dir:-1,date:e.date||'',amount:_expAmt(e),site:e.propertyId||'',siteName:_pName(e.propertyId),text:(e.items||[]).map(i=>i.desc).join(', ')||'Expense',src:'exp',id:e.id,raw:e});
  });
  const rents=[];
  (S.properties||[]).forEach(p=>(p.rooms||[]).forEach(r=>(r.payments||[]).forEach(py=>{
    if(py.mode!=='Cash'||py.receivedBy!==staff)return;
    rents.push({kind:'rent',fund:isOwnerSite(p)?p.id:'kd',dir:1,date:py.date||((py.month||'')+'-01'),amount:Number(py.amount||0),site:p.id,siteName:p.name,
      text:'Cash rent — '+((r.tenant&&r.tenant.name)||r.type)+' ('+r.type+(r.unitNo?' #'+r.unitNo:'')+') for '+ml(py.month),src:'pay',id:py.id,pid:p.id,rid:r.id});
  })));
  rents.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const taken={};
  rents.forEach(e=>{
    out.push(e);
    const p=siteById(e.site); if(!isOwnerSite(p))return;
    const charge=Number(p.maintCharge||0); if(!charge)return;
    const key=e.site+'|'+(e.date||'').slice(0,7);
    const t=Math.min(charge-(taken[key]||0),e.amount); if(t<=0)return;
    taken[key]=(taken[key]||0)+t;
    out.push({kind:'maint',fund:e.site,dir:-1,date:e.date,amount:t,site:e.site,siteName:p.name,text:'Maintenance charge → KD’s account',src:'auto',id:'m_'+e.id});
    out.push({kind:'maintin',fund:'kd',dir:1,date:e.date,amount:t,site:e.site,siteName:p.name,text:'Maintenance charge from '+p.name,src:'auto',id:'mi_'+e.id});
  });
  return out.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.kind==='maintin'||a.kind==='maint'?1:0)-(b.kind==='maintin'||b.kind==='maint'?1:0)||(b.dir-a.dir));
}
function directExpenses(month){ // paid by KD / client / not set — listed under the right account, not part of staff cash
  const staff=staffList();
  return (S.expenses||[]).filter(e=>!e.fromCash&&!staff.includes(e.paidBy)&&(e.date||'').slice(0,7)===month)
    .map(e=>({date:e.date,site:e.propertyId||'',fund:fundOfSite(e.propertyId),amount:_expAmt(e),text:(e.items||[]).map(i=>i.desc).join(', '),paidBy:e.paidBy||'Not set',id:e.id}));
}
function unassignedCash(month){
  const out=[];
  (S.properties||[]).forEach(p=>(p.rooms||[]).forEach(r=>(r.payments||[]).forEach(py=>{
    if(py.mode!=='Cash'||py.receivedBy)return;
    const d=py.date||((py.month||'')+'-01'); if(d.slice(0,7)!==month)return;
    out.push({p,r,py});
  })));
  return out;
}

    s.rows.forEach(e=>body.push([
      {text:fd(e.date),fontSize:8},{text:_cbTypeLabel(e),fontSize:8,bold:true,color:tone(e)},{text:e.text,fontSize:8},
      {text:e.dir>0?M(e.amount):'',fontSize:8,alignment:'right',color:'#10B981',bold:true},{text:e.dir<0?M(e.amount):'',fontSize:8,alignment:'right',color:'#D97706',bold:true},
      {text:M(e.bal),fontSize:8,alignment:'right',bold:true,color:e.bal<0?'#EF4444':'#1A1A1A'}]));

      {text:M(s.end),bold:true,alignment:'right',color:s.end<0?'#EF4444':'#1A1A1A',fillColor:'#FFF7ED',fontSize:9}]);
    const last=body.length-1;
    blk.push({table:{headerRows:1,widths:[58,70,'*',62,62,66],body,dontBreakRows:true},
      layout:{hLineWidth:(i,node)=>i===last?1.5:(i===0||i===node.table.body.length||i===1)?0.8:0.4,hLineColor:i=>i===last?'#F97316':i===1?'#D1D5DB':'#F3F4F6',vLineWidth:()=>0.4,vLineColor:()=>'#E8ECF0',
        fillColor:(ri,node)=>(ri>0&&ri<node.table.body.length-1&&ri%2===0)?'#FAFAFA':null,paddingLeft:()=>4,paddingRight:()=>4,paddingTop:()=>4,paddingBottom:()=>4}});
    if(s.direct.length){
      const db=[[{text:'Paid directly — not from '+R.staff+'\'s cash · '+M(s.direct.reduce((a,x)=>a+x.amount,0)),colSpan:4,bold:true,color:'#92400E',fillColor:'#FEF3C7',fontSize:8},{},{},{}]];
      s.direct.forEach(x=>db.push([{text:fd(x.date),fontSize:8,fillColor:'#FFFBEB',color:'#78350F'},{text:x.text||'Expense',fontSize:8,fillColor:'#FFFBEB',color:'#78350F'},{text:x.paidBy,fontSize:8,fillColor:'#FFFBEB',color:'#92400E'},{text:M(x.amount),fontSize:8,bold:true,alignment:'right',fillColor:'#FFFBEB',color:'#D97706'}]));

  });
  const nr=(l,v,lc,vc,big)=>({margin:[0,2,0,2],columns:[{text:l,color:lc,fontSize:big?12:10,bold:!!big},{text:typeof v==='string'?v:M(v),color:vc,fontSize:big?13:10,bold:!!big,alignment:'right'}]});

      ...d.ownerHeld.map(o=>small('Owner\'s money — '+o.name,o.amount)),...(d.ownerHeld.length?[small('KD\'s money',d.kdHeld)]:[]),

  content.push({margin:[0,10,0,0],unbreakable:true,table:{widths:['*'],body:[[{stack,fillColor:'#1A1A1A',margin:[12,10,12,10]}]]},layout:'noBorders'});
  content.push({margin:[0,30,0,0],unbreakable:true,columns:[R.staff,'Checked by (KD)','Date'].map(t=>({stack:[{canvas:[{type:'line',x1:0,y1:0,x2:220,y2:0,lineWidth:0.6,lineColor:'#9CA3AF'}]},{text:t,fontSize:9,color:'#6B7280',alignment:'center',margin:[0,4,0,0]}]})),columnGap:30});

  return {pageSize:'A4',pageOrientation:'landscape',pageMargins:[20,20,20,25],content,defaultStyle:{fontSize:9},styles:{th:{bold:true,fontSize:8,color:'#6B7280',fillColor:'#F9FAFB'}}};
}
function _cbFileTitle(){ const f=cbFilterArg(); const label=f==='all'?'All-Sites':f.map(cbKeyName).join('-'); return 'Cash-Expenses-'+label+'-'+cbMo; }
async function shareCashBook(){
  const f=cbFilterArg(); if(f!=='all'&&!f.length){toast('Tick at least one site');return;}
  // 1. vector PDF (pdfmake) — same as Billing   2. html2pdf fallback   3. print
  try{
    await loadPdfMake();
    if(window.pdfMake){
      const fileName=pdfName(_cbFileTitle()), title='Cash & Expense Report — '+cbSelLabel()+' — '+ml(cbMo);
      toast('📄 Building PDF...',2500);
      const ok=await new Promise(resolve=>{
        try{
          pdfMake.createPdf(buildCashBookDocDef()).getBlob(async blob=>{
            try{
              if(window.File&&navigator.canShare&&navigator.share){
                const file=new File([blob],fileName,{type:'application/pdf'});
                if(navigator.canShare({files:[file]})){
                  try{ await navigator.share({files:[file],title,text:title}); toast('✅ Pick WhatsApp from share menu',3000); resolve(true); return; }
                  catch(err){ if(err.name==='AbortError'){resolve(true);return;} }
                }
              }
              downloadPdfBlob(blob,fileName); toast('📄 PDF saved — open WhatsApp & attach from Downloads',5000); resolve(true);
            }catch(e){ try{downloadPdfBlob(blob,fileName);resolve(true);}catch(e2){resolve(false);} }
          });
        }catch(e){ console.error('cash pdf build failed',e); resolve(false); }
      });
      if(ok)return;
    }
  }catch(e){ console.error('pdfmake load failed',e); }
  if(await shareReportPdfBlob(buildCashBookHtml(),_cbFileTitle()))return;
  printCashBook();
}
function printCashBook(){
  const html=buildCashBookHtml();
  try{ const url=URL.createObjectURL(new Blob([html],{type:'text/html'})); const w=window.open(url,'_blank');
    if(w){ setTimeout(()=>{try{w.print();}catch(e){}},900); toast('📄 Choose Save as PDF or Share in the print screen',5000); }
    else{ const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); toast('📄 Opened printable report — use browser Print / Save as PDF',5000); }
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ toast('❌ Could not open print view'); }
}

      <div class="frow1"><label class="flabel">Note</label><input class="finput" id="cbN" value="${(x.note||'').replace(/"/g,'&quot;')}" placeholder="e.g. For October expenses"/></div>`:''}
    ${k==='handover'?`
      <div class="frow"><div><label class="flabel">Site (whose owner) *</label>${siteSel(true)}</div><div><label class="flabel">Handed over by</label><select class="fselect" id="cbS">${L.map(s=>`<option ${s===staff?'selected':''}>${s}</option>`).join('')}</select></div></div>
      <div class="frow1"><label class="flabel">Note</label><input class="finput" id="cbN" value="${(x.note||'').replace(/"/g,'&quot;')}" placeholder="e.g. October rent balance, cash to owner"/></div>`:''}

      <div class="frow"><div><label class="flabel">Returned by</label><select class="fselect" id="cbS">${L.map(s=>`<option ${s===staff?'selected':''}>${s}</option>`).join('')}</select></div><div></div></div>

    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button><button class="btn btn-orange" onclick="saveCbEntry()">${_cbEdit?'Update':'Save'}</button>`);
}
function saveCbEntry(){
  const v=id=>(document.getElementById(id)||{}).value;
  const date=v('cbD'), amt=Number(v('cbA')||0), note=(v('cbN')||'').trim();
  if(!date){toast('❌ Pick a date');return;} if(!(amt>0)){toast('❌ Enter the amount');return;}
  if(!S.cash)S.cash=[]; if(!S.expenses)S.expenses=[];
  const k=_cbKind;
  if(_cbEdit){
    const x=_cbEdit; x.date=date; x.amount=amt; x.note=note;
    if(document.getElementById('cbP')){ x.propertyId=v('cbP'); x.propertyLabel=_pName(x.propertyId)||'Other / General'; }
    if(document.getElementById('cbS')) x.staff=v('cbS');
    if(document.getElementById('cbSrc')) x.source=v('cbSrc');
    if(x.type==='spent'){ const e=S.expenses.find(e=>e.cashId===x.id); if(e){ e.date=date; e.month=date.slice(0,7); e.propertyId=x.propertyId; e.items=[{desc:note,amount:amt}]; } }
    actLog('Cash entry edited — '+fm(amt)+' ('+(x.type)+')');
    sched(); closeM(); renderTab(); toast('✅ Updated'); return;
  }
  if(k==='expense'){
    if(!note){toast('❌ Say what the expense was for');return;}
    const pid=v('cbP'), by=v('cbBy');
    S.expenses.push({id:uid(),propertyId:pid,date,month:date.slice(0,7),items:[{desc:note,amount:amt}],addedBy:user,paidBy:by});
    actLog('Expense added — '+(_pName(pid)||'Misc')+' '+fm(amt)+' paid by '+by+' ('+note+')');
  } else if(k==='handover'){
    const pid=v('cbP'); if(!pid){toast('❌ Pick the site');return;}
    S.cash.push({id:uid(),type:'handover',staff:v('cbS'),date,amount:amt,propertyId:pid,propertyLabel:_pName(pid),note,by:user});
    actLog('Cash handed to owner — '+_pName(pid)+' '+fm(amt)+' by '+v('cbS'));
  } else if(k==='returned'){
    S.cash.push({id:uid(),type:'returned',staff:v('cbS'),date,amount:amt,propertyId:'',propertyLabel:'',note,by:user});
    actLog('Cash returned to KD — '+fm(amt)+' by '+v('cbS'));
  } else {
    S.cash.push({id:uid(),type:'given',staff:v('cbS'),source:v('cbSrc'),date,amount:amt,propertyId:'',propertyLabel:'Other / General',note,by:user});
    actLog('Cash received — '+fm(amt)+' by '+v('cbS')+' from '+v('cbSrc'));
  }
  sched(); closeM(); renderTab(); toast('✅ Saved');
}
function delCbEntry(id){
  const x=(S.cash||[]).find(c=>c.id===id); if(!x)return;
  if(!confirm('Delete this entry ('+fm(x.amount)+')?'))return;
  S.cash=S.cash.filter(c=>c.id!==id);
  if(x.type==='spent') S.expenses=(S.expenses||[]).filter(e=>e.cashId!==id);
  actLog('Cash entry deleted — '+fm(x.amount)+' ('+x.type+')');
  sched(); renderTab(); toast('🗑 Deleted');
}

function saveCashClose(expected){
  const staff=_cbStaff(), actual=Number(document.getElementById('ccA').value||0);
  if(!S.cashCloses)S.cashCloses=[];
  S.cashCloses=S.cashCloses.filter(c=>!(c.staff===staff&&c.month===cbMo));
  S.cashCloses.push({staff,month:cbMo,expected,actual,diff:actual-expected,note:(document.getElementById('ccN').value||'').trim(),by:user,on:today()});
  actLog('Cash reconciled — '+staff+' '+ml(cbMo)+': app '+fm(expected)+', counted '+fm(actual));
  sched(); closeM(); renderTab(); toast('✅ '+ml(cbMo)+' reconciled');
}

function chCash(d){
  if(cashMo==='all'){cashMo=mk();return renderCash();}
  const[y,m]=cashMo.split('-').map(Number);
  const dt=new Date(y,m-1+d);
  cashMo=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
  renderCash();
}

// Build combined cash ledger entries (S.cash + Expenses Tab entries by Preeti)
function buildCashLedger(){
  if(!S.cash)S.cash=[];
  if(!S.expenses)S.expenses=[];
  // Existing cash entries
  const cashEntries=S.cash.map(x=>({
    _src:'cash',id:x.id,type:x.type,date:x.date,amount:Number(x.amount||0),
    propertyLabel:x.propertyLabel||'Other / General',note:x.note||'',
    by:x.by||'',source:x.source||'',fromCash:false
  }));
  // Expenses Tab entries paid by Preeti (not already in cash via fromCash flag)
  const expEntries=S.expenses
    .filter(e=>e.paidBy==='Preeti'&&!e.fromCash)
    .map(e=>{
      const amt=(e.items||[]).reduce((s,i)=>s+Number(i.amount||0),0);
      const propName=e.propertyId?((S.properties.find(p=>p.id===e.propertyId)||{}).name||'Other'):'Other / General';
      const desc=(e.items||[]).map(i=>i.desc).join(', ');
      return{_src:'exp',id:e.id,type:'spent',date:e.date||'',amount:amt,
        propertyLabel:propName,note:desc,by:e.addedBy||'Preeti',source:'',fromCash:false,_expId:e.id};
    });
  return [...cashEntries,...expEntries].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}

function dueKind(date,done=false){
  if(done)return'done';
  if(!date)return'upcoming';
  const d=dl(date);
  return d<0?'overdue':d===0?'today':'upcoming';
}
function dueText(date,done=false){
  if(!date)return'No due date';
  const d=dl(date);
  if(done)return'Completed';
  if(d<0)return'Overdue · '+fd(date);
  if(d===0)return'Due Today';
  if(d===1)return'Due Tomorrow';
  return'Due '+fd(date);
}
function priorityBadge(priority){
  return priority==='high'?`<span class="badge badge-red">🔴 High</span>`:priority==='medium'?`<span class="badge badge-amb">🟡 Medium</span>`:`<span class="badge badge-grey">⚪ Low</span>`;
}
function removeReminderTask(reminderId){
  if(!reminderId||!S.tasks)return;
  S.tasks=S.tasks.filter(t=>t.reminderId!==reminderId);
}
function upsertReminderTask(reminder){
  if(!reminder||!reminder.dueDate)return;
  if(!S.tasks)S.tasks=[];
  removeReminderTask(reminder.id);
  S.tasks.push({
    id:uid(),
    title:'Reminder: '+(reminder.title||'Follow up'),
    note:reminder.note||'',
    assignedTo:reminder.assignedTo||'All',
    dueDate:reminder.dueDate,
    priority:'medium',
    property:'',
    status:reminder.done?'done':'open',
    createdBy:reminder.createdBy||user,
    createdAt:reminder.createdAt||today(),
    reminderId:reminder.id
  });
}

  }).join('');

}
function setDocTarget(pid,rid,docKey){window._docPid=pid;window._docRid=rid;window._docKey=docKey;document.getElementById('docFileInput').value='';}
async function handleDocUpload(event){
  const pid=window._docPid,rid=window._docRid,docKey=window._docKey;
  if(!pid||!rid||!docKey)return;
  const file=event.target.files[0];if(!file)return;
  if(file.size>800000){toast('❌ File too large — keep under 700KB');return;}
  toast('⏳ Uploading '+file.name+'...',10000);
  const reader=new FileReader();
  reader.onload=async function(e){
    const ok=await saveDocToFS(rid,docKey,e.target.result,file.name,file.type);
    if(ok){
      const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
      if(!r.docs)r.docs={};
      r.docs[docKey]={name:file.name,size:file.size,mimeType:file.type,uploadedAt:new Date().toISOString()};
      sched();toast('✅ '+file.name+' uploaded!');openDocs(pid,rid);if(vRoom)renderRoomDetail();
    }else{toast('❌ Upload failed. Check connection.');}
  };
  reader.onerror=()=>toast('❌ Could not read file');
  reader.readAsDataURL(file);
}
async function viewDoc(roomId,docKey){
  toast('⏳ Loading...',5000);
  const doc=await loadDocFromFS(roomId,docKey);
  if(!(doc&&doc.data)){toast('❌ Document not found');return;}
  const w=window.open('','_blank');
  if((doc.mimeType&&doc.mimeType.startsWith)('image/')){
    const imgHtml='<ht'+'ml><b'+'ody style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;">'
      +'<img src="'+doc.data+'" style="max-width:100%;max-height:100vh;object-fit:contain;"/>'
      +'</b'+'ody></ht'+'ml>';
    w.document.write(imgHtml);
  }
  else{w.location.href=doc.data;}
  toast('✅ Document opened');
}
async function delDoc(pid,rid,docKey){
  if(!isAdmin){toast('❌ Only admin can delete documents');return;}
  if(!confirm('Remove document?'))return;
  await deleteDocFromFS(rid,docKey);
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(r.docs)delete r.docs[docKey];
  sched();toast('🗑 Removed');openDocs(pid,rid);if(vRoom)renderRoomDetail();
}

function getDistanceMetres(lat1, lng1, lat2, lng2){
  const R=6371000;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function calcHours(rec){
  if(!rec||!rec.checkIn||!rec.checkOut)return'—';
  const diff=(new Date(rec.checkOut)-new Date(rec.checkIn))/3600000;
  const h=Math.floor(diff),m=Math.round((diff-h)*60);
  return h+'h '+(m<10?'0'+m:m)+'m';
}

function setAttStatus(msg,color='var(--muted)'){
  const el=document.getElementById('attStatus');
  if(el){el.textContent=msg;el.style.color=color;}
}

function doCheckIn(){
  if(!navigator.geolocation){toast('❌ Location not supported on this browser');return;}
  setAttStatus('📡 Getting your location...','var(--muted)');
  document.getElementById('attBtn').classList.add('checking');
  document.getElementById('attBtn').disabled=true;

  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat=pos.coords.latitude,lng=pos.coords.longitude;
      const dist=getDistanceMetres(lat,lng,OFFICE_LAT,OFFICE_LNG);
      const mapUrl=`https://www.google.com/maps?q=${lat},${lng}`;

      if(dist>OFFICE_RADIUS_METRES&&!isAdmin){
        setAttStatus(`❌ You are ${Math.round(dist)}m from office. Must be within ${OFFICE_RADIUS_METRES}m to check in.`,'var(--red)');
        document.getElementById('attBtn').classList.remove('checking');
        document.getElementById('attBtn').disabled=false;
        return;
      }

      // Save check-in
      if(!S.attendance)S.attendance=[];
      const td=todayDate();
      // Remove any existing today record for this user (shouldn't happen but safety)
      S.attendance=S.attendance.filter(a=>!(a.date===td&&a.staffName===user));
      S.attendance.push({
        id:uid(),staffName:user,date:td,
        checkIn:nowISO(),checkInTime:nowTime(),
        checkInLat:lat,checkInLng:lng,checkInMapUrl:mapUrl,
        checkInDist:Math.round(dist),
        checkOut:null,checkOutTime:null,checkOutLat:null,checkOutLng:null,checkOutMapUrl:null
      });
      sched();
      toast('✅ Checked in at '+nowTime());
      renderAttendance();
    },
    err=>{
      const msgs={1:'Location permission denied — please allow location access',2:'Location unavailable — try again',3:'Location timed out — try again'};
      setAttStatus('❌ '+(msgs[err.code]||'Location error'),'var(--red)');
      const attBtn=document.getElementById('attBtn');if(attBtn)attBtn.classList.remove('checking');
      if(document.getElementById('attBtn'))document.getElementById('attBtn').disabled=false;
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

function doCheckOut(){
  if(!navigator.geolocation){toast('❌ Location not supported');return;}
  setAttStatus('📡 Getting your location...','var(--muted)');
  const btn=document.getElementById('attBtn');
  if(btn){btn.classList.add('checking');btn.disabled=true;}

  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat=pos.coords.latitude,lng=pos.coords.longitude;
      const mapUrl=`https://www.google.com/maps?q=${lat},${lng}`;
      const rec=getTodayRecord();
      if(!rec){toast('❌ No check-in found for today');return;}
      rec.checkOut=nowISO();
      rec.checkOutTime=nowTime();
      rec.checkOutLat=lat;rec.checkOutLng=lng;rec.checkOutMapUrl=mapUrl;
      sched();
      toast('✅ Checked out at '+nowTime()+' · '+calcHours(rec)+' today');
      renderAttendance();
    },
    err=>{
      const msgs={1:'Location permission denied',2:'Location unavailable',3:'Timed out'};
      setAttStatus('❌ '+(msgs[err.code]||'Location error'),'var(--red)');
      const btn=document.getElementById('attBtn');
      if(btn){btn.classList.remove('checking');btn.disabled=false;}
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

function saveEditPayment(pid, rid, payId){
  const amt=document.getElementById('epyA').value;
  if(!amt){toast('❌ Enter amount');return;}
  const p=S.properties.find(x=>x.id===pid);
  const r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  const py=((r&&r.payments)||[]).find(x=>x.id===payId);
  if(!py)return;
  const oldMonth=py.month; // remember in case the month itself was changed
  py.month=document.getElementById('epyM').value;
  py.amount=Number(amt);
  py.mode=document.getElementById('epyMd').value;
  py.date=document.getElementById('epyD').value;
  py.notes=document.getElementById('epyNote').value;
  if(py.mode==='Cash'){ const _rv=(document.getElementById('epyRcv')||{}).value; if(_rv)py.receivedBy=_rv; else delete py.receivedBy; } else delete py.receivedBy;
  // Recalculate using the payment's own month (whichever is earlier, if it moved), not
  // today's real-world month — and match the same due formula used everywhere else:
  // prorated rent + electricity + carry-in - deductions + any pending security due.
  const targetMonth=(oldMonth&&oldMonth<py.month)?oldMonth:py.month;
  const elec=(r.electricityReadings||[]).find(x=>x.month===targetMonth);
  const bal=getCarryIn(r,targetMonth);
  const dedTotal=(r.deductions||[]).filter(d=>d.month===targetMonth).reduce((s,d)=>s+Number(d.amount||0),0);
  const activeStart=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const rentAmt=proratedRentForMonth(rentForMonth(r,targetMonth),activeStart,targetMonth);
  const secAdvDue=securityAdvanceDueForMonth(r,targetMonth);
  const isMoveInMonth=activeStart&&sameMonthDate(activeStart,targetMonth);
  const secPending=(secAdvDue&&isMoveInMonth)?secAdvDue.secPending:0;
  const due=rentAmt+Number((elec&&elec.amount)||0)+bal-dedTotal+secPending;
  const totalPaid=(r.payments||[]).filter(x=>x.month===targetMonth).reduce((s,x)=>s+Number(x.amount||0),0);
  setBalanceAfterMonth(r,targetMonth,due-totalPaid);
  sched();closeM();renderRoomDetail();toast('✅ Payment updated');
}

function delPayment(pid, rid, payId){
  if(!confirm('Delete this payment entry? This will also recalculate the balance.'))return;
  const p=S.properties.find(x=>x.id===pid);
  const r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r)return;
  const py=((r.payments)||[]).find(x=>x.id===payId);
  const payMonth=py&&py.month;
  actLog('Deleted payment — '+(r.tenant&&r.tenant.name?r.tenant.name:'tenant')+' ₹'+((py&&py.amount)||0));
  r.payments=(r.payments||[]).filter(x=>x.id!==payId);
  // Recalculate using the deleted payment's own month, not today's real-world month —
  // matching the same due formula used everywhere else.
  const targetMonth=payMonth||mk();
  const elec=(r.electricityReadings||[]).find(x=>x.month===targetMonth);
  const bal=getCarryIn(r,targetMonth);
  const dedTotal=(r.deductions||[]).filter(d=>d.month===targetMonth).reduce((s,d)=>s+Number(d.amount||0),0);
  const activeStart=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const rentAmt=proratedRentForMonth(rentForMonth(r,targetMonth),activeStart,targetMonth);
  const secAdvDue=securityAdvanceDueForMonth(r,targetMonth);
  const isMoveInMonth=activeStart&&sameMonthDate(activeStart,targetMonth);
  const secPending=(secAdvDue&&isMoveInMonth)?secAdvDue.secPending:0;
  const due=rentAmt+Number((elec&&elec.amount)||0)+bal-dedTotal+secPending;
  const totalPaid=(r.payments||[]).filter(x=>x.month===targetMonth).reduce((s,x)=>s+Number(x.amount||0),0);

function buildMonthlyReportData(month, filterPropId=''){
  const props=[];
  const movements=[];
  const movementKeys=new Set();
  let totalRent=0,totalElec=0,totalCollected=0,totalExp=0,totalRooms=0,occupied=0;
  let moveInRent=0,moveOutDue=0,moveOutCollected=0;

  S.properties.filter(p=>!filterPropId||p.id===filterPropId).forEach(p=>{
    const rooms=sortRooms(p.rooms||[]);
    totalRooms+=rooms.length;
    const propRooms=[],propExpenses=[];
    let propRent=0,propElec=0,propDed=0,propDue=0,propPaid=0,propPend=0;
    let vacantCount=0;
    const vacantUnits=[];

    rooms.forEach(r=>{
      if(!isRoomOccupied(r)){vacantCount++;vacantUnits.push(r.type+(r.unitNo?' #'+r.unitNo:''));return;}
      // If this tenant's actual move-in is after the month being reported, they weren't
      // here yet — count as vacant for this month (they're occupied now, just not during
      // this month) rather than showing a zeroed tenant row or silently disappearing.
      const _moveInCheck=(r.tenant&&(r.tenant.activeFrom||r.tenant.moveInDate))||(r.lease&&r.lease.startDate)||'';
      if(_moveInCheck&&_moveInCheck.slice(0,7)>month){vacantCount++;vacantUnits.push(r.type+(r.unitNo?' #'+r.unitNo:''));return;}
      occupied++;
      const elec=(r.electricityReadings||[]).find(x=>x.month===month);
      const paid=(r.payments||[]).filter(x=>x.month===month).reduce((s,x)=>s+Number(x.amount||0),0);
      const bal=getCarryIn(r,month);
      const activeStart=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
      const rent=proratedRentForMonth(rentForMonth(r,month),activeStart,month);
      const elecAmt=Number((elec&&elec.amount)||0);
      const deds=(r.deductions||[]).filter(d=>d.month===month);
      const dedAmt=deds.reduce((s,d)=>s+Number(d.amount||0),0);
      const total=rent+elecAmt+bal-dedAmt;
      const pend=total-paid;
      const secTotal=Number((r.tenant&&(r.tenant.security||r.tenant.securityDeposit))||r.security||0);
      const secBalRaw=(r.tenant&&r.tenant.securityBalance!=null)?r.tenant.securityBalance:r.securityBalance;
      const secBal=secBalRaw!=null?Number(secBalRaw||0):null;
      const storedToken=Number((r.tenant&&(r.tenant.tokenAmount||r.tenant.tokenReceived||r.tenant.token))||0);
      const inferredToken=(!storedToken&&sameMonthDate(activeStart,month)&&secTotal>0&&secBal!=null)?Math.max(0,secTotal-secBal):0;
      // Token amount is a lifetime fact stored once on the tenant record — it has no
      // month attached to it, so it would otherwise show up unconditionally in every
      // month forever. Only show it in the tenant's actual move-in month; from the next
      // month onward, it's already reflected in the security balance and shouldn't repeat.
      const tokenAmount=sameMonthDate(activeStart,month)?(storedToken||inferredToken):0;
      const paymentDetails=(r.payments||[])
        .filter(x=>x.month===month)
        .map(x=>(x.mode||'Payment')+(x.date?' '+fd(x.date):'')+(x.notes?' - '+x.notes:''))
        .join('<br/>');

      const elecOld=elec?elec.oldReading:null;
      const elecNew=elec?elec.reading:null;
      const elecUnits=elec?elec.units:null;
      const elecRate=elec?Number(elec.rate||0):null;

      const closingBal=Math.max(0,pend);
      const depositsThisMonth=depositLedgerForMonth(r,month);
      propRooms.push({unit:r.type+(r.unitNo?' #'+r.unitNo:''),tenant:r.tenant.name,phone:(r.tenant&&r.tenant.phone)||'',rent,elec:elecAmt,elecOld,elecNew,elecUnits,elecRate,deds,dedAmt,total,paid,pend,closingBal,carryIn:bal,bal,tokenAmount,securityBalance:secBal,tokenDate:(r.tenant&&r.tenant.tokenDate)||'',paymentDetails,depositsThisMonth});
      propRent+=rent;propElec+=elecAmt;propDed+=dedAmt;propDue+=total;propPaid+=paid;propPend+=pend;
    });

    // Vacated tenants this month — include as full rows in propRooms
    (S.pastTenants||[])
      .filter(t=>(!filterPropId||t.propertyId===p.id)&&sameMonthDate(t.vacatingDate,month))
      .forEach(t=>{
        const moveKey=['vacated',t.propertyId||p.id||'',t.roomId||'',t.unitNo||'',(t.name||'').trim().toLowerCase(),t.moveInDate||'',t.vacatingDate||''].join('|');
        if(movementKeys.has(moveKey))return;
        movementKeys.add(moveKey);

        // Full row data from archived history
        const elecRec=(t.electricityHistory||[]).find(x=>x.month===month);
        const elecAmt=Number((elecRec&&elecRec.amount)||0);
        const elecOld=elecRec?elecRec.oldReading:null;
        const elecNew=elecRec?elecRec.reading:null;
        const elecUnits=elecRec?elecRec.units:null;
        const elecRate=elecRec?Number(elecRec.rate||0):null;
        const deds=(t.deductionHistory||[]).filter(d=>d.month===month);
        const dedAmt=deds.reduce((s,d)=>s+Number(d.amount||0),0);
        const monthPaid=(t.paymentHistory||[]).filter(x=>x.month===month).reduce((s,x)=>s+Number(x.amount||0),0);
        const secAdj=Number((t.settlement&&t.settlement.securityAdjusted)||0);
        const totalPaidThisMonth=monthPaid+secAdj; // cash paid + security adjusted
        // Rent due: actual rent CHARGED this month (prorated to rent-payable-till date),
        // not the pending/unpaid balance — falls back to legacy records for old data.
        const rentDue=t.finalMonthRentCharged!=null?Number(t.finalMonthRentCharged||0):Number(t.settlement&&t.settlement.rentPending!=null?t.settlement.rentPending:t.rentAmount||0);
        const total=rentDue+elecAmt-dedAmt; // what was owed this month
        const pend=Math.max(0,total-totalPaidThisMonth);
        const closingBal=pend;
        const secHeld=Number(t.securityHeld||0);
        const secLeft=Math.max(0,secHeld-secAdj);
        const paymentDetails=(t.paymentHistory||[]).filter(x=>x.month===month)
          .map(x=>(x.mode||'Payment')+(x.date?' '+fd(x.date):'')+(x.notes?' - '+x.notes:'')).join('<br/>');
        const netRefund=Number(t.settlement&&t.settlement.netRefund||0);

        propRooms.push({
          unit:(t.roomType||'')+(t.unitNo?' #'+t.unitNo:''),
          tenant:t.name||'—',
          phone:t.phone||'',
          rent:rentDue,
          elec:elecAmt,elecOld,elecNew,elecUnits,elecRate,
          deds,dedAmt,
          total,paid:totalPaidThisMonth,pend,closingBal,
          carryIn:0,bal:0,
          tokenAmount:0,
          securityBalance:secLeft,
          tokenDate:'',
          paymentDetails,
          isVacated:true,
          vacatedOn:t.vacatingDate,
          securityHeld:secHeld,
          securityAdjusted:secAdj,
          netRefund,
          balanceStatus:t.settlement&&t.settlement.balanceStatus||'',
        });
        propRent+=rentDue;propElec+=elecAmt;propDed+=dedAmt;propDue+=total;propPaid+=totalPaidThisMonth;propPend+=pend;

        // Also add to movements for the movement card
        movements.push({
          kind:'vacated',
          unit:(t.roomType||'')+(t.unitNo?' #'+t.unitNo:''),
          tenant:t.name||'—',
          start:t.moveInDate||'',
          end:t.vacatingDate||'',
          rent:rentDue,
          due:total,
          paid:totalPaidThisMonth,
          pending:pend,
          reason:t.vacatingReason||'—',
          status:t.settlement&&t.settlement.refundStatus||'na',
          securityHeld:secHeld,
          securityAdjusted:secAdj,
          netRefund,
        });
        moveOutDue+=pend;
        moveOutCollected+=totalPaidThisMonth;
      });

    // Pre-booked future tenants for this month
    rooms.forEach(r=>{
      const bk=roomBookingInfo(r);
      if(!bk||isRoomOccupied(r))return;
      if(!sameMonthDate(bk.moveInDate,month))return;
      const moveKey=[
        'prebooked',
        p.id||'',
        r.id||'',
        r.unitNo||'',
        (bk.name||'').trim().toLowerCase(),
        bk.moveInDate||''
      ].join('|');
      if(movementKeys.has(moveKey))return;
      movementKeys.add(moveKey);
      const rent=proratedRentForMonth(bk.agreedRent||r.rent||0,bk.moveInDate,month);
      const secBal=bk.securityBalance!=null?bk.securityBalance:Math.max(0,Number(bk.securityDeposit||0)-Number(bk.amount||0));
      movements.push({
        kind:'prebooked',
        unit:r.type+(r.unitNo?' #'+r.unitNo:''),
        tenant:bk.name||'—',
        start:bk.moveInDate||'',
        end:'',
        rent,
        token:Number(bk.amount||0),
        securityBalance:secBal,
        due:rent,
        paid:0,
        pending:rent,
        status:'pending',
      });
      moveInRent+=rent;
    });

    // Property expenses for this month
    (S.expenses||[]).filter(e=>e.propertyId===p.id&&e.month===month).forEach(exp=>{
      (exp.items||[]).forEach(i=>{
        propExpenses.push({desc:i.desc,amount:Number(i.amount||0),date:exp.date||'',paidBy:exp.paidBy||exp.addedBy||''});
        totalExp+=Number(i.amount||0);
      });
    });

    totalRent+=propRent;totalElec+=propElec;totalCollected+=propPaid;

    if(propRooms.length||propExpenses.length){
      props.push({name:p.name,address:p.address||'',rooms:propRooms,vacantCount,vacantUnits,expenses:propExpenses,totalRent:propRent,totalElec:propElec,totalDed:propDed,totalDue:propDue,totalPaid:propPaid,totalPend:propPend});
    }
  });

  // Other expenses (no property) — only include in grand total, not per-property filter
  if(!filterPropId){
    (S.expenses||[]).filter(e=>!e.propertyId&&e.month===month).forEach(exp=>{
      (exp.items||[]).forEach(i=>totalExp+=Number(i.amount||0));
    });
  }

  return{props,movements,totalRent,totalElec,totalCollected,totalExp,totalRooms,occupied,moveInRent,moveOutDue,moveOutCollected};
}

  // Mobile-safe: open a printable page, then trigger the browser print/PDF flow.
  try{

    if(w){
      setTimeout(()=>{try{w.print();}catch(e){}},900);
      toast('📄 Choose Save as PDF or Share in the print screen',5000);
    }else{

      a.href=url;a.target='_blank';a.rel='noopener';

  }

    </div>
    <div class="frow">
      <div><label class="flabel">Month *</label><input class="finput" type="month" id="dedM" value="${defMo}"/></div>
      <div><label class="flabel">Amount (₹) *</label><input class="finput" type="number" id="dedA" placeholder="e.g. 1500"/></div>
    </div>

    <div class="frow1"><label class="flabel">Notes <span style="color:var(--muted);font-weight:400;text-transform:none;">optional</span></label><input class="finput" id="dedNote" placeholder="Any additional details"/></div>`,

     <button class="btn btn-purple" onclick="saveDeduction('${pid}','${rid}')">Save Deduction</button>`
  );
}
function saveDeduction(pid, rid){
  const amt=document.getElementById('dedA').value;
  const desc=document.getElementById('dedDesc').value.trim();
  if(!amt){toast('❌ Enter amount');return;}
  if(!desc){toast('❌ Enter description');return;}
  const p=S.properties.find(x=>x.id===pid);
  const r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r.deductions)r.deductions=[];
  const mo=document.getElementById('dedM').value;
  r.deductions.push({
    id:uid(),month:mo,
    amount:Number(amt),
    desc,
    note:document.getElementById('dedNote').value,
    addedBy:user,date:today()
  });
  // Recalculate balance — prorated rent + security-due term, matching the formula used
  // everywhere else so this cached value stays consistent with what billing displays.
  const elec=(r.electricityReadings||[]).find(x=>x.month===mo);
  const dedTotal=r.deductions.filter(d=>d.month===mo).reduce((s,d)=>s+Number(d.amount||0),0);
  const carryIn3=getCarryIn(r,mo);
  const activeStart=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const rentAmt=proratedRentForMonth(rentForMonth(r,mo),activeStart,mo);
  const secAdvDue=securityAdvanceDueForMonth(r,mo);
  const isMoveInMonth=activeStart&&sameMonthDate(activeStart,mo);
  const secPending=(secAdvDue&&isMoveInMonth)?secAdvDue.secPending:0;
  const due=rentAmt+Number((elec&&elec.amount)||0)+carryIn3-dedTotal+secPending;
  const totalPaid=(r.payments||[]).filter(x=>x.month===mo).reduce((s,x)=>s+Number(x.amount||0),0);
  setBalanceAfterMonth(r,mo,due-totalPaid);
  sched();closeM();
  if(curTab==='billing')renderBilling();
  else if(vRoom)renderRoomDetail();
  toast('✅ Deduction saved — rent reduced by '+fm(amt));
}

function openManageDeductions(pid,rid,mo){
  const p=S.properties.find(x=>x.id===pid);

  if(!r)return;
  const deds=(r.deductions||[]).filter(d=>d.month===mo);
  const list=deds.length?deds.map(d=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#F5F3FF;border-radius:8px;margin-bottom:8px;"><div><div style="font-weight:600;color:#6D28D9;">-${fm(d.amount)}</div><div style="font-size:12px;color:var(--muted);">${d.desc||''}</div>${d.note?`<div style="font-size:11px;color:var(--muted);">${d.note}</div>`:''}</div><button class="btn btn-ghost btn-xs" onclick="delDeductionFromBilling('${pid}','${rid}','${d.id}','${mo}')">🗑 Remove</button></div>`).join(''):'<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px;">No deductions for this month</div>';

function delDeductionFromBilling(pid,rid,dedId,mo){
  if(!confirm('Remove this deduction?'))return;
  const p=S.properties.find(x=>x.id===pid);
  const r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  r.deductions=(r.deductions||[]).filter(x=>x.id!==dedId);
  // Recalculate balance for that month — prorated rent + security-due term
  const elec=(r.electricityReadings||[]).find(x=>x.month===mo);
  const dedTotal=(r.deductions||[]).filter(d=>d.month===mo).reduce((s,d)=>s+Number(d.amount||0),0);
  const carryIn=getCarryIn(r,mo);
  const activeStart=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const rentAmt=proratedRentForMonth(rentForMonth(r,mo),activeStart,mo);
  const secAdvDue=securityAdvanceDueForMonth(r,mo);
  const isMoveInMonth=activeStart&&sameMonthDate(activeStart,mo);
  const secPending=(secAdvDue&&isMoveInMonth)?secAdvDue.secPending:0;
  const due=rentAmt+Number((elec&&elec.amount)||0)+carryIn-dedTotal+secPending;
  const totalPaid=(r.payments||[]).filter(x=>x.month===mo).reduce((s,x)=>s+Number(x.amount||0),0);
  setBalanceAfterMonth(r,mo,due-totalPaid);
  sched();closeM();
  if(curTab==='billing')renderBilling();
  else if(vRoom)renderRoomDetail();
  toast('🗑 Deduction removed');
}

}

function onVacateDateChange(pid,rid){
  // Keep rent-till in sync by default when room-vacant date changes,
  // unless the user has already deliberately set a different rent-till date — then recalculate.
  const vd=document.getElementById('vs_date'),rt=document.getElementById('vs_rent_till');
  if(!vd||!rt)return;
  if(!rt.dataset.touched)rt.value=vd.value;
  if(pid&&rid)recalcVacateRent(pid,rid);
}
function recalcVacateRent(pid,rid){
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r)return;
  const rtEl=document.getElementById('vs_rent_till');
  const rentTill=(rtEl&&rtEl.value)||today();
  const vm=rentTill.slice(0,7); // the month the rent ends in (not necessarily this month)
  const elec=(r.electricityReadings||[]).find(x=>x.month===vm);
  const elecAmt=Number((elec&&elec.amount)||0);
  const carryIn=getCarryIn(r,vm);
  const _as=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const proratedRent=proratedVacateRent(rentForMonth(r,vm),_as,vm,rentTill);
  const alreadyPaid=(r.payments||[]).filter(x=>x.month===vm).reduce((s,x)=>s+Number(x.amount||0),0);
  const totalDue=Math.max(0,proratedRent+elecAmt+carryIn-alreadyPaid);
  const duesEl=document.getElementById('vs_dues');
  if(duesEl){duesEl.value=totalDue;calcVacateRefund();}
  const info=document.getElementById('vs_rent_info');
  if(info){
    const full=rentForMonth(r,vm), days=vacateDays(_as,vm,rentTill);
    info.innerHTML='🧮 Rent for '+ml(vm)+': '+fm(full)+' ÷ 30 × '+days+' day'+(days!==1?'s':'')+' = <strong>'+fm(proratedRent)+'</strong>'
      +(elecAmt?' · Electricity '+fm(elecAmt):'')+(carryIn?' · Previous balance '+fm(carryIn):'')+(alreadyPaid?' · Already paid −'+fm(alreadyPaid):'')
      +' → <strong>Rent due '+fm(totalDue)+'</strong>';
  }
}

function calcVacateRefund(){
  const sec=Number(document.getElementById('vs_sec').value||0);
  const dues=Number(document.getElementById('vs_dues').value||0);
  const clean=Number(document.getElementById('vs_clean').value||0);
  const damage=Number(document.getElementById('vs_damage').value||0);
  const other=Number(document.getElementById('vs_other').value||0);
  const secAdj=Number(document.getElementById('vs_secadj').value||0);
  const cashPaid=Number(document.getElementById('vs_cashpaid').value||0);
  const totalDues=dues+clean+damage+other;
  const totalPaid=secAdj+cashPaid;
  const secLeft=Math.max(0,sec-secAdj); // security remaining to refund
  const balance=secLeft-(totalDues-cashPaid-secAdj); // positive = we owe tenant, negative = tenant owes us

  // Simpler: finalBalance = sec - totalDues + cashPaid
  // if positive: refund secLeft to tenant (dues covered by cash+secAdj, leftover sec returned)
  // if negative: tenant still owes
  const net=sec-totalDues+cashPaid; // >0 means refund to tenant, <0 means tenant owes

  document.getElementById('vs_r_sec').textContent='₹'+sec.toLocaleString('en-IN');
  document.getElementById('vs_r_ded').textContent='₹'+totalDues.toLocaleString('en-IN');
  document.getElementById('vs_r_secadj').textContent='₹'+secAdj.toLocaleString('en-IN');
  document.getElementById('vs_r_cash').textContent='₹'+cashPaid.toLocaleString('en-IN');
  document.getElementById('vs_r_secleft').textContent='₹'+secLeft.toLocaleString('en-IN');
  const netEl=document.getElementById('vs_r_net');
  if(net>0){
    netEl.textContent='₹'+net.toLocaleString('en-IN')+' to refund to tenant';
    netEl.style.color='var(--green)';
    document.getElementById('vs_r_explain').textContent='We still need to return ₹'+net.toLocaleString('en-IN')+' to '+' the tenant.';
  } else if(net<0){
    netEl.textContent='₹'+Math.abs(net).toLocaleString('en-IN')+' tenant still owes';
    netEl.style.color='var(--red)';
    document.getElementById('vs_r_explain').textContent='Tenant needs to pay ₹'+Math.abs(net).toLocaleString('en-IN')+' more.';
  } else {
    netEl.textContent='✓ Fully settled';
    netEl.style.color='var(--green)';
    document.getElementById('vs_r_explain').textContent='Account fully settled.';
  }
}

function confirmVacating(pid,rid){
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r||!p)return;
  const vDate=document.getElementById('vs_date').value;
  const rentTillDate=(document.getElementById('vs_rent_till')||{}).value||vDate;
  if(!vDate){toast('❌ Room vacant date required');return;}
  if(!rentTillDate){toast('❌ Rent-payable-till date required');return;}
  const sec=Number(document.getElementById('vs_sec').value||0);
  const dues=Number(document.getElementById('vs_dues').value||0); // this is PENDING (unpaid) rent portion, not total rent charged
  const clean=Number(document.getElementById('vs_clean').value||0);
  const damage=Number(document.getElementById('vs_damage').value||0);
  const other=Number(document.getElementById('vs_other').value||0);
  const secAdj=Number(document.getElementById('vs_secadj').value||0);
  const cashPaid=Number(document.getElementById('vs_cashpaid').value||0);
  const payMode=document.getElementById('vs_mode').value;
  const totalDed=dues+clean+damage+other;
  const netRefund=sec-totalDed+cashPaid; // positive=we owe tenant, negative=tenant owes us
  const reason=document.getElementById('vs_reason').value;
  const note=document.getElementById('vs_note').value;

  // Recompute the ACTUAL rent charged for the vacating month using the rent-till date,
  // separately from "dues" (which is the pending/unpaid amount). This fixes the bug where
  // a tenant who fully paid before vacating showed ₹0 rent for that month in billing —
  // that field was really "amount still owed," not "rent charged."
  // IMPORTANT: use the vacating month itself (from vDate), not today's real-world month —
  // otherwise a tenant who vacated in a past month gets their rent calculated against the
  // wrong month entirely, producing 0 or garbage (e.g. someone who vacated in June, viewed
  // in August, would have their rent computed for August instead of June).
  const vm=vDate.slice(0,7);
  const elecForVm=(r.electricityReadings||[]).find(x=>x.month===vm);
  const elecAmtForVm=Number((elecForVm&&elecForVm.amount)||0);
  const _asForVm=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const actualRentCharged=proratedVacateRent(rentForMonth(r,vm),_asForVm,vm,rentTillDate);
  const alreadyPaidForVm=(r.payments||[]).filter(x=>x.month===vm).reduce((s,x)=>s+Number(x.amount||0),0);

  // Archive tenant
  if(!S.pastTenants)S.pastTenants=[];
  const cm=mk();
  const totalRentCollected=(r.payments||[]).reduce((s,x)=>s+Number(x.amount||0),0);
  const pastRecord={
    id:uid(),
    propertyId:pid,
    propertyName:p.name,
    roomId:rid,
    roomType:r.type,
    unitNo:r.unitNo||'',
    name:r.tenant&&r.tenant.name||'',
    phone:r.tenant&&r.tenant.phone||'',
    aadhaar:r.tenant&&r.tenant.aadhaar||'',
    address:r.tenant&&r.tenant.address||'',
    fatherName:r.tenant&&r.tenant.fatherName||'',
    moveInDate:r.tenant&&r.tenant.moveInDate||'',
    vacatingDate:vDate,
    rentPayableTill:rentTillDate,
    vacatingReason:reason,
    rentAmount:Number(r.rent||0),
    finalMonthRentCharged:actualRentCharged,
    finalMonthRentPaid:alreadyPaidForVm,
    securityHeld:sec,
    totalRentCollected,
    depositLedger:[...(r.depositLedger||[])],
    settlement:{
      rentPending:dues,
      cleaningCharge:clean,
      damageDeductions:damage,
      otherDeductions:other,
      totalDeductions:totalDed,
      securityAdjusted:secAdj,
      cashPaidOnDay:cashPaid,
      paymentMode:payMode,
      netRefund,
      balanceStatus:netRefund>0?'refund_pending':netRefund<0?'payment_pending':'settled',
      refundStatus:netRefund>0?'pending':netRefund<0?'owed':'na',
      refundDate:null,
      refundNote:''
    },
    paymentHistory:[...(r.payments||[])],
    electricityHistory:[...(r.electricityReadings||[])],
    deductionHistory:[...(r.deductions||[])],
    notes:note,
    archivedBy:user,
    archivedAt:today(),
    coTenants:r.coTenants||[]
  };
  const dupIdx=S.pastTenants.findIndex(t=>
    (t.propertyId||'')===pid&&
    (t.roomId||'')===rid&&
    (t.vacatingDate||'')===vDate&&
    ((t.name||'').trim().toLowerCase())===((pastRecord.name||'').trim().toLowerCase())&&
    (t.moveInDate||'')===(pastRecord.moveInDate||'')
  );
  if(dupIdx>=0)S.pastTenants[dupIdx]={...S.pastTenants[dupIdx],...pastRecord,id:S.pastTenants[dupIdx].id||pastRecord.id};
  else S.pastTenants.push(pastRecord);

  // Close this tenant's lease so it doesn't keep showing as "expired / urgent" after they've left.
  // Matched by room + tenant name so a lease already made for an incoming pre-booked tenant is untouched.
  (S.leases||[]).forEach(l=>{
    if(l.roomId===rid&&(l.status==='active'||l.status==='expired')&&((l.lesseeName||'').trim().toLowerCase())===((pastRecord.name||'').trim().toLowerCase())){
      l.status='closed';l.closedOn=vDate;l.closedBy=user;
    }
  });

  // Clear room for next tenant — deposit ledger is archived above, so safe to reset here.
  // balanceByMonth is also cleared: it's a per-room cache, and left behind it would
  // silently carry into whoever moves in next as a phantom "carry-in" balance.
  r.tenant=null;
  r.coTenants=[];
  r.notice=null;
  r.balance=0;
  r.balanceByMonth={};
  r.payments=[];
  r.electricityReadings=[];
  r.deductions=[];
  r.depositLedger=[];

  sched();
  closeM();

  // Step 2 — prompt for new tenant
  const hasToken=!!r.token;
  setTimeout(()=>{
    openM('✅ Vacated Successfully',`
      <div style="text-align:center;padding:16px 0;">
        <div style="font-size:2.5rem;margin-bottom:8px;">🎉</div>
        <div style="font-family:var(--font-head,serif);font-size:1.2rem;font-weight:600;margin-bottom:6px;">${pastRecord.name||'Tenant'} vacated</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">Settlement confirmed. ${netRefund>0?'Refund of ₹'+netRefund.toLocaleString('en-IN')+' pending.':netRefund<0?'Tenant owes ₹'+Math.abs(netRefund).toLocaleString('en-IN'):''}</div>
        ${hasToken?`<div style="background:var(--orange-dim);border:1px solid var(--orange);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;text-align:left;">
          <strong>🔑 Token exists:</strong> ${r.token.name} is ready to move in on ${fd(r.token.moveInDate)}.
          Token of ₹${Number(r.token.amount||0).toLocaleString('en-IN')} will be adjusted against security deposit.
        </div>`:''}
        <p style="font-size:13px;color:var(--ink2);">Would you like to add the new tenant now?</p>
      </div>`,
      `<button class="btn btn-ghost" onclick="closeM();renderRoomDetail();renderDash();">No — Leave ${hasToken?'Pre-booked':'Vacant'}</button>
       <button class="btn btn-orange" onclick="closeM();onboardNewTenant('${pid}','${rid}');">Yes — Add New Tenant →</button>`);
  },300);
}

function saveNewTenant(pid,rid){
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r||!p)return;
  const name=(document.getElementById('nt_name').value||'').trim();
  const phone=(document.getElementById('nt_phone').value||'').trim();
  const rent=document.getElementById('nt_rent').value;
  const movein=document.getElementById('nt_movein').value;
  if(!name){toast('❌ Tenant name required');return;}
  if(!rent){toast('❌ Monthly rent required');return;}
  if(!movein){toast('❌ Move-in date required');return;}
  const tokenAmt=Number((r.token&&r.token.amount)||0);
  const secTotal=Number(document.getElementById('nt_sec').value||0);
  const secBal=Math.max(0,secTotal-tokenAmt);
  r.token={
    name,phone,
    aadhaar:document.getElementById('nt_aadhaar').value,
    fatherName:document.getElementById('nt_father').value,
    address:document.getElementById('nt_addr').value,
    moveInDate:movein,
    agreedRent:Number(rent),
    securityDeposit:secTotal,
    securityBalance:secBal,
    amount:tokenAmt,
    tokenDate:(r.token&&r.token.tokenDate)||today(),
    advanceRent:Number(document.getElementById('nt_adv').value||0),
    advanceRentStatus:'pending',
    createdAt:(r.token&&r.token.createdAt)||today(),
    coTenants:_collectCoTenants()
  };
  r.coTenants=_collectCoTenants();
  r.rent=Number(rent);
  r.balance=0;
  r.payments=[];
  r.electricityReadings=[];
  r.deductions=[];
  r.tenant=null;
  // Log any money received right now into the dated deposit ledger
  const payDate=document.getElementById('nt_pay_date').value||today();
  const payMode=document.getElementById('nt_pay_mode').value||'Cash';
  const secPaidNow=Number(document.getElementById('nt_sec_paid').value||0);
  const advPaidNow=Number(document.getElementById('nt_adv_paid').value||0);
  if(secPaidNow>0)addDepositEntry(r,'security',secPaidNow,payDate,payMode,'Collected at pre-booking');
  if(advPaidNow>0)addDepositEntry(r,'advance',advPaidNow,payDate,payMode,'Collected at pre-booking');
  if(tokenAmt>0&&!depositLedgerTotal(r,'token'))addDepositEntry(r,'token',tokenAmt,(r.token&&r.token.tokenDate)||today(),'Cash','Token amount');
  syncBalancesFromLedger(r);
  sched();closeM();renderRoomDetail();renderDash();
  toast('✅ New tenant '+name+' saved as pre-booked'+((secPaidNow||advPaidNow)?' — payment logged':''));
}

function numToWords(n){
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  n=parseInt(n||0);
  if(!n||isNaN(n))return'';
  if(n>=10000000)return numToWords(Math.floor(n/10000000))+' Crore '+(n%10000000?numToWords(n%10000000):'');
  if(n>=100000)return numToWords(Math.floor(n/100000))+' Lakh '+(n%100000?numToWords(n%100000):'');
  if(n>=1000)return numToWords(Math.floor(n/1000))+' Thousand '+(n%1000?numToWords(n%1000):'');
  if(n>=100)return numToWords(Math.floor(n/100))+' Hundred '+(n%100?numToWords(n%100):'');
  if(n>=20)return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');
  return ones[n];
}
function toWords(n){const w=numToWords(n).trim();return w?w+' Only':'';}

// ── LEASE STATUS HELPERS ──
// A lease deed is "expired" when its end date has passed and it hasn't been renewed or closed.
function leaseState(l){
  if(!l)return'active';
  if(l.status==='draft')return'draft';
  if(l.status==='renewed')return'renewed';
  if(l.status==='closed')return'closed';
  const d=l.leaseEnd?dl(l.leaseEnd):null;
  if(l.status==='expired'||(d!==null&&d<0))return'expired';
  if(d!==null&&d<=30)return'expiring';
  return'active';
}
function leaseUnitLabel(l){return (l&&(l.unitName||l.propUnit))||'';}
function leaseStatusBadge(l){
  const st=leaseState(l),d=l.leaseEnd?dl(l.leaseEnd):null;
  if(st==='draft')return`<span class="lease-status-draft">📝 Draft — awaiting signature</span>`;
  if(st==='expired')return`<span class="lease-status-urgent">🚨 EXPIRED</span>`;
  if(st==='expiring')return`<span class="lease-status-soon">⏳ ${d===0?'Ends today':'Expiring'}</span>`;
  if(st==='renewed')return`<span class="lease-status-renewed">Renewed</span>`;
  if(st==='closed')return`<span class="lease-status-closed">Closed</span>`;
  return`<span class="lease-status-active">Active</span>`;
}
function _addMonthsEnd(start,months){
  if(!start||!months)return'';
  const d=new Date(start+'T00:00:00');d.setMonth(d.getMonth()+Number(months));d.setDate(d.getDate()-1);
  return localDate(d);
}
function _dayAfter(s){if(!s)return today();const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+1);return localDate(d);}
function _findLeaseRoom(l){
  if(!l||!l.roomId)return null;
  for(const p of (S.properties||[])){const r=(p.rooms||[]).find(x=>x.id===l.roomId);if(r)return{p,r};}
  return null;
}
// Works out a room's current lease end from the tenant's own dates, in this order:
// lease end date → lease start + tenure → lease start + 11 months → move-in + 11 months.
function _roomLeaseEnd(r){
  const L=r.lease||{};
  if(L.endDate)return{end:L.endDate,start:L.renewedStart||L.startDate||'',est:''};
  const start=L.startDate||'';
  const ten=parseInt(L.tenure)||0;
  if(start&&ten)return{end:_addMonthsEnd(start,ten),start,est:''};
  if(start)return{end:_addMonthsEnd(start,11),start,est:'11-month term assumed'};
  const mi=(r.tenant&&(r.tenant.moveInDate||r.tenant.activeFrom))||'';
  if(mi)return{end:_addMonthsEnd(mi,11),start:mi,est:'from move-in date, 11-month term assumed'};
  return null;
}
// The end date that actually applies to a room — an active lease deed wins over the room's own dates.
function roomLeaseEndDate(r){
  const deed=(S.leases||[]).find(l=>l.roomId===r.id&&(l.status==='active'||l.status==='expired'));
  if(deed&&deed.leaseEnd)return deed.leaseEnd;
  const i=_roomLeaseEnd(r);return i?i.end:'';
}
// Every lease that has expired or ends within 30 days — from lease deeds AND from each
// occupied room's own lease / move-in dates (for tenants who have no deed in the Lease tab).
function allLeaseAlerts(){
  const out=[];
  (S.leases||[]).forEach(l=>{
    const st=leaseState(l);
    if(st!=='expired'&&st!=='expiring')return;
    const dr=(S.leases||[]).find(x=>x.status==='draft'&&x.renewedFrom===l.id);
    out.push({key:'L_'+l.id,kind:'deed',leaseId:l.id,name:l.lesseeName||'—',prop:l.propertyName||'',unit:leaseUnitLabel(l),start:l.leaseStart,end:l.leaseEnd,days:l.leaseEnd?dl(l.leaseEnd):-1,rent:Number(l.rentAmt||0),est:'',draftId:dr?dr.id:null});
  });
  const deedRooms=new Set((S.leases||[]).filter(l=>l.roomId&&(l.status==='active'||l.status==='expired')).map(l=>l.roomId));
  (S.properties||[]).forEach(p=>(p.rooms||[]).forEach(r=>{
    if(!isRoomOccupied(r)||deedRooms.has(r.id))return;
    const info=_roomLeaseEnd(r);if(!info||!info.end)return;
    const d=dl(info.end);if(d===null||d>30)return;
    const dr=(S.leases||[]).find(x=>x.status==='draft'&&x.renewedFromRoom===r.id);
    out.push({key:'R_'+r.id,kind:'room',pid:p.id,rid:r.id,name:r.tenant.name||'—',prop:p.name,unit:r.type+(r.unitNo?' #'+r.unitNo:''),start:info.start,end:info.end,days:d,rent:Number(r.rent||0),est:info.est,draftId:dr?dr.id:null});
  }));
  return out.sort((a,b)=>a.days-b.days);
}
function expiredAlerts(){return allLeaseAlerts().filter(a=>a.days<0);}
function _alertRenewCall(a){return a.kind==='deed'?`openMarkRenewed('${a.leaseId}')`:`openMarkRoomRenewed('${a.pid}','${a.rid}')`;}

function dashLeaseUrgentH(){

function mrCalc(fromEsc){
  const s=(document.getElementById('mr_start')||{}).value,t=(document.getElementById('mr_ten')||{}).value;
  const e=document.getElementById('mr_end');if(e)e.value=_addMonthsEnd(s,t);
  if(fromEsc){
    const r=document.getElementById('mr_rent');
    const pct=parseFloat((document.getElementById('mr_esc')||{}).value||0);
    if(r)r.value=Math.round(Number(r.dataset.old||0)*(1+pct/100));
  }
}
function _applyRoomRenewal(r,start,end,ten,rent,esc,updRent){
  if(!r.lease)r.lease={};
  if(!r.lease.renewals)r.lease.renewals=[];
  r.lease.renewals.push({prevStart:r.lease.renewedStart||r.lease.startDate||'',prevEnd:r.lease.endDate||'',prevRent:Number(r.rent||0),newStart:start,newEnd:end,newRent:rent,on:today(),by:user});
  // startDate is left untouched on purpose — billing uses it as a move-in fallback.
  r.lease.renewedStart=start;r.lease.endDate=end;r.lease.tenure=String(ten);r.lease.escalation=String(esc);
  if(updRent&&Number(r.rent||0)!==rent){
    if(!r.rentHistory)r.rentHistory=[];
    if(!r.rentHistory.length)r.rentHistory.push({rent:Number(r.rent||0),effectiveFrom:TRACKING_START_MONTH});
    const effMonth=start.slice(0,7);
    const entry={rent,effectiveFrom:effMonth+'-01'};
    const di=r.rentHistory.findIndex(h=>h.effectiveFrom&&h.effectiveFrom.slice(0,7)===effMonth);
    if(di>=0)r.rentHistory[di]=entry;else r.rentHistory.push(entry);
    r.rent=rent;r.balanceByMonth={};r.balance=0;
    return' · room rent '+fm(rent)+' from '+ml(effMonth);
  }
  return'';
}
