// Android / Desktop: html2pdf → PDF download with "Page X of Y" footer
function _pdfPrint(deedEl){
  toast('⏳ Building PDF — please wait...',12000);

  const clone=deedEl.cloneNode(true);
  clone.style.cssText='max-width:none;width:100%;font-size:13px;line-height:1.8;';
  // Activate the optional stamp-space div (hidden on screen, shown here for PDF)
  const ssEl=clone.querySelector('.stamp-space');
  if(ssEl){ssEl.style.cssText=ssEl.classList.contains('stamp-space-on')?'height:18mm;display:block;width:100%;':'height:0;display:none;width:100%;';}

  const wrap=document.createElement('div');
  wrap.style.cssText='position:absolute;left:-9999px;top:0;width:170mm;background:#fff;';
  wrap.appendChild(clone);
  document.body.appendChild(wrap);

  const L=_collectLease();
  const filename=((L.lesseeName||'Lease').replace(/[^a-zA-Z0-9 ]/g,'_').trim()||'Lease')+'_Deed.pdf';

  html2pdf().set({
    margin:[0,18,18,18], // top=0 because stamp space is baked into HTML
    filename:filename,
    image:{type:'jpeg',quality:0.98},
    html2canvas:{scale:2,useCORS:true,logging:false},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
  }).from(wrap).toPdf().get('pdf').then(function(pdf){
    const n=pdf.internal.getNumberOfPages();
    const pw=pdf.internal.pageSize.getWidth();
    const ph=pdf.internal.pageSize.getHeight();
    for(let i=1;i<=n;i++){
      pdf.setPage(i);
      pdf.setFont('times','normal');
      pdf.setFontSize(9);
      pdf.setTextColor(120,120,120);
      pdf.text('Page '+i+' of '+n, pw/2, ph-6, {align:'center'});
    }
    pdf.save(filename);
    if(document.body.contains(wrap))document.body.removeChild(wrap);
    toast('✅ PDF saved — check Downloads');
  }).catch(function(e){
    if(document.body.contains(wrap))document.body.removeChild(wrap);
    console.error('PDF error:',e);
    toast('⚠️ PDF failed — opening print window');
    // Desktop-only fallback
    const pv=document.getElementById('loPreview');
    if(!pv)return;
    const css=_deedPrintCSS();
    const html='<!DOCTYPE html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Lease Deed</title><style>'+css+'</style></head><body>'+pv.innerHTML+'<script>setTimeout(function(){window.print();},400);<\/script></body></html>';
    try{const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();}else toast('❌ Allow popups to print');}catch(e){toast('❌ Could not open print window');}
  });
}

// ── ROOM SORT HELPER ──
// Sorts rooms by unit number (numeric where possible, alphanumeric fallback)
// Floor order for units named by floor ("Basement", "Ground Floor", "1st Floor Front", "FF Rear" …):
// basement → lower ground → ground → upper ground → 1st → 2nd → … → terrace, then front → middle → rear.
// Returns null when the unit name doesn't mention a floor (plain numbers like 101 keep their old order).
function floorRank(r){
  const t=(' '+String(r.unitNo||'')+' '+String(r.type||'')+' ').toLowerCase().replace(/[-_.,/]/g,' ');
  let f=null;
  if(/basement|bsmt|\blgf?\b|lower ground/.test(t))f=-1;
  else if(/upper ground|\bugf?\b/.test(t))f=0.5;
  else if(/ground|\bgf\b|\bgrd\b|\bg\b/.test(t))f=0;
  else { const words=['first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth'];
    for(let i=0;i<words.length&&f===null;i++){ const n=i+1, ord=n+(n===1?'st':n===2?'nd':n===3?'rd':'th');
      const ab=['ff','sf','tf'][i]; const re=new RegExp('\\b('+words[i]+'|'+ord+'|'+n+'f'+(ab?'|'+ab:'')+')\\b|\\b'+n+'\\s*floor\\b');
      if(re.test(t))f=n; }
    if(f===null&&/terrace|roof|penthouse/.test(t))f=50; }
  if(f===null)return null;
  const pos=/front/.test(t)?0:/middle|centre|center|mid\b/.test(t)?1:/rear|back/.test(t)?2:0.5;
  return f*10+pos;
}
function sortRooms(rooms){
  return [...(rooms||[])].sort((a,b)=>{
    const fa=floorRank(a), fb=floorRank(b);
    if(fa!==null&&fb!==null&&fa!==fb)return fa-fb;
    if(fa!==null&&fb===null)return -1;
    if(fa===null&&fb!==null)return 1;
    const ua=String(a.unitNo||''), ub=String(b.unitNo||'');
    const na=Number(ua), nb=Number(ub);
    if(!isNaN(na)&&!isNaN(nb)&&ua!==''&&ub!=='')return na-nb;
    return ua.localeCompare(ub,undefined,{numeric:true,sensitivity:'base'});
  });
}

// ── PER-TAB EXPORT ───────────────────────────────────────────
// Downloads a dated JSON backup of any tab's data.
// Use on the 1st of every month as a manual backup habit.
function exportRentData(tab){
  const dateStr=new Date().toISOString().slice(0,10);
  let payload,filename;
  switch(tab){
    case 'properties':
      payload={exportedAt:new Date().toISOString(),tab:'Properties',
        totalProperties:(S.properties||[]).length,
        totalRooms:(S.properties||[]).reduce((a,p)=>a+(p.rooms||[]).length,0),
        properties:S.properties||[]};
      filename='rentdesk-properties-'+dateStr+'.json'; break;
    case 'expenses':
      payload={exportedAt:new Date().toISOString(),tab:'Expenses',
        totalExpenses:(S.expenses||[]).length,expenses:S.expenses||[]};
      filename='rentdesk-expenses-'+dateStr+'.json'; break;
    case 'cash':
      payload={exportedAt:new Date().toISOString(),tab:'Cash',
        totalEntries:(S.cash||[]).length,cash:S.cash||[]};
      filename='rentdesk-cash-'+dateStr+'.json'; break;
    case 'leases':
      payload={exportedAt:new Date().toISOString(),tab:'Leases',
        totalLeases:(S.leases||[]).length,leases:S.leases||[]};
      filename='rentdesk-leases-'+dateStr+'.json'; break;
    case 'full':
      payload={exportedAt:new Date().toISOString(),tab:'Full Backup',data:S};
      filename='rentdesk-full-backup-'+dateStr+'.json'; break;
    default:
      payload={exportedAt:new Date().toISOString(),tab:'Full Backup',data:S};
      filename='rentdesk-full-backup-'+dateStr+'.json';
  }
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('📥 Exported: '+filename);
  if((tab==='full'||!tab)&&isAdmin&&driveQueueBackup('manual backup'))setTimeout(()=>toast('☁️ Also saving this backup to Google Drive…',3500),1200);
}

function updCash(id){

  const note=document.getElementById('ecNote').value.trim();
  if(!amt){toast('❌ Amount required');return;}
  if(!date){toast('❌ Date required');return;}
  const pid=document.getElementById('ecProp').value;
  const pLabel=pid?((S.properties.find(p=>p.id===pid)||{}).name||'Unknown'):'Other / General';
  const oldAmt=x.amount;
  x.amount=Number(amt);
  x.date=date;
  x.note=note;
  x.propertyId=pid;
  x.propertyLabel=pLabel;
  if(x.type==='given'){
    const srcEl=document.getElementById('ecSrc');
    if(srcEl)x.source=srcEl.value.trim();
  }
  // If this was a cash-spent entry, update its linked expense too
  if(x.type==='spent'){
    const linkedExp=(S.expenses||[]).find(e=>e.cashId===id);
    if(linkedExp){
      linkedExp.amount=Number(amt);
      linkedExp.date=date;
      linkedExp.month=date.substr(0,7);
      linkedExp.propertyId=pid;
      if(linkedExp.items&&linkedExp.items[0]){
        linkedExp.items[0].amount=Number(amt);
        if(note)linkedExp.items[0].desc=note+' (Preeti)';
      }
    }
  }
  actLog('Cash entry updated — ₹'+Number(amt).toLocaleString('en-IN'));
  sched();closeM();renderCash();toast('✅ Updated');
}

                const months=new Set([...payments.map(p=>p.month),...elecH.map(e=>e.month),...dedH.map(d=>d.month)].filter(Boolean));
                if(!months.size)return '';
                const sortedMonths=[...months].sort();
                const rent=Number(t.rentAmount||0);
                let runningBal=0;
                const rows=sortedMonths.map(mo=>{
                  const elec=elecH.find(e=>e.month===mo);
                  const elecAmt=Number((elec&&elec.amount)||0);
                  const ded=dedH.filter(d=>d.month===mo).reduce((s,d)=>s+Number(d.amount||0),0);
                  const paid=payments.filter(p=>p.month===mo).reduce((s,p)=>s+Number(p.amount||0),0);
                  const due=rent+elecAmt+runningBal-ded;
                  const bal=Math.max(0,due-paid);
                  runningBal=bal;
                  const pendColor=bal>0?'color:#EF4444;font-weight:700':'color:#10B981';
                  return '<tr>'
                    +'<td style="font-size:12px;">'+ml(mo)+'</td>'
                    +'<td style="text-align:right;">'+fm(rent)+'</td>'
                    +'<td style="text-align:right;color:#3B82F6;">'+(elecAmt>0?fm(elecAmt):'—')+'</td>'
                    +'<td style="text-align:right;color:#8B5CF6;">'+(ded>0?'-'+fm(ded):'—')+'</td>'
                    +'<td style="text-align:right;font-weight:600;">'+fm(due)+'</td>'
                    +'<td style="text-align:right;color:#10B981;font-weight:600;">'+fm(paid)+'</td>'
                    +'<td style="text-align:right;'+pendColor+'">'+(bal>0?fm(bal):'✓')+'</td>'
                    +'</tr>';
                }).join('');
                return '<div style="font-weight:600;margin:10px 0 6px;font-size:13px;">📋 Month-by-Month History</div>'
                +'<div style="overflow-x:auto;">'
                +'<table style="width:100%;border-collapse:collapse;font-size:12px;">'
                +'<thead><tr style="background:#F9FAFB;">'
                +'<th style="padding:5px 8px;text-align:left;color:#6B7280;font-size:11px;">Month</th>'
                +'<th style="padding:5px 8px;text-align:right;color:#6B7280;font-size:11px;">Rent</th>'
                +'<th style="padding:5px 8px;text-align:right;color:#3B82F6;font-size:11px;">Elec</th>'
                +'<th style="padding:5px 8px;text-align:right;color:#8B5CF6;font-size:11px;">Deduct</th>'
                +'<th style="padding:5px 8px;text-align:right;color:#F97316;font-size:11px;">Due</th>'
                +'<th style="padding:5px 8px;text-align:right;color:#10B981;font-size:11px;">Paid</th>'
                +'<th style="padding:5px 8px;text-align:right;color:#EF4444;font-size:11px;">Balance</th>'
                +'</tr></thead>'
                +'<tbody>'+rows+'</tbody>'
                +'</table></div>';
              })()}
            </div>
          </details>
        </div>`).join('')}
      <div style="height:8px;border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;margin-bottom:2px;"></div>`).join('')}`;
}

function editSettlement(pastId){
  const t=(S.pastTenants||[]).find(x=>x.id===pastId);if(!t)return;
  const s=t.settlement||{};
  openM('✏️ Edit Settlement — '+t.name,`
    <div style="background:var(--orange-dim);border:1px solid var(--orange);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;">
      Fill in any missing amounts — useful for tenants vacated before the new settlement form was added.
    </div>
    <div class="fsec">What Tenant Owed</div>
    <div class="frow">
      <div><label class="flabel">Rent Due (₹)</label>
        <input class="finput" type="number" id="es_dues" value="${s.rentPending||0}"/></div>
      <div><label class="flabel">Cleaning Charge (₹)</label>
        <input class="finput" type="number" id="es_clean" value="${s.cleaningCharge||0}"/></div>
    </div>
    <div class="frow">
      <div><label class="flabel">Damage (₹)</label>
        <input class="finput" type="number" id="es_damage" value="${s.damageDeductions||0}"/></div>
      <div><label class="flabel">Other Deductions (₹)</label>
        <input class="finput" type="number" id="es_other" value="${s.otherDeductions||0}"/></div>
    </div>
    <div class="fsec">Security & Payment</div>
    <div class="frow">
      <div><label class="flabel">Security Held (₹)</label>
        <input class="finput" type="number" id="es_sec" value="${t.securityHeld||0}"/></div>
      <div><label class="flabel">Security Adjusted Against Dues (₹)</label>
        <input class="finput" type="number" id="es_secadj" value="${s.securityAdjusted||0}"/></div>
    </div>
    <div class="frow">
      <div><label class="flabel">Cash / UPI Paid on Vacating Day (₹)</label>
        <input class="finput" type="number" id="es_cash" value="${s.cashPaidOnDay||0}"/></div>
      <div><label class="flabel">Payment Mode</label>
        <select class="fselect" id="es_mode">
          <option ${(s.paymentMode||'')==='Cash'?'selected':''}>Cash</option>
          <option ${(s.paymentMode||'')==='UPI'?'selected':''}>UPI</option>
          <option ${(s.paymentMode||'')==='Bank Transfer'?'selected':''}>Bank Transfer</option>
          <option ${(s.paymentMode||'')==='Cheque'?'selected':''}>Cheque</option>
        </select></div>
    </div>
    <div id="es_preview" style="background:#F9FAFB;border:1.5px solid var(--border);border-radius:8px;padding:12px;margin-top:10px;font-size:13px;">
      <div style="color:var(--muted);font-size:12px;margin-bottom:6px;">Live preview</div>
      <div style="display:flex;justify-content:space-between;"><span>Security Held</span><span id="es_p_sec">—</span></div>
      <div style="display:flex;justify-content:space-between;color:var(--red);"><span>Total Dues</span><span id="es_p_dues">—</span></div>
      <div style="display:flex;justify-content:space-between;"><span>Security Adjusted</span><span id="es_p_adj" style="color:var(--orange);">—</span></div>
      <div style="display:flex;justify-content:space-between;"><span>Cash Paid</span><span id="es_p_cash" style="color:var(--green);">—</span></div>
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px;border-top:1px solid var(--border);padding-top:8px;margin-top:6px;">
        <span>Final Balance</span><span id="es_p_net">—</span>
      </div>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button>
     <button class="btn btn-orange" onclick="saveEditSettlement('${pastId}')">💾 Save Settlement</button>`);
  // Attach live calc
  ['es_dues','es_clean','es_damage','es_other','es_sec','es_secadj','es_cash'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('input',previewEditSettlement);
  });
  previewEditSettlement();
}
function previewEditSettlement(){
  const sec=Number(document.getElementById('es_sec').value||0);
  const dues=Number(document.getElementById('es_dues').value||0)+Number(document.getElementById('es_clean').value||0)+Number(document.getElementById('es_damage').value||0)+Number(document.getElementById('es_other').value||0);
  const secAdj=Number(document.getElementById('es_secadj').value||0);
  const cash=Number(document.getElementById('es_cash').value||0);
  const net=sec-dues+cash;
  document.getElementById('es_p_sec').textContent=fm(sec);
  document.getElementById('es_p_dues').textContent=fm(dues);
  document.getElementById('es_p_adj').textContent=fm(secAdj);
  document.getElementById('es_p_cash').textContent=fm(cash);
  const netEl=document.getElementById('es_p_net');
  if(net>0){netEl.textContent=fm(net)+' refund to tenant';netEl.style.color='var(--green)';}
  else if(net<0){netEl.textContent=fm(Math.abs(net))+' tenant owes';netEl.style.color='var(--red)';}
  else{netEl.textContent='✓ Fully settled';netEl.style.color='var(--green)';}
}
function saveEditSettlement(pastId){
  const t=(S.pastTenants||[]).find(x=>x.id===pastId);if(!t)return;
  const dues=Number(document.getElementById('es_dues').value||0);
  const clean=Number(document.getElementById('es_clean').value||0);
  const damage=Number(document.getElementById('es_damage').value||0);
  const other=Number(document.getElementById('es_other').value||0);
  const sec=Number(document.getElementById('es_sec').value||0);
  const secAdj=Number(document.getElementById('es_secadj').value||0);
  const cash=Number(document.getElementById('es_cash').value||0);
  const mode=document.getElementById('es_mode').value;
  const totalDed=dues+clean+damage+other;
  const net=sec-totalDed+cash;
  t.securityHeld=sec;
  t.settlement={
    ...t.settlement,
    rentPending:dues,
    cleaningCharge:clean,
    damageDeductions:damage,
    otherDeductions:other,
    totalDeductions:totalDed,
    securityAdjusted:secAdj,
    cashPaidOnDay:cash,
    paymentMode:mode,
    netRefund:net,
    balanceStatus:net>0?'refund_pending':net<0?'payment_pending':'settled',
    refundStatus:net>0&&t.settlement.refundStatus!=='paid'?'pending':t.settlement.refundStatus,
  };
  sched();closeM();renderPast();
  toast('✅ Settlement updated for '+t.name);
}
// ── Security refund / final balance after vacating ──
// netRefund > 0 → we owe the tenant a refund · netRefund < 0 → tenant owes us.
// Payments are recorded in t.settlement.refundPayments (part-payments allowed). If staff pays a refund (or
// receives the tenant's balance) in cash, it's also written to their Cash & Exp book automatically.
// Plain-language refund status used in reports
function refundLabelText(t){
  const f=refundInfo(t); if(!f.due)return'Settled — nothing to refund';
  const last=f.pays[f.pays.length-1];
  if(f.left<=0)return (f.isRefund?'Refunded ':'Balance received ')+'₹'+f.due.toLocaleString('en-IN')+(last?' on '+fd(last.date):'');
  return (f.isRefund?'Refund ₹':'Owes ₹')+f.due.toLocaleString('en-IN')+(f.paid?' · '+(f.isRefund?'paid ':'received ')+'₹'+f.paid.toLocaleString('en-IN')+' · ₹'+f.left.toLocaleString('en-IN')+' left':(f.isRefund?' · not paid yet':' · pending'));
}
function refundTone(t){ const f=refundInfo(t); return !f.due||f.left<=0?'#10B981':(f.isRefund?'#D97706':'#EF4444'); }
// Vacated this month, plus any refund paid this month for someone who left earlier
function settlementsForMonth(month,filterPropId){
  return (S.pastTenants||[]).filter(t=>(!filterPropId||t.propertyId===filterPropId)&&t.settlement&&(
      sameMonthDate(t.vacatingDate,month)||(t.settlement.refundPayments||[]).some(x=>(x.date||'').slice(0,7)===month)))
    .map(t=>{ const f=refundInfo(t);
      return{name:t.name||'—',prop:t.propertyName||'',unit:(t.roomType||'')+(t.unitNo?' #'+t.unitNo:''),vacated:t.vacatingDate,leftThisMonth:sameMonthDate(t.vacatingDate,month),
        secHeld:Number(t.securityHeld||0),secAdj:Number((t.settlement&&t.settlement.securityAdjusted)||0),isRefund:f.isRefund,due:f.due,paid:f.paid,left:f.left,
        paysThisMonth:f.pays.filter(x=>(x.date||'').slice(0,7)===month),label:refundLabelText(t),tone:refundTone(t)}; })
    .sort((a,b)=>(a.prop+a.unit).localeCompare(b.prop+b.unit));
}
function refundInfo(t){
  const s=t.settlement||{}, net=Number(s.netRefund||0), due=Math.abs(net);
  const pays=s.refundPayments||[];
  let paid=pays.reduce((a,x)=>a+Number(x.amount||0),0);
  if(!pays.length&&s.refundStatus==='paid')paid=due;            // marked paid before part-payments existed
  return{isRefund:net>0,owes:net<0,due,paid,left:Math.max(0,due-paid),pays};
}
function refundLinesH(t){
  const f=refundInfo(t); if(!f.due)return '';
  if(!f.pays.length){ const s=t.settlement||{}; if(f.left>0||!(s.refundDate||s.refundMode))return '';
    return `<div class="rf-line">✓ ${f.isRefund?'Refunded':'Received'} ${fm(f.due)}${s.refundDate?' on '+fd(s.refundDate):''}${s.refundMode?' · '+_escHtml(s.refundMode):''}</div>`; }
  return f.pays.map(x=>`<div class="rf-line">✓ ${fm(x.amount)} ${f.isRefund?'refunded':'received'} on <b>${fd(x.date)}</b> · ${_escHtml(x.mode||'')}${x.ref?' · Ref: '+_escHtml(x.ref):''}${x.by?' · '+(f.isRefund?'paid by ':'received by ')+_escHtml(x.by):''}${x.note?'<br/><span style="color:var(--muted);">'+_escHtml(x.note)+'</span>':''}</div>`).join('');
}
function refundActionH(t){
  const f=refundInfo(t); if(!f.due)return'<span style="font-size:11px;color:var(--muted);">Settled</span>';
  if(f.left<=0){ const last=f.pays[f.pays.length-1]; return`<span class="badge badge-grn">✓ ${f.isRefund?'Refunded':'Received'}</span><div style="font-size:10px;color:var(--muted);margin-top:3px;">${last?fd(last.date):(t.settlement.refundDate?fd(t.settlement.refundDate):'')}</div><button class="btn btn-ghost btn-xs" style="margin-top:3px;" onclick="openRefundForm('${t.id}')">History</button>`; }
  return`<button onclick="openRefundForm('${t.id}')" style="background:${f.isRefund?'var(--green-dim)':'var(--amber-dim)'};color:${f.isRefund?'var(--green)':'#B45309'};border:1px solid ${f.isRefund?'rgba(16,185,129,.3)':'rgba(245,158,11,.4)'};border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;">${f.isRefund?'💸 Pay Refund':'💰 Receive Balance'}</button>
    <div style="font-size:10px;margin-top:3px;color:${f.isRefund?'var(--green)':'var(--red)'};">${f.paid?fm(f.paid)+' paid · ':''}${fm(f.left)} ${f.isRefund?'to refund':'pending'}</div>`;
}
function openRefundForm(pastId){
  const t=(S.pastTenants||[]).find(x=>x.id===pastId);if(!t)return;
  const f=refundInfo(t), who=[...staffList(),'KD Taneja'];
  const hist=f.pays.length?`<div class="fsec">Already ${f.isRefund?'refunded':'received'}</div>`+f.pays.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border);"><span>${fd(x.date)} · ${x.mode||''}${x.ref?' · Ref: '+_escHtml(x.ref):''} · by ${x.by||'—'}${x.note?' · '+_escHtml(x.note):''}${isAdmin?` <a href="#" style="color:var(--orange);" onclick="editRefundRef('${pastId}','${x.id}');return false;">✏️ ref</a>`:''}</span><span style="white-space:nowrap;"><strong>${fm(x.amount)}</strong> ${isAdmin?`<button class="btn btn-ghost btn-xs" onclick="delRefundPayment('${pastId}','${x.id}')">🗑</button>`:''}</span></div>`).join(''):'';
  openM((f.isRefund?'💸 Security Refund — ':'💰 Balance from ')+t.name,`
    <div style="background:${f.isRefund?'var(--green-dim)':'var(--amber-dim)'};border:1px solid ${f.isRefund?'var(--green)':'var(--amber)'};border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;line-height:1.7;">
      ${t.propertyName||''} · ${t.roomType||''}${t.unitNo?' #'+t.unitNo:''} · vacated ${fd(t.vacatingDate)}<br/>
      ${f.isRefund?'Refund due to tenant':'Tenant owes'}: <strong>${fm(f.due)}</strong>${f.paid?` · ${f.isRefund?'refunded':'received'} so far <strong>${fm(f.paid)}</strong>`:''} · <strong>${fm(f.left)} left</strong></div>
    ${hist}
    ${f.left>0?`<div class="fsec">${f.isRefund?'Pay refund now':'Record payment now'}</div>
    <div class="frow"><div><label class="flabel">Amount (₹) *</label><input class="finput" type="number" id="rf_amt" value="${f.left}"/></div>
      <div><label class="flabel">Date</label><input class="finput" type="date" id="rf_date" value="${today()}"/></div></div>
    <div class="frow"><div><label class="flabel">Mode</label><select class="fselect" id="rf_mode" onchange="refModeChange('rf_ref',this.value)">${['Bank Transfer','UPI','Cash','Cheque'].map(m=>`<option>${m}</option>`).join('')}</select></div>
      <div><label class="flabel">${f.isRefund?'Paid by':'Received by'}</label><select class="fselect" id="rf_by">${who.map(w=>`<option ${w==='KD Taneja'?'selected':''}>${w}</option>`).join('')}</select></div></div>
    ${refFieldH('rf_ref','Bank Transfer')}
    <div class="frow1"><label class="flabel">Note <span style="color:var(--muted);font-weight:400;text-transform:none;">optional</span></label><input class="finput" id="rf_note" placeholder="Remarks"/></div>
    <div style="font-size:11px;color:var(--muted);">If ${staffList().join(' / ')} ${f.isRefund?'pays':'receives'} it, it's ${f.isRefund?'taken out of':'added to'} their cash in Cash &amp; Exp automatically.</div>`:`<div style="text-align:center;color:var(--green);font-weight:700;padding:8px;">✓ Fully ${f.isRefund?'refunded':'received'}</div>`}`,
    `<button class="btn btn-ghost" onclick="closeM()">Close</button>${f.left>0?`<button class="btn ${f.isRefund?'btn-green':'btn-orange'}" onclick="saveRefundPayment('${pastId}')">✅ Save</button>`:''}`);
}
function _syncRefundStatus(t){
  const f=refundInfo(t), s=t.settlement;
  if(f.left<=0){ s.refundStatus='paid'; s.balanceStatus='settled'; const last=f.pays[f.pays.length-1]; if(last){ s.refundDate=last.date; s.refundMode=last.mode; } }
  else { s.refundStatus=f.paid>0?'partial':(f.isRefund?'pending':'owed'); s.balanceStatus=f.isRefund?'refund_pending':'payment_pending'; }
}
function saveRefundPayment(pastId){
  const t=(S.pastTenants||[]).find(x=>x.id===pastId);if(!t)return;
  const f=refundInfo(t);
  const amt=Number((document.getElementById('rf_amt')||{}).value||0);
  if(!(amt>0)){toast('❌ Enter the amount');return;}
  if(amt>f.left+0.5&&!confirm('This is more than the '+fm(f.left)+' left. Save anyway?'))return;
  const by=document.getElementById('rf_by').value, date=document.getElementById('rf_date').value||today(), mode=document.getElementById('rf_mode').value, note=(document.getElementById('rf_note').value||'').trim(), ref=refRead('rf_ref',mode);
  if(ref===null)return;
  const pay={id:uid(),amount:amt,date,mode,ref,by,note,recordedBy:user};
  if(!t.settlement.refundPayments)t.settlement.refundPayments=[];
  // carry over an old "marked paid" with no amounts so the history stays right
  t.settlement.refundPayments.push(pay);
  if(staffList().includes(by)){
    if(!S.cash)S.cash=[];
    const c={id:uid(),type:f.isRefund?'refundout':'tenantpay',staff:by,date,amount:amt,propertyId:t.propertyId||'',propertyLabel:t.propertyName||'',
      note:(f.isRefund?'Security refund — ':'Final balance from ')+t.name+(note?' · '+note:''),by:user,pastId,refundPayId:pay.id};
    S.cash.push(c); pay.cashId=c.id;
  }
  _syncRefundStatus(t);
  actLog((f.isRefund?'Refund paid to ':'Balance received from ')+t.name+' — '+fm(amt)+' ('+mode+', by '+by+')');
  sched();closeM();renderTab();
  toast(f.isRefund?'✅ Refund of '+fm(amt)+' recorded':'✅ '+fm(amt)+' received');
}
function editRefundRef(pastId,payId){
  const t=(S.pastTenants||[]).find(x=>x.id===pastId); const x=t&&((t.settlement||{}).refundPayments||[]).find(p=>p.id===payId); if(!x)return;
  const v=prompt('UPI / bank ref no., cheque no. or paid-to account for '+fm(x.amount)+' on '+fd(x.date)+':',x.ref||''); if(v===null)return;
  x.ref=v.trim(); actLog('Refund reference updated — '+t.name); sched(); openRefundForm(pastId); renderTab();
}
function delRefundPayment(pastId,payId){
  const t=(S.pastTenants||[]).find(x=>x.id===pastId);if(!t)return;
  const pay=(t.settlement.refundPayments||[]).find(x=>x.id===payId);if(!pay)return;
  if(!confirm('Remove this '+fm(pay.amount)+' entry?'))return;
  t.settlement.refundPayments=t.settlement.refundPayments.filter(x=>x.id!==payId);
  if(pay.cashId)S.cash=(S.cash||[]).filter(c=>c.id!==pay.cashId);
  _syncRefundStatus(t);
  actLog('Refund entry removed — '+t.name+' '+fm(pay.amount));
  sched();openRefundForm(pastId);renderTab();
}
// older buttons (Past tab) open the same form
function markRefundPaid(pastId){ openRefundForm(pastId); }

// ── Install-to-home-screen support ──
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('rentdesk-sw.js').catch(()=>{}); });
}
