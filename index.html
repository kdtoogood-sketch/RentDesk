<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>RentDesk — KDC Infra</title>
<link rel="manifest" href="rentdesk-manifest.json"/>
<meta name="theme-color" content="#F97316"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="RentDesk"/>
<meta name="application-name" content="RentDesk"/>
<link rel="apple-touch-icon" href="rentdesk-icon-180.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="rentdesk-icon-192.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="rentdesk-favicon-32.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#F5F6FA;--white:#FFFFFF;--orange:#F97316;--orange2:#EA6A0A;
  --orange-dim:rgba(249,115,22,0.08);--orange-mid:rgba(249,115,22,0.15);
  --ink:#1A1A1A;--ink2:#555555;--muted:#9CA3AF;--border:#E8ECF0;
  --red:#EF4444;--red-dim:rgba(239,68,68,0.1);
  --green:#10B981;--green-dim:rgba(16,185,129,0.1);
  --blue:#3B82F6;--blue-dim:rgba(59,130,246,0.1);
  --amber:#F59E0B;--amber-dim:rgba(245,158,11,0.1);
  --purple:#8B5CF6;--purple-dim:rgba(139,92,246,0.1);
  --shadow:0 2px 12px rgba(0,0,0,0.06);--shadow-md:0 4px 24px rgba(0,0,0,0.1);--r:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:'Inter',sans-serif;}
button{cursor:pointer;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* LOGIN */
#loginScreen{position:fixed;inset:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);padding:20px;z-index:9999;}
.login-wrap{width:100%;max-width:380px;}
.login-logo{margin-bottom:32px;text-align:center;}
.login-brand-small{font-size:11px;font-weight:600;color:rgba(255,255,255,0.6);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
.login-brand{font-family:'Space Grotesk';font-size:32px;font-weight:700;color:#fff;}
.login-brand span{color:var(--orange);}
.login-card{background:#fff;border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,0.4);padding:32px;}
.login-title{font-family:'Space Grotesk';font-size:18px;font-weight:700;margin-bottom:4px;color:#1A1A1A;}
.login-desc{font-size:13px;color:#666;margin-bottom:24px;}
.fl{margin-bottom:16px;}
.fl label{display:block;font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px;}
.fi{width:100%;padding:11px 14px;background:#F8F9FA;border:1.5px solid #DDE1E7;border-radius:8px;color:#1A1A1A;font-size:14px;outline:none;transition:border-color .2s;}
.fi:focus{border-color:var(--orange);background:#fff;}
.fi::placeholder{color:#AAA;}
.login-btn{width:100%;padding:13px;background:var(--orange);border:none;border-radius:8px;font-family:'Space Grotesk';font-size:15px;font-weight:700;color:#fff;transition:all .2s;}
.login-btn:hover{background:var(--orange2);}
.login-err{color:#DC2626;font-size:12px;margin-top:10px;display:none;padding:10px 12px;background:#FEE2E2;border-radius:6px;}
.login-hint{margin-top:14px;font-size:12px;color:#888;text-align:center;}
.login-hint strong{color:#555;}

/* SHELL */
#app{display:none;height:100vh;flex-direction:column;overflow:hidden;}
.topbar{height:56px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,0.04);}
.topbar-left{display:flex;align-items:center;gap:6px;}
.tb-brand{font-family:'Space Grotesk';font-size:17px;font-weight:700;color:var(--ink);}
.tb-brand span{color:var(--orange);}
.tb-co{font-size:10px;color:var(--muted);letter-spacing:.5px;}
.tb-sep{color:var(--border);font-size:16px;padding:0 4px;}
.tb-crumb{font-size:12px;color:var(--muted);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.tb-user{font-size:12px;color:var(--ink2);padding:5px 12px;background:var(--bg);border-radius:20px;border:1px solid var(--border);}
.tb-role{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 8px;border-radius:4px;}
.tb-role.admin{background:var(--orange-dim);color:var(--orange);}
.tb-role.staff{background:var(--blue-dim);color:var(--blue);}
.tb-logout{width:32px;height:32px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.tb-logout:hover{border-color:var(--red);color:var(--red);}
.tabs{display:none;} /* hidden - replaced by bottom nav */
.content{flex:1;overflow-y:auto;padding:18px;padding-bottom:230px;} /* bottom padding for nav */

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--white);border-top:1px solid var(--border);
  display:flex;flex-wrap:wrap;
  height:220px;z-index:100;
  box-shadow:0 -2px 12px rgba(0,0,0,0.08);
}
.bn-row-divider{display:none;}
.bn-item{
  width:33.3333%;height:55px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;background:none;border:none;
  border-bottom:1px solid var(--border);
  transition:all .2s;color:var(--muted);
}
.bn-item:nth-child(n+7){border-bottom:none;}
.bn-item.active{color:var(--orange);background:var(--orange-dim);}
.bn-item:hover{color:var(--ink2);}
.bn-icon{font-size:20px;line-height:1;}
.bn-label{font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;}
.bn-item.active .bn-icon{transform:scale(1.1);}

/* LEASE OVERLAY */
#leaseOverlay{position:fixed;inset:0;background:#0008;z-index:300;display:none;flex-direction:column;overflow:hidden;}
#leaseOverlay.open{display:flex;}
.lo-head{height:52px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex-shrink:0;box-shadow:var(--shadow);}
.lo-title{font-family:'Space Grotesk';font-weight:700;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px;}
.lo-actions{display:flex;gap:8px;align-items:center;}
.lo-body{flex:1;display:flex;overflow:hidden;}
.lo-form{width:380px;flex-shrink:0;overflow-y:auto;padding:16px;background:var(--bg);border-right:1px solid var(--border);}
.lo-preview{flex:1;overflow-y:auto;padding:24px 32px;background:#fff;}
@media(max-width:800px){
  .lo-body{flex-direction:column;}
  .lo-form{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:50vh;}
  .lo-preview{padding:16px;}
}
.deed-wrap{font-family:'Times New Roman',Times,serif;font-size:14px;line-height:1.75;color:#111;max-width:680px;margin:0 auto;}
.deed-wrap h2{font-size:15px;font-weight:700;text-align:center;text-decoration:underline;letter-spacing:1.5px;margin-bottom:18px;}
.deed-wrap p{text-align:justify;margin-bottom:10px;}
.deed-wrap ol{margin:0;padding-left:0;list-style:none;}
.deed-wrap ol li{margin-bottom:8px;padding-left:0;}
.deed-cl{font-weight:700;text-decoration:underline;font-size:12.5px;}
.deed-pg{page-break-before:always;padding-top:24px;}
.deed-sig{display:flex;justify-content:space-between;margin-top:32px;gap:24px;}
.deed-sig-blk{flex:1;text-align:center;border-top:1px solid #333;padding-top:8px;font-size:12px;}
.deed-wit{display:flex;gap:40px;margin-bottom:28px;}
.deed-wit-blk{flex:1;border-top:1px solid #333;padding-top:6px;font-size:12px;}
.renewal-banner{background:#EFF6FF;border:1.5px solid var(--blue);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--blue);font-weight:600;}
/* stamp-space: hidden on screen, appears in print CSS */
.stamp-space{display:none;}
.stamp-file{display:block;margin-bottom:18px;}
.stamp-file img,.stamp-file embed{max-width:100%;max-height:220px;display:block;margin:0 auto;object-fit:contain;}
.stamp-file-name{font-size:11px;color:var(--muted);margin-top:6px;word-break:break-word;}
.lease-status-active{background:var(--green-dim);color:var(--green);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;}
.lease-status-expired{background:var(--red-dim);color:var(--red);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;}
.lease-status-renewed{background:#F3F4F6;color:var(--muted);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;}
.lease-status-urgent{display:inline-block;background:var(--red);color:#fff;padding:3px 9px;border-radius:10px;font-size:10px;font-weight:800;letter-spacing:.5px;animation:urgentPulse 1.6s ease-in-out infinite;white-space:nowrap;}
.lease-status-soon{background:var(--amber-dim);color:#B45309;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap;}
.lease-status-draft{display:inline-block;background:var(--blue-dim);color:var(--blue);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap;}
.tbl tr.row-draft td{background:#EFF6FF;}
.lease-status-closed{background:#F3F4F6;color:var(--muted);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;}
@keyframes urgentPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.55);}50%{box-shadow:0 0 0 6px rgba(239,68,68,0);}}
.urgent-card{background:#FEF2F2;border:2px solid var(--red);border-radius:var(--r);margin-bottom:16px;overflow:hidden;box-shadow:0 4px 18px rgba(239,68,68,.15);}
.urgent-head{background:var(--red);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:14px;}
.soon-card{background:#FFFBEB;border:1.5px solid var(--amber);border-radius:var(--r);margin-bottom:16px;overflow:hidden;}
.soon-head{background:var(--amber);color:#fff;padding:10px 16px;font-family:'Space Grotesk';font-weight:700;font-size:13px;}
.urgent-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(239,68,68,.18);flex-wrap:wrap;}
.urgent-row:last-child{border-bottom:none;}
.tbl tr.row-expired td{background:#FEF2F2;}
.tbl tr.row-soon td{background:#FFFBEB;}
.bn-item{position:relative;}
.bn-badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;animation:urgentPulse 1.6s ease-in-out infinite;}
.quick-room-row{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--border);font-size:13px;}
.quick-room-row:last-child{border-bottom:none;}

@media print{
  @page{
    size:A4 portrait;
    margin:10mm 18mm 15mm 18mm;
    @bottom-center{
      content:"Page " counter(page) " of " counter(pages);
      font-family:"Times New Roman",Times,serif;
      font-size:9pt;
      color:#555;
    }
  }
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body > *:not(#printZone){display:none !important;}
  #printZone{
    display:block !important;
    position:static !important;
    padding:0;
    background:#fff;
    overflow:visible !important;
  }
  #printZone .deed-wrap{
    font-family:'Times New Roman',Times,serif !important;
    font-size:16px !important;
    line-height:1.7 !important;
    color:#111 !important;
    max-width:700px !important;
    margin:0 auto !important;
    text-align:justify !important;
  }
  #printZone .deed-wrap h2{
    font-size:18px !important;
    letter-spacing:1px !important;
    margin-bottom:16px !important;
    text-align:center !important;
  }
  #printZone .deed-wrap p{margin-bottom:11px !important;text-align:justify !important;}
  #printZone .deed-wrap ol li{margin-bottom:9px !important;text-align:justify !important;}
  #printZone .deed-sig{margin-top:36px !important;}
  #printZone .deed-wit-label{margin-top:50px !important;display:block !important;}
  #printZone .deed-wit{margin-top:60px !important;margin-bottom:24px !important;}
  #printZone .deed-wit-blk{min-height:90px !important;padding-bottom:40px !important;}
  #printZone .deed-pg{page-break-before:auto !important;break-before:auto !important;padding-top:0 !important;}
  #printZone .deed-final{page-break-before:auto !important;break-before:auto !important;margin-top:10px !important;page-break-inside:avoid !important;break-inside:avoid !important;}
  #printZone .stamp-space{width:100%;}
  #printZone .stamp-space-on{display:block !important;height:18mm !important;}
  #printZone .stamp-space-off{display:none !important;height:0 !important;}
  #printZone .stamp-file{display:block !important;page-break-inside:avoid !important;break-inside:avoid !important;margin-bottom:8mm !important;}
  #printZone .stamp-file img,#printZone .stamp-file embed{max-width:100% !important;max-height:252mm !important;display:block !important;margin:0 auto !important;object-fit:contain !important;}
}

/* CARDS */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;}
.card-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-family:'Space Grotesk';font-weight:600;font-size:14px;color:var(--ink);}
.card-body{padding:18px;}

/* STATS */
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);}
.stat-icon{font-size:20px;margin-bottom:6px;}
.stat-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.stat-value{font-family:'Space Grotesk';font-size:26px;font-weight:700;line-height:1;}
.stat-value.ora{color:var(--orange);}
.stat-value.grn{color:var(--green);}
.stat-value.red{color:var(--red);}
.stat-value.blu{color:var(--blue);}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px;}

/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;border:none;transition:all .2s;cursor:pointer;letter-spacing:.2px;white-space:nowrap;}
.btn-orange{background:var(--orange);color:#fff;}
.btn-orange:hover{background:var(--orange2);}
.btn-ghost{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(249,115,22,0.2);}
.btn-ghost:hover{background:var(--orange-mid);}
.btn-red{background:var(--red-dim);color:var(--red);}
.btn-red:hover{background:rgba(239,68,68,0.18);}
.btn-green{background:var(--green-dim);color:var(--green);}
.btn-green:hover{background:rgba(16,185,129,0.18);}
.btn-blue{background:var(--blue-dim);color:var(--blue);}
.btn-blue:hover{background:rgba(59,130,246,0.18);}
.btn-amber{background:var(--amber-dim);color:var(--amber);}
.btn-amber:hover{background:rgba(245,158,11,0.18);}
.btn-purple{background:var(--purple-dim);color:var(--purple);}
.btn-purple:hover{background:rgba(139,92,246,0.18);}
.btn-sm{padding:6px 12px;font-size:11px;}
.btn-xs{padding:4px 9px;font-size:10px;border-radius:6px;}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.4px;}
.badge-grn{background:var(--green-dim);color:var(--green);}
.badge-red{background:var(--red-dim);color:var(--red);}
.badge-ora{background:var(--orange-dim);color:var(--orange);}
.badge-blu{background:var(--blue-dim);color:var(--blue);}
.badge-grey{background:#F3F4F6;color:var(--muted);}
.badge-amb{background:var(--amber-dim);color:var(--amber);}
.badge-pur{background:var(--purple-dim);color:var(--purple);}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:9px 14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);background:#F9FAFB;text-align:left;border-bottom:1px solid var(--border);}
.tbl td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--ink2);}
.tbl td strong{color:var(--ink);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:#FAFAFA;}

/* FORMS */
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
.frow1{margin-bottom:12px;}
.flabel{display:block;font-size:10px;font-weight:700;color:var(--ink2);letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px;}
.finput,.fselect,.ftextarea{width:100%;padding:10px 12px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--ink);font-size:13px;outline:none;transition:border-color .2s;}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:var(--orange);background:var(--white);}
.finput::placeholder{color:var(--muted);}
.ftextarea{resize:vertical;min-height:70px;}
.fhint{font-size:11px;color:var(--muted);margin-top:4px;}
.fsec{font-family:'Space Grotesk';font-size:11px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:1.5px;padding:10px 0 8px;border-bottom:1px solid var(--border);margin-bottom:12px;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(3px);}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--white);border:1px solid var(--border);border-radius:var(--r);width:100%;max-width:580px;margin:auto;transform:translateY(16px);transition:transform .2s;box-shadow:0 20px 60px rgba(0,0,0,0.12);}
.overlay.open .modal{transform:translateY(0);}
.modal-head{padding:16px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-family:'Space Grotesk';font-weight:700;font-size:15px;color:var(--ink);}
.modal-x{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:2px;line-height:1;transition:color .2s;}
.modal-x:hover{color:var(--red);}
.modal-body{padding:20px;max-height:72vh;overflow-y:auto;}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}

/* PROPERTY + ROOM CARDS */
.prop-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .2s;box-shadow:var(--shadow);}
.prop-card:hover{border-color:rgba(249,115,22,0.4);transform:translateY(-2px);box-shadow:var(--shadow-md);}
.prop-card-head{background:linear-gradient(135deg,var(--orange),#FB923C);padding:16px 18px;}
.prop-card-name{font-family:'Space Grotesk';font-weight:700;font-size:15px;color:#fff;}
.prop-card-addr{font-size:11px;color:rgba(255,255,255,0.8);margin-top:3px;}
.prop-card-body{padding:14px 18px;}
.prop-stat{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);}
.prop-stat:last-child{border-bottom:none;}
.prop-stat-label{font-size:11px;color:var(--muted);}
.prop-stat-value{font-size:13px;font-weight:600;color:var(--ink);}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;}
.room-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow);}
.room-card:hover{border-color:var(--orange);box-shadow:0 4px 16px rgba(249,115,22,0.12);}
.room-type{font-family:'Space Grotesk';font-weight:700;font-size:14px;color:var(--ink);margin-bottom:2px;}
.room-rent{font-size:13px;color:var(--orange);font-weight:600;margin-bottom:6px;}

<script>
// Global error handler - catches any JS crash
window.onerror=function(msg,src,line,col,err){
  const el=document.getElementById('loginScreen');
  if(el){
    const errDiv=document.createElement('div');
    errDiv.style.cssText='position:fixed;top:0;left:0;right:0;background:#EF4444;color:#fff;padding:10px;font-size:12px;z-index:9999;word-break:break-all;';
    errDiv.textContent='JS Error: '+msg+' (line '+line+')';
    document.body.appendChild(errDiv);
  }
  return false;
};
const FB_KEY='AIzaSyBiBmFAJHTxoZAddAON94u7FQ_d-RpX2io';
const FB_URL=`https://firestore.googleapis.com/v1/projects/propdesk-f50e0/databases/(default)/documents/rentdesk/main?key=${FB_KEY}`;
const DOCS_BASE=`https://firestore.googleapis.com/v1/projects/propdesk-f50e0/databases/(default)/documents/rentdesk_docs`;
const ADMIN='280190',STAFF='admin123';
const DOC_TYPES=[
  {key:'lease_deed',label:'Lease Deed / Agreement',icon:'📋',required:true},
  {key:'aadhaar',label:'Aadhaar Card',icon:'🪪',required:true},
  {key:'pan',label:'PAN Card',icon:'💳',required:true},
  {key:'office_id',label:'Office / Employment ID',icon:'🏢',required:false},
  {key:'police_ver',label:'Police Verification',icon:'🚔',required:false},
];

let S={properties:[],expenses:[],cash:[],tasks:[],reminders:[]};
let user=null,isAdmin=false,curTab='dash',vProp=null,vRoom=null,saveT=null;

// ── DATA SAFETY FLAGS ────────────────────────────────────────
// dataLoadedFromFirebase: becomes true only after Firebase 
// successfully returns data in this browser session.
// Until this is true, save() will NOT push to Firebase —
// it only saves to localStorage as a local backup.
// This prevents a fresh-browser or network-error scenario
// from pushing empty data and wiping all tenant/payment records.
let dataLoadedFromFirebase = false;

// lastKnownFirebaseData: a cache of the most recently 
// confirmed good data from Firebase. Used as a safety net
// if something tries to push corrupted/empty data.
let lastKnownFirebaseData = null;
// Server version (Firestore updateTime) of the copy we last loaded/saved. Every save is sent
// with this as a precondition, so a save from a stale phone can never silently overwrite
// newer data — instead the two versions are merged (see mergeState3) and saved again.
let remoteUpdateTime = null;
let billMo='',expMo='',cashMo='all';
let workDate='';

// ── UTILS ──
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5);}
function mk(d){const dt=d||new Date();return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');}
function ml(k){if(!k)return'—';const[y,m]=k.split('-');return new Date(y,m-1).toLocaleString('en-IN',{month:'long',year:'numeric'});}
function fd(s){if(!s)return'—';return new Date(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function fm(n){return'₹'+Number(n||0).toLocaleString('en-IN');}
function today(){return new Date().toISOString().split('T')[0];}
function dl(s){if(!s)return null;return Math.ceil((new Date(s)-new Date())/86400000);}
function sameOrBeforeToday(s){return !!s&&s<=today();}
function tenantIsActive(t){const d=(t&& (t.activeFrom||t.moveInDate))||'';return !!(t&&t.name&&sameOrBeforeToday(d||today()));}
function activeLeaseForRoom(r){
  return (S.leases||[]).find(l=>l.roomId===(r&&r.id)&&l.status==='active'&&(!l.leaseStart||sameOrBeforeToday(l.leaseStart)))||null;
}
// Security+Advance Due note only applies to tenants moving in from this month onward.
// Existing tenants (who moved in earlier) never get this note, even if their security
// isn't in the deposit ledger — for them that just means they paid before ledger tracking
// existed, not that they genuinely owe it. Update this if you want the cutoff to move.
const SEC_ADV_DUE_CUTOFF='2026-06';
function tenantTokenAmount(t){return Number((t&&(t.tokenAmount||t.tokenReceived||t.token))||0);}
// ── DEPOSIT LEDGER (token / security / advance rent) ──
// Every time such money changes hands, we push a dated entry here instead of just
// overwriting a balance field. This lets us answer "how much security did X pay,
// and in which month" at any point in the future, including after vacating.
// Entry shape: {id, kind:'token'|'security'|'advance', amount, date, month, mode, notes}
function addDepositEntry(r,kind,amount,date,mode,notes){
  if(!r)return;
  if(!r.depositLedger)r.depositLedger=[];
  amount=Number(amount||0);
  if(!amount)return;
  r.depositLedger.push({
    id:uid(),
    kind, // 'token' | 'security' | 'advance'
    amount,
    date:date||today(),
    month:(date||today()).slice(0,7),
    mode:mode||'Cash',
    notes:notes||''
  });
}
function depositLedgerTotal(r,kind,month){
  if(!r||!r.depositLedger)return 0;
  return r.depositLedger
    .filter(e=>(!kind||e.kind===kind)&&(!month||e.month===month))
    .reduce((s,e)=>s+Number(e.amount||0),0);
}
function depositLedgerForMonth(r,month){
  if(!r||!r.depositLedger)return[];
  return r.depositLedger.filter(e=>e.month===month);
}
// Security + advance rent is payable in full in the tenant's move-in month (per lease start date),
// separate from monthly rent. This shows what's still owed against that one-time target —
// e.g. security 20k + advance 20k = 40k target, minus a 5k token already paid = 35k pending.
// Returns null if this room/month isn't the move-in month (so it doesn't linger in later months).
function securityAdvanceDueForMonth(r,month){
  // Move-in date can live on r.tenant.activeFrom, r.tenant.moveInDate, or r.lease.startDate
  // (set via the room's "Edit > Lease Details" form, which is a separate flow from tenant
  // onboarding and doesn't touch the tenant-level fields at all).
  const moveInDate=(r.tenant&&(r.tenant.activeFrom||r.tenant.moveInDate))||(r.lease&&r.lease.startDate)||'';
  if(!moveInDate)return null;
  const moveInMonth=moveInDate.slice(0,7);
  // Hard cutoff: only applies to tenants who moved in from this feature's start month
  // onward. Existing/older tenants are never shown this note, even if their security was
  // never logged in the deposit ledger — for them, "nothing in the ledger" usually just
  // means they paid before this tracking existed, not that they genuinely owe it all.
  // SEC_ADV_DUE_CUTOFF is set once below and controls this for every tenant.
  if(moveInMonth<SEC_ADV_DUE_CUTOFF)return null;
  // Show this note from the move-in month onward (not just the exact move-in month) —
  // so an unpaid security/advance amount carries forward as a visible reminder in every
  // later month until it's actually collected, the same way rent carries forward.
  // Never show it for a month before the tenant existed.
  if(month<moveInMonth)return null;
  const target=r.tenant||{};
  // Security can end up stored in a few places depending on which flow added the tenant:
  // r.tenant.securityDeposit, r.tenant.security, or r.security (on the room itself — this
  // is what the room detail page actually displays). Use the first one that's actually a
  // positive number — not just "not null", since a stored 0 (e.g. written by an earlier
  // save before the real amount was known) would otherwise block falling through to the
  // real value in a later field.
  const secCandidates=[target.securityDeposit,target.security,r.security];
  const secTarget=Number(secCandidates.find(v=>Number(v)>0)||0);
  const advCandidates=[target.advanceRent,r.advanceRent];
  const advTarget=Number(advCandidates.find(v=>Number(v)>0)||0);
  const totalTarget=secTarget+advTarget;
  if(!totalTarget)return null;
  // Track security and advance collections separately — token counts toward security.
  const secCollected=depositLedgerTotal(r,'security')+depositLedgerTotal(r,'token');
  const advCollected=depositLedgerTotal(r,'advance');
  const collected=secCollected+advCollected;
  const secPending=Math.max(0,secTarget-secCollected);

// applying. Without this, increasing a tenant's rent would retroactively recalculate every
// past month using the NEW rate, making already-correctly-paid months suddenly show a
// shortfall. Falls back to r.rent (today's current rate) if no history exists yet, which
// keeps this fully backward compatible with rooms that predate this feature.

  // i.e. the rate that was actually in force during that month.

    .filter(h=>h.effectiveFrom&&h.effectiveFrom.slice(0,7)<=month)
    .sort((a,b)=>b.effectiveFrom.localeCompare(a.effectiveFrom));

  // today's current rate, since that's the closest approximation of what applied then.

function proratedRentForMonth(rent,startDate,month,endDate=''){
  const base=Number(rent||0);

  if(!startDate)return base;
  // If this month is entirely before the tenant's move-in month, they weren't a tenant
  // yet — nothing is owed. (Previously this case fell through to "full rent", which wrongly
  // charged every currently-active tenant a full month's rent for months before they
  // existed, e.g. scrolling billing back to March for someone who moved in in May/August.)
  if(month<startDate.slice(0,7))return 0;
  // Prorate when EITHER the start date falls in this month (move-in month) OR an endDate
  // falls in this month (exit/vacate month) — previously this only checked the start date,
  // so passing an endDate for a tenant who vacated mid-month (but moved in earlier) was
  // silently ignored and always returned full rent regardless of the endDate given.
  const endInThisMonth=endDate&&sameMonthDate(endDate,month);

// Vacating month: rent is worked out on a standard 30-day month (rent ÷ 30 × days stayed, never more

function proratedVacateRent(rent,startDate,month,endDate){

  const from=(startDate&&startDate.slice(0,7)===month&&startDate>ms)?startDate:ms;
  const to=(endDate&&endDate.slice(0,7)===month)?endDate:month+'-'+String(daysInMonth(month)).padStart(2,'0');
  const days=Math.floor((new Date(to+'T00:00:00')-new Date(from+'T00:00:00'))/86400000)+1;

          // keep the local properties instead).

            if(Array.isArray(parsed[key])){

// ── SAFE SAVE: 3-way merge ──
// base   = the copy this phone last got from / sent to the server
// local  = this phone's current data
// remote = what's on the server now (someone else may have saved since)
// Changes made on either side are kept; records are matched by id, so two people adding
// different entries never lose each other's. Deletions on either side are respected.
function _jeq(a,b){return JSON.stringify(a)===JSON.stringify(b);}
function _isObj(v){return v&&typeof v==='object'&&!Array.isArray(v);}
function _idArr(a){return Array.isArray(a)&&a.length>0&&a.every(x=>_isObj(x)&&x.id!=null);}
function mergeState3(b,l,r){
  if(_jeq(l,b))return r===undefined?l:r;   // only the server changed (or nothing did)
  if(_jeq(r,b))return l;                    // only this phone changed
  if(_jeq(l,r))return l;
  if(_isObj(l)&&_isObj(r)){
    const out={},keys=new Set([...Object.keys(l),...Object.keys(r),...Object.keys(_isObj(b)?b:{})]);
    keys.forEach(k=>{const v=mergeState3(_isObj(b)?b[k]:undefined,l[k],r[k]);if(v!==undefined)out[k]=v;});
    return out;
  }
  const la=Array.isArray(l)?l:[],ra=Array.isArray(r)?r:[],ba=Array.isArray(b)?b:[];
  if((Array.isArray(l)||l===undefined)&&(Array.isArray(r)||r===undefined)&&(_idArr(la)||_idArr(ra)||_idArr(ba))&&[la,ra,ba].every(a=>a.length===0||_idArr(a))){
    const B=new Map(ba.map(x=>[x.id,x])),L=new Map(la.map(x=>[x.id,x])),R=new Map(ra.map(x=>[x.id,x]));
    const order=[...ra.map(x=>x.id),...la.map(x=>x.id).filter(id=>!R.has(id))];
    const out=[];
    order.forEach(id=>{
      const bi=B.get(id),li=L.get(id),ri=R.get(id);
      if(li&&ri){out.push(mergeState3(bi,li,ri));return;}
      if(li&&!ri){ if(!bi||!_jeq(li,bi))out.push(li); return; }   // added here, or edited here after server deleted it
      if(!li&&ri){ if(!bi||!_jeq(ri,bi))out.push(ri); return; }   // added on server, or edited there after deleted here
    });
    return out;
  }
  return l===undefined?r:l;                 // both changed the same single value — this phone's edit wins
}
let _saving=false;
async function _pushState(){
  const pre=remoteUpdateTime?'&currentDocument.updateTime='+encodeURIComponent(remoteUpdateTime):'';
  return fetch(FB_URL+'&updateMask.fieldPaths=data'+pre,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{data:{stringValue:JSON.stringify(S)}}})});
}
async function _safePush(){
  for(let attempt=0;attempt<4;attempt++){
    const r=await _pushState();
    if(r.ok){
      try{const j=await r.json();remoteUpdateTime=j.updateTime||remoteUpdateTime;}catch(e){}
      lastKnownFirebaseData=JSON.parse(JSON.stringify(S));
      return true;
    }
    if(r.status!==400&&r.status!==409&&r.status!==412)return false;
    // Someone else saved since we last synced — fetch their version, merge, retry.
    const g=await fetch(FB_URL,{cache:'no-store'});
    if(!g.ok)return false;
    const d=await g.json();
    const remote=(d.fields&&d.fields.data)?JSON.parse(d.fields.data.stringValue):null;
    if(!remote){remoteUpdateTime=null;continue;}
    const base=lastKnownFirebaseData||remote;
    S=mergeState3(base,S,remote);
    remoteUpdateTime=d.updateTime||null;
    console.log('Merged with newer server copy before saving');
  }
  return false;
}

  }catch(e){setSaveIndicator('error');console.log('Save error:',e);setTimeout(()=>{if(!saveT)sched();},8000);}

// ── LOCAL SNAPSHOTS + FIND MISSING ENTRIES ──
// Each phone keeps its last saved copy (rentdesk_backup) plus copies from its previous sessions.
// "Find Missing Entries" compares any of those — or an uploaded backup file — with the live data
// and lists records that exist in the backup but not in the live data, so they can be restored.
const SNAP_KEYS=['rentdesk_snap_1','rentdesk_snap_2','rentdesk_snap_3'];
function rotateLocalSnapshots(){
  // Called once at start-up, BEFORE anything is saved this session — preserves the copy this phone had last time.
  try{
    const b=localStorage.getItem('rentdesk_backup'); if(!b)return;
    const t=localStorage.getItem('rentdesk_backup_time')||'';
    const last=localStorage.getItem(SNAP_KEYS[0]);
    if(last){ try{ if(JSON.parse(last).t===t)return; }catch(e){} }
    for(let i=SNAP_KEYS.length-1;i>0;i--){ const v=localStorage.getItem(SNAP_KEYS[i-1]); if(v){ try{localStorage.setItem(SNAP_KEYS[i],v);}catch(e){ localStorage.removeItem(SNAP_KEYS[i]); } } }
    try{ localStorage.setItem(SNAP_KEYS[0],JSON.stringify({t,data:b})); }
    catch(e){ localStorage.removeItem(SNAP_KEYS[SNAP_KEYS.length-1]); try{localStorage.setItem(SNAP_KEYS[0],JSON.stringify({t,data:b}));}catch(e2){} }
  }catch(e){}
}
function localSnapshotList(){
  const out=[];
  try{ const b=localStorage.getItem('rentdesk_backup'); if(b) out.push({key:'backup',label:'This phone — latest saved copy',t:Number(localStorage.getItem('rentdesk_backup_time')||0),get:()=>JSON.parse(b)}); }catch(e){}
  SNAP_KEYS.forEach((k,i)=>{ try{ const v=localStorage.getItem(k); if(!v)return; const o=JSON.parse(v); out.push({key:k,label:'This phone — earlier session '+(i+1),t:Number(o.t||0),get:()=>JSON.parse(o.data)}); }catch(e){} });
  return out;
}
function _sumItems(e){return (e.items||[]).reduce((s,i)=>s+Number(i.amount||0),0);}
function findMissingRecords(old){
  const cur=S, out=[];
  const byId=a=>new Set((a||[]).map(x=>x&&x.id).filter(Boolean));
  const add=(group,label,detail,apply)=>out.push({group,label,detail,apply});
  const pName=pid=>((cur.properties||[]).find(p=>p.id===pid)||(old.properties||[]).find(p=>p.id===pid)||{}).name||'';
  // simple id-keyed lists
  const ids=byId(cur.cash);
  (old.cash||[]).forEach(c=>{ if(c&&c.id&&!ids.has(c.id)) add('Cash',(c.type==='given'?'Cash given':'Cash spent')+' '+fm(c.amount),[fd(c.date),c.propertyLabel||pName(c.propertyId),c.note,c.by].filter(Boolean).join(' · '),()=>{S.cash.push(c);}); });
  const eids=byId(cur.expenses);
  (old.expenses||[]).forEach(e=>{ if(e&&e.id&&!eids.has(e.id)) add('Expenses','Expense '+fm(_sumItems(e)),[fd(e.date),pName(e.propertyId),(e.items||[]).map(i=>i.desc).join(', '),e.addedBy].filter(Boolean).join(' · '),()=>{S.expenses.push(e);}); });
  [['tasks','Tasks',t=>t.title||t.text||'Task'],['reminders','Reminders',r=>r.title||r.text||'Reminder'],['leases','Leases',l=>'Lease — '+(l.lesseeName||'')+' '+fd(l.leaseStart)+' → '+fd(l.leaseEnd)],
   ['pastTenants','Past tenants',t=>(t.name||'')+' · '+(t.propertyName||'')+' vacated '+fd(t.vacatingDate)],['attendance','Attendance',a=>(a.staffName||'')+' · '+fd(a.date)]].forEach(([k,g,lab])=>{
    const have=byId(cur[k]); (old[k]||[]).forEach(x=>{ if(x&&x.id&&!have.has(x.id)) add(g,lab(x),'',()=>{ if(!S[k])S[k]=[]; S[k].push(x); }); });
  });
  // properties → rooms → payments / readings / deductions, main meter
  (old.properties||[]).forEach(op=>{
    const cp=(cur.properties||[]).find(p=>p.id===op.id);
    if(!cp){ add('Properties','Property — '+op.name,(op.rooms||[]).length+' units',()=>{S.properties.push(op);}); return; }
    (op.mainMeter||[]).forEach(m=>{ if(!(cp.mainMeter||[]).some(x=>x.month===m.month)) add('Main meter',op.name+' — '+ml(m.month),'Reading '+m.reading+' · '+m.units+' units',()=>{ if(!cp.mainMeter)cp.mainMeter=[]; cp.mainMeter.push(m); }); });
    (op.rooms||[]).forEach(or=>{
      const cr=(cp.rooms||[]).find(r=>r.id===or.id);
      const unit=op.name+' · '+or.type+(or.unitNo?' #'+or.unitNo:'');
      if(!cr){ add('Units','Unit — '+unit,(or.tenant&&or.tenant.name?'Tenant '+or.tenant.name+' · ':'')+(or.payments||[]).length+' payments',()=>{ if(!cp.rooms)cp.rooms=[]; cp.rooms.push(or); }); return; }
      const sameTenant=!or.tenant||!cr.tenant||((or.tenant.name||'').trim().toLowerCase()===(cr.tenant.name||'').trim().toLowerCase());
      if(!sameTenant)return; // room has changed hands since the backup — old tenant's records belong to Past tenants
      const pids=byId(cr.payments);
      (or.payments||[]).forEach(py=>{ if(py&&py.id&&!pids.has(py.id)) add('Payments','Payment '+fm(py.amount)+' — '+unit,[(or.tenant&&or.tenant.name)||'',ml(py.month),py.mode,fd(py.date),py.notes].filter(Boolean).join(' · '),()=>{ if(!cr.payments)cr.payments=[]; cr.payments.push(py); cr.balanceByMonth={}; cr.balance=0; }); });
      (or.electricityReadings||[]).forEach(e=>{ if(!(cr.electricityReadings||[]).some(x=>x.month===e.month)) add('Electricity readings','Reading '+ml(e.month)+' — '+unit,e.oldReading+' → '+e.reading+' · '+fm(e.amount),()=>{ if(!cr.electricityReadings)cr.electricityReadings=[]; cr.electricityReadings.push(e); cr.balanceByMonth={}; cr.balance=0; }); });
      const dids=byId(cr.deductions);
      (or.deductions||[]).forEach(d=>{ if(d&&d.id&&!dids.has(d.id)) add('Deductions','Deduction '+fm(d.amount)+' — '+unit,[ml(d.month),d.desc].filter(Boolean).join(' · '),()=>{ if(!cr.deductions)cr.deductions=[]; cr.deductions.push(d); cr.balanceByMonth={}; cr.balance=0; }); });
    });
  });
  // activity log lines (no ids) — offered as one item
  const have=new Set((cur.activityLog||[]).map(l=>l.full||((l.ts||'')+(l.action||''))));
  const lost=(old.activityLog||[]).filter(l=>!have.has(l.full||((l.ts||'')+(l.action||''))));
  if(lost.length) add('Activity log',lost.length+' activity log line'+(lost.length>1?'s':''),lost.slice(0,3).map(l=>l.full||l.action).join(' | ')+(lost.length>3?' …':''),()=>{ S.activityLog=(S.activityLog||[]).concat(lost); });
  return out;
}
let _missSrc=null,_missList=[];
function openFindMissing(){
  const snaps=localSnapshotList();
  openM('🔍 Find Missing Entries',`
    <div style="font-size:12px;color:var(--ink2);line-height:1.6;margin-bottom:12px;">Compares a backup with the live data and lists entries that are <strong>in the backup but missing now</strong>. Nothing changes until you tick entries and tap Restore.<br/><span style="color:var(--muted);">Tip: run this on <strong>each phone</strong> that uses RentDesk — every phone keeps its own copy.</span></div>
    ${snaps.length?snaps.map((s,i)=>`<button class="btn btn-ghost" style="width:100%;justify-content:space-between;margin-bottom:6px;" onclick="runFindMissing('snap',${i})"><span>📱 ${s.label}</span><span style="font-size:11px;color:var(--muted);">${s.t?new Date(s.t).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):''}</span></button>`).join(''):'<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">No saved copy on this phone yet.</div>'}
    <div class="frow1" style="margin-top:8px;"><label class="flabel">Or pick a backup file (📥 Full Backup)</label><input type="file" accept=".json,application/json" class="finput" onchange="runFindMissingFile(this)"/></div>`,
    `<button class="btn btn-ghost" onclick="closeM()">Close</button>`);
}
function runFindMissing(kind,i){
  try{ const s=localSnapshotList()[i]; _missSrc={label:s.label,t:s.t,data:s.get()}; showMissing(); }
  catch(e){ toast('❌ Could not read that copy'); }
}
function runFindMissingFile(inp){
  const f=inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{ try{ const j=JSON.parse(e.target.result); const data=j.data||j; _missSrc={label:'File: '+f.name,t:j.exportedAt?Date.parse(j.exportedAt):0,data}; showMissing(); }catch(err){ toast('❌ Not a RentDesk backup file'); } };
  rd.readAsText(f);
}
function showMissing(){
  _missList=findMissingRecords(_missSrc.data||{});
  const groups={}; _missList.forEach((m,i)=>{(groups[m.group]=groups[m.group]||[]).push({...m,i});});
  const body=_missList.length?Object.entries(groups).map(([g,items])=>`
    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px;">${g} (${items.length})</div>
    ${items.map(m=>`<label style="display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fff;">
      <input type="checkbox" class="miss-cb" data-i="${m.i}" ${m.group==='Activity log'?'':'checked'} style="margin-top:3px;"/>
      <span style="min-width:0;"><strong style="font-size:13px;">${m.label}</strong>${m.detail?`<div style="font-size:11px;color:var(--muted);margin-top:2px;">${m.detail}</div>`:''}</span></label>`).join('')}`).join('')
    :`<div style="text-align:center;padding:24px 10px;"><div style="font-size:34px;">✅</div><div style="font-weight:700;margin-top:6px;">Nothing missing</div><div style="font-size:12px;color:var(--muted);margin-top:4px;">Everything in this copy is also in the live data.</div></div>`;
  openM('🔍 Missing Entries',`
    <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">Compared with: <strong>${_missSrc.label}</strong>${_missSrc.t?' · '+new Date(_missSrc.t).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):''}</div>
    ${_missList.length?`<div style="background:var(--amber-dim);border:1px solid var(--amber);border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:6px;">${_missList.length} entr${_missList.length>1?'ies are':'y is'} in this copy but not in the live data. Untick anything that was <strong>deleted on purpose</strong>, then restore.</div>`:''}
    ${body}`,
    `<button class="btn btn-ghost" onclick="openFindMissing()">← Back</button>${_missList.length?`<button class="btn btn-green" onclick="restoreMissing()">♻️ Restore selected</button>`:''}`);
}
function restoreMissing(){
  const sel=[...document.querySelectorAll('.miss-cb')].filter(c=>c.checked).map(c=>_missList[+c.dataset.i]).filter(Boolean);
  if(!sel.length){toast('Nothing selected');return;}
  if(!confirm('Restore '+sel.length+' entr'+(sel.length>1?'ies':'y')+' into the live data?'))return;
  let n=0; sel.forEach(m=>{ try{ m.apply(); n++; }catch(e){ console.error(e); } });
  actLog('Restored '+n+' missing entr'+(n>1?'ies':'y')+' from '+_missSrc.label);
  sched(); closeM(); renderTab(); toast('♻️ Restored '+n+' entr'+(n>1?'ies':'y'),4000);
}

// ── ACTIVITY LOG ──
function actLog(action){
  if(!S.activityLog)S.activityLog=[];
  const now=new Date();
  const dd=String(now.getDate()).padStart(2,'0');
  const mm=String(now.getMonth()+1).padStart(2,'0');
  const yyyy=now.getFullYear();
  const hh=String(now.getHours()).padStart(2,'0');
  const mn=String(now.getMinutes()).padStart(2,'0');
  const ts=`[${dd}/${mm}/${yyyy} ${hh}:${mn}]`;
  const uname=user||'Unknown';
  S.activityLog.unshift({ts,user:uname,action,full:`${ts} [${uname}] ${action}`});
  if(S.activityLog.length>100)S.activityLog=S.activityLog.slice(0,100);
}

// Firebase docs storage
async function saveDocToFS(roomId,docKey,base64Data,fileName,mimeType){
  const url=DOCS_BASE+'/'+roomId+'_'+docKey+'?key='+FB_KEY;
  try{const r=await fetch(url,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{data:{stringValue:base64Data},name:{stringValue:fileName},mimeType:{stringValue:mimeType},uploadedAt:{stringValue:new Date().toISOString()}}})});return r.ok;}catch(e){return false;}
}
async function loadDocFromFS(roomId,docKey){
  const url=DOCS_BASE+'/'+roomId+'_'+docKey+'?key='+FB_KEY;
  try{const r=await fetch(url);if(!r.ok)return null;const d=await r.json();if(!d.fields)return null;return{data:(d.fields.data&&d.fields.data.stringValue),name:(d.fields.name&&d.fields.name.stringValue),mimeType:(d.fields.mimeType&&d.fields.mimeType.stringValue),uploadedAt:(d.fields.uploadedAt&&d.fields.uploadedAt.stringValue)};}catch(e){return null;}
}

}

// ── ELECTRICITY RECONCILIATION (site-wise) ──
// Month label = the billing / collection month. A reading taken on 1 Oct is entered as "Oct":
// it covers September's usage and is billed + collected with October's rent.
// Main meter bill  = units × main meter rate (default ₹8.30, editable)
// Tenants billed   = sum of each room's electricity bill for that month
// Tenants collected= each tenant's electricity, counted as paid in proportion to how much of that
//                    month's bill they cleared (older arrears are cleared first).
function mainMeterRate(){ const v=Number(S.mainMeterRate); return v>0?v:8.3; }
function setMainMeterRate(){
  const v=prompt('Main meter unit rate (₹ per unit) — used for the calculated building bill:',mainMeterRate());
  if(v===null)return; const n=Number(v); if(!(n>0)){toast('❌ Enter a valid rate');return;}
  S.mainMeterRate=n; actLog('Main meter rate set to ₹'+n+'/unit'); sched(); renderTab(); toast('✅ Main meter rate ₹'+n+'/unit');
}
function usageMonthOf(mo){ return prevMonth(mo); }
function tenantElecCollected(r,mo){
  const elec=(r.electricityReadings||[]).find(x=>x.month===mo);
  const billed=Number((elec&&elec.amount)||0);
  if(!billed)return{billed:0,collected:0,units:0,paid:0};
  const carryIn=getCarryIn(r,mo);
  const ded=(r.deductions||[]).filter(d=>d.month===mo).reduce((s,d)=>s+Number(d.amount||0),0);
  const activeStart=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const rentAmt=activeStart?proratedRentForMonth(rentForMonth(r,mo),activeStart,mo):Number(r.rent||0);
  const sa=securityAdvanceDueForMonth(r,mo);
  const secPending=(sa&&activeStart&&sameMonthDate(activeStart,mo))?sa.secPending:0;
  const current=rentAmt+billed-ded+secPending;
  const paid=(r.payments||[]).filter(x=>x.month===mo).reduce((s,x)=>s+Number(x.amount||0),0);
  const avail=Math.max(0,paid-carryIn);
  const ratio=current>0?Math.min(1,avail/current):1;
  return{billed,collected:Math.round(billed*ratio),units:Number(elec.units||0),paid};
}
function elecRecon(p,mo){
  const mm=(p.mainMeter||[]).find(x=>x.month===mo)||null;
  const units=mm?Number(mm.units||0):0;
  const rate=mm&&Number(mm.rate)>0?Number(mm.rate):mainMeterRate();
  const calc=Math.round(units*rate);
  let actual=null;
  if(mm){ if(mm.actualBill!=null)actual=Number(mm.actualBill); else if(mm.bill!=null&&Math.round(Number(mm.bill))!==Math.round(units*Number(mm.rate||0)))actual=Number(mm.bill); }
  const rows=[];
  sortRooms(p.rooms||[]).forEach(r=>{
    const unit=r.type+(r.unitNo?' #'+r.unitNo:'');
    const t=tenantElecCollected(r,mo);
    const occ=isRoomOccupied(r);
    if(t.billed) rows.push({unit,tenant:(r.tenant&&r.tenant.name)||'—',units:t.units,billed:t.billed,collected:t.collected,status:t.collected>=t.billed?'paid':t.collected>0?'part':'unpaid',pid:p.id,rid:r.id});
    else if(occ){ const ms=(r.tenant&&(r.tenant.activeFrom||r.tenant.moveInDate))||''; if(!ms||ms.slice(0,7)<mo) rows.push({unit,tenant:(r.tenant&&r.tenant.name)||'—',units:0,billed:0,collected:0,status:'noreading',pid:p.id,rid:r.id}); }
  });
  (S.pastTenants||[]).filter(t=>t.propertyId===p.id).forEach(t=>{
    const e=(t.electricityHistory||[]).find(x=>x.month===mo); if(!e||!Number(e.amount))return;
    rows.push({unit:(t.roomType||'')+(t.unitNo?' #'+t.unitNo:''),tenant:(t.name||'—')+' (vacated)',units:Number(e.units||0),billed:Number(e.amount),collected:Number(e.amount),status:'settled'});
  });
  const tUnits=rows.reduce((s,x)=>s+x.units,0), billed=rows.reduce((s,x)=>s+x.billed,0), collected=rows.reduce((s,x)=>s+x.collected,0);
  return{p,mo,mm,units,rate,calc,actual,rows,tUnits,billed,collected,lossUnits:units-tUnits,billGap:calc-billed,collGap:billed-collected,net:collected-calc,noReading:rows.filter(x=>x.status==='noreading').length};
}
function elecSites(){ return (S.properties||[]).filter(p=>!p.noMainMeter); }

// ── Electricity reconciliation for the MONTHLY REPORT (screen, print and PDF) ──
function elecReportData(month,filterPropId){
  const sites=(S.properties||[]).filter(p=>filterPropId?p.id===filterPropId:!p.noMainMeter);
  const rows=sites.map(p=>{
    const x=elecRecon(p,month);
    let flag,tone;
    if(p.noMainMeter){flag='No main meter';tone='muted';}
    else if(!x.mm){flag='MAIN METER READING MISSING';tone='red';}
    else if(x.noReading){flag=x.noReading+' room'+(x.noReading>1?'s':'')+' not billed';tone='red';}
    else if(x.net>=0){flag='Covered';tone='green';}
    else if(x.collGap>0&&x.billGap<=0){flag='Short — tenants yet to pay';tone='amber';}
    else {flag='Short — under-billed';tone='red';}
    return{...x,flag,tone};
  });
  const withMM=rows.filter(x=>x.mm);
  const tot={units:withMM.reduce((s,x)=>s+x.units,0),calc:withMM.reduce((s,x)=>s+x.calc,0),billed:rows.reduce((s,x)=>s+x.billed,0),collected:rows.reduce((s,x)=>s+x.collected,0)};
  tot.net=tot.collected-tot.calc;
  const issues=rows.filter(x=>x.tone==='red'||x.tone==='amber').length;
  return{rows,tot,issues,usage:usageMonthOf(month)};
}

// ── MAIN METER MONTHLY REMINDER ──
// Every property needs one main meter reading per month. Done = reading saved for this month.
// Staff can also tap "Mark Taken" (e.g. photo clicked, reading to be typed later) — it stays amber until the reading is entered.
const METER_DUE_DAY=5; // after this date a missing reading turns red
function meterStatus(p,month){
  if(p.noMainMeter)return'na';
  if((p.mainMeter||[]).some(x=>x.month===month))return'done';
  if(p.meterTaken&&p.meterTaken.month===month)return'taken';
  return'pending';
}
function dashMeterReminderH(){
  const cm=mk(),props=(S.properties||[]).filter(p=>!p.noMainMeter);
  if(!props.length)return'';
  const st=props.map(p=>({p,s:meterStatus(p,cm)}));
  const open=st.filter(x=>x.s!=='done');
  if(!open.length)return`<div style="background:var(--green-dim);border:1.5px solid var(--green);border-radius:var(--r);padding:10px 16px;margin-bottom:16px;font-size:13px;font-weight:600;color:var(--green);">⚡ All main meter readings done for ${ml(cm)} ✅</div>`;
  const late=new Date().getDate()>METER_DUE_DAY&&open.some(x=>x.s==='pending');
  const rows=st.map(({p,s})=>{
    const readings=(p.mainMeter||[]).slice().sort((a,b)=>a.month.localeCompare(b.month));
    const last=readings[readings.length-1];
    const lastTxt=last?'Last: '+last.reading+' units ('+ml(last.month)+')':'No reading yet';
    let badge,btns;
    if(s==='done'){const c=readings.find(x=>x.month===cm);badge=`<span class="badge badge-grn">✅ Done · ${c.reading}</span>`;btns='';}
    else if(s==='taken'){badge=`<span class="badge badge-amb">📸 Taken ${fd(p.meterTaken.on)} by ${p.meterTaken.by} — enter reading</span>`;btns=`<button class="btn btn-orange btn-sm" onclick="openMainMeter('${p.id}')">⚡ Enter Reading</button>`;}
    else{badge=`<span class="badge ${late?'badge-red':'badge-amb'}">${late?'⚠️ Overdue':'⏳ Pending'}</span>`;
      btns=`<button class="btn btn-orange btn-sm" onclick="openMainMeter('${p.id}')">⚡ Enter Reading</button><button class="btn btn-ghost btn-sm" onclick="markMeterTaken('${p.id}')">✓ Mark Taken</button>`;}
    return`<div class="urgent-row" style="border-bottom-color:${late?'rgba(239,68,68,.18)':'rgba(245,158,11,.2)'};${s==='done'?'opacity:.6;':''}">
      <div style="min-width:0;"><div style="font-weight:700;font-size:14px;color:var(--ink);">${p.name}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px;">${lastTxt}</div><div style="margin-top:4px;">${badge}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">${btns}</div></div>`;
  }).join('');
  const pend=open.length;
  return`<div class="${late?'urgent-card':'soon-card'}">
    <div class="${late?'urgent-head':'soon-head'}" style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><span>⚡ Main Meter Readings — ${ml(cm)}</span><span style="font-size:12px;">${pend} of ${props.length} pending</span></div>
    ${rows}
    <div style="padding:8px 16px;font-size:11px;color:var(--muted);">Done when the reading is saved. "Mark Taken" if you've noted it and will enter it later.${late?'':' Turns red after the '+METER_DUE_DAY+'th.'}</div>
  </div>`;
}
function markMeterTaken(pid){
  const p=S.properties.find(x=>x.id===pid);if(!p)return;
  p.meterTaken={month:mk(),on:today(),by:user};
  actLog('Main meter reading taken — '+p.name+' ('+ml(mk())+')');
  sched();renderTab();toast('📸 Marked taken — enter the reading when you can');
}
function toggleNoMainMeter(pid){
  const p=S.properties.find(x=>x.id===pid);if(!p)return;
  if(!p.noMainMeter&&!confirm('This site has no main meter? It will stop showing in the monthly reminder.'))return;
  p.noMainMeter=!p.noMainMeter;sched();renderPropDetail();
  toast(p.noMainMeter?'Main meter reminder off for '+p.name:'Main meter reminder on for '+p.name);
}

// ── MAIN METER ──
function openMainMeter(pid){
  const p=S.properties.find(x=>x.id===pid);
  const readings=(p.mainMeter||[]).slice().sort((a,b)=>a.month.localeCompare(b.month));
  const cm=mk(),cur=readings.find(x=>x.month===cm),prev=prevReadingForMonth(readings,cm);
  const prevVal=cur&&cur.oldReading!=null?cur.oldReading:(prev&&prev.reading!=null?prev.reading:'');
  openM('⚡ Main Meter — '+p.name,`
  <div class="frow"><div><label class="flabel">Month</label><input class="finput" id="mmM" type="month" value="${cm}" oninput="mmMonthChanged('${pid}')"/></div><div><label class="flabel">Rate per Unit (₹)</label><input class="finput" id="mmR" type="number" step="0.01" value="${(cur&&cur.rate)||mainMeterRate()}" placeholder="8.30" oninput="mmCalc()"/></div></div>
  <div class="frow">
    <div><label class="flabel">Previous Reading</label><input class="finput" id="mmO" type="number" value="${prevVal}" oninput="mmCalc()"/><div class="fhint" id="mmHint">${prev?'📌 From '+ml(prev.month)+': '+prev.reading+' units':'No previous reading'}</div></div>
    <div><label class="flabel">Current Reading *</label><input class="finput" id="mmN" type="number" value="${(cur&&cur.reading)||''}" placeholder="Enter new reading" oninput="mmCalc()"/></div>
  </div>
  <div class="ecalc" id="mmBox"><div class="ecalc-title">📊 Main Meter Calculation</div><div class="ecalc-row"><span>Previous</span><span id="mm1">—</span></div><div class="ecalc-row"><span>Current</span><span id="mm2">—</span></div><div class="ecalc-row"><span>Units</span><span id="mm3" style="color:var(--blue)">—</span></div><div class="ecalc-row"><span>Rate</span><span id="mm4">—</span></div><div class="ecalc-total"><span>Building Bill</span><span id="mm5">—</span></div></div>
  <div class="frow1" style="margin-top:10px;"><label class="flabel">Actual Bill Paid (₹) <span style="color:var(--muted);font-weight:400;text-transform:none;">optional — from the DHBVN bill</span></label><input class="finput" id="mmA" type="number" value="${cur?(cur.actualBill!=null?cur.actualBill:(cur.bill!=null&&Math.round(cur.bill)!==Math.round((cur.units||0)*(cur.rate||0))?cur.bill:'')):''}" placeholder="Leave blank if not known yet"/><div class="fhint">Month = billing month. A reading taken on 1 Oct is entered as Oct (covers Sep usage).</div></div>`,
  `<button class="btn btn-ghost" onclick="closeM()">Cancel</button><button class="btn btn-orange" onclick="saveMainMeter('${pid}')">Save</button>`);
  setTimeout(mmCalc,80);
}
function mmMonthChanged(pid){
  const p=S.properties.find(x=>x.id===pid);if(!p)return;
  const mo=document.getElementById('mmM').value;
  const readings=(p.mainMeter||[]).slice().sort((a,b)=>a.month.localeCompare(b.month));
  const cur=readings.find(x=>x.month===mo),prev=prevReadingForMonth(readings,mo);
  document.getElementById('mmO').value=cur&&cur.oldReading!=null?cur.oldReading:(prev&&prev.reading!=null?prev.reading:'');
  document.getElementById('mmN').value=(cur&&cur.reading)||'';
  document.getElementById('mmR').value=(cur&&cur.rate)||mainMeterRate();
  document.getElementById('mmA').value=cur?(cur.actualBill!=null?cur.actualBill:''):'';
  const hint=document.getElementById('mmHint');
  if(hint)hint.textContent=prev?'📌 From '+ml(prev.month)+': '+prev.reading+' units':'No previous reading';
  mmCalc();
}
function mmCalc(){const o=Number((document.getElementById('mmO')||{}).value||0),n=Number((document.getElementById('mmN')||{}).value||0),r=Number((document.getElementById('mmR')||{}).value||0),box=document.getElementById('mmBox');if(!box)return;if(n>0&&r>0){const u=n-o,t=u*r;box.classList.add('show');document.getElementById('mm1').textContent=o+' units';document.getElementById('mm2').textContent=n+' units';document.getElementById('mm3').textContent=u+' units';document.getElementById('mm4').textContent='₹'+r+'/unit';document.getElementById('mm5').textContent=fm(t);}else box.classList.remove('show');}
function saveMainMeter(pid){
  const n=document.getElementById('mmN').value;if(!n){toast('❌ Enter reading');return;}
  const p=S.properties.find(x=>x.id===pid);if(!p.mainMeter)p.mainMeter=[];
  const mo=document.getElementById('mmM').value,o=Number(document.getElementById('mmO').value||0),nR=Number(n),r=Number(document.getElementById('mmR').value||0),u=nR-o,man=document.getElementById('mmA').value;
  p.mainMeter=p.mainMeter.filter(x=>x.month!==mo);p.mainMeter.push({month:mo,oldReading:o,reading:nR,units:u,rate:r,calcBill:Math.round(u*r),actualBill:man?Number(man):null,bill:man?Number(man):Math.round(u*r*100)/100});
  // main meter rate is kept separate from the tenants' per-unit rate (p.electricityRate)
  if(p.meterTaken&&p.meterTaken.month===mo)delete p.meterTaken;
  actLog('Main meter reading saved — '+p.name+' '+ml(mo)+': '+nR);
  sched();closeM();if(vProp===pid)renderPropDetail();else renderTab();toast('✅ Main meter saved');
}

function collectRoom(ex={}){
  const tName=(document.getElementById('tN').value||'').trim();
  const existingTenant=ex.tenant||null;
  const advRentVal=document.getElementById('rAdv').value;
  return{...ex,
    type:document.getElementById('rT').value,unitNo:document.getElementById('rU').value.trim(),
    rent:document.getElementById('rR').value,security:document.getElementById('rS').value,
    notes:document.getElementById('rNt').value.trim(),
    tenant:tName?{...(existingTenant||{}),...(document.getElementById('tFa')?{fatherName:document.getElementById('tFa').value.trim(),relation:(document.getElementById('tRel')||{}).value||'S/O'}:{}),name:tName,phone:document.getElementById('tP').value.trim(),address:document.getElementById('tA').value.trim(),aadhaar:document.getElementById('tAd').value.trim(),pan:document.getElementById('tPn').value.trim(),office:document.getElementById('tO').value.trim(),advanceRent:Number(advRentVal||0)}:((existingTenant&&existingTenant.name)?existingTenant:null),
    coTenants:_collectCoTenants(),
    token:ex.token||null,
    lease:{startDate:document.getElementById('lS').value,endDate:document.getElementById('lE').value,tenure:document.getElementById('lTen').value,lockIn:document.getElementById('lLock').value,escalation:document.getElementById('lEc').value,noticePeriod:document.getElementById('lN').value,noticeServed:document.getElementById('lNS').value}

function editRoom(pid,rid){const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);openM('Edit Room',roomFormH(r),`<button class="btn btn-ghost" onclick="closeM()">Cancel</button>${isAdmin?`<button class="btn btn-red btn-sm" onclick="delRoom('${pid}','${rid}')">🗑</button>`:''}<button class="btn btn-orange" onclick="updRoom('${pid}','${rid}')">Update</button>`);}
function updRoom(pid,rid){
  const p=S.properties.find(x=>x.id===pid),idx=((p&&p.rooms)||[]).findIndex(x=>x.id===rid);
  if(idx===-1)return;
  const oldRent=Number(p.rooms[idx].rent||0);
  const newRentVal=document.getElementById('rR').value;
  const newRent=Number(newRentVal||0);
  if(newRent&&oldRent&&newRent!==oldRent){
    // Rent is actually changing — ask which month the new rate starts applying from,
    // rather than silently assuming. Without this, a rent increase would retroactively
    // recalculate every past month at the new rate, making already-correctly-paid months
    // suddenly show a shortfall.
    openM('📅 Rent Change — From Which Month?',`
      <div style="background:var(--orange-dim);border:1px solid var(--orange);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;">
        Rent is changing from ${fm(oldRent)} to ${fm(newRent)}. Past months will keep using the old rate — only choose the month this new rate actually starts from.
      </div>
      <div class="frow1"><label class="flabel">New Rate Effective From *</label>
        <input class="finput" type="month" id="rc_effFrom" value="${mk()}"/></div>`,
      `<button class="btn btn-ghost" onclick="closeM();${_reopenEditRoomCall(pid,rid)}">Back</button>
       <button class="btn btn-orange" onclick="confirmRentChange('${pid}','${rid}',${newRent})">Confirm</button>`);
    return;
  }
  p.rooms[idx]=collectRoom(p.rooms[idx]);
  // Clear the cached balance history — editing security or move-in date can change
  // what any given month's due amount should be, and a stale cached figure from before the
  // edit would otherwise keep showing indefinitely (getCarryIn trusts the cache first and
  // never re-checks whether the underlying tenant details it was computed from have since
  // changed). Safe to clear: it just means the next view recalculates fresh from actual
  // payment/deduction/reading history, which is always correct.
  p.rooms[idx].balanceByMonth={};
  p.rooms[idx].balance=0;
  sched();closeM();renderRoomDetail();toast('✅ Updated');
}
function _reopenEditRoomCall(pid,rid){return "editRoom('"+pid+"','"+rid+"')";}
function confirmRentChange(pid,rid,newRent){
  const p=S.properties.find(x=>x.id===pid),idx=((p&&p.rooms)||[]).findIndex(x=>x.id===rid);
  if(idx===-1)return;
  const effFrom=document.getElementById('rc_effFrom').value;
  if(!effFrom){toast('❌ Choose the effective month');return;}
  const r=p.rooms[idx];
  if(!r.rentHistory)r.rentHistory=[];
  // Record the OLD rate as having applied up to now, if this is the first change being
  // tracked (so months before this point still resolve to the old rate via rentForMonth's
  // fallback), then add the new rate starting from the chosen month.
  if(!r.rentHistory.length)r.rentHistory.push({rent:Number(r.rent||0),effectiveFrom:TRACKING_START_MONTH});
  const newEntry={rent:newRent,effectiveFrom:effFrom+'-01'};
  // If a history entry already exists for this exact effective month (e.g. correcting an
  // earlier mistaken change), replace it rather than appending a duplicate — two entries
  // for the same month would leave their resolution order ambiguous.
  const dupIdx=r.rentHistory.findIndex(h=>h.effectiveFrom&&h.effectiveFrom.slice(0,7)===effFrom);
  if(dupIdx>=0)r.rentHistory[dupIdx]=newEntry;
  else r.rentHistory.push(newEntry);
  // Only update rent and its history here — do NOT call collectRoom(), since this dialog
  // has replaced the Edit Room form entirely and none of collectRoom's expected fields
  // (rAdv, tN, rT, etc.) exist in the DOM at this point, which was crashing this function.
  r.rent=newRent;
  r.rentHistory=r.rentHistory;
  r.balanceByMonth={};
  r.balance=0;
  sched();closeM();renderRoomDetail();
  actLog('Rent changed — '+(r.tenant&&r.tenant.name?r.tenant.name:'room')+' to '+fm(newRent)+' from '+ml(effFrom));
  toast('✅ Rent updated to '+fm(newRent)+', effective '+ml(effFrom));
}

function eMonthChanged(pid,rid){
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!p||!r)return;
  const mo=document.getElementById('eM').value;
  const readings=(r.electricityReadings||[]).slice().sort((a,b)=>a.month.localeCompare(b.month));
  const cur=readings.find(x=>x.month===mo),prev=prevReadingForMonth(readings,mo);
  document.getElementById('eO').value=cur&&cur.oldReading!=null?cur.oldReading:(prev&&prev.reading!=null?prev.reading:'');
  document.getElementById('eN').value=(cur&&cur.reading)||'';
  document.getElementById('eRt').value=(cur&&cur.rate)||p.electricityRate||'';
  document.getElementById('eA').value=(cur&&cur.manualAmt)||'';
  const hint=document.getElementById('eHint');
  if(hint)hint.textContent=prev?'📌 Auto: '+ml(prev.month)+' → '+prev.reading+' units':'First reading';
  eCalc();
}
function eCalc(){const o=Number((document.getElementById('eO')||{}).value||0),n=Number((document.getElementById('eN')||{}).value||0),r=Number((document.getElementById('eRt')||{}).value||0),box=document.getElementById('eBox');if(!box)return;if(n>0&&r>0){const u=n-o,t=u*r;box.classList.add('show');document.getElementById('e1').textContent=o+' units';document.getElementById('e2').textContent=n+' units';document.getElementById('e3').textContent=u+' units';document.getElementById('e4').textContent='₹'+r+'/unit';document.getElementById('e5').textContent=fm(t);}else box.classList.remove('show');}
function openElecBillFromForm(pid,rid){openElecBill(pid,rid,document.getElementById('eM').value);}
function saveElec(pid,rid){
  const n=document.getElementById('eN').value,rt=document.getElementById('eRt').value;
  if(!n){toast('❌ Enter current reading');return;}if(!rt){toast('❌ Enter rate');return;}
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r.electricityReadings)r.electricityReadings=[];p.electricityRate=rt;
  const mo=document.getElementById('eM').value,o=Number(document.getElementById('eO').value||0),nR=Number(n),rtN=Number(rt),u=nR-o,man=document.getElementById('eA').value;
  r.electricityReadings=r.electricityReadings.filter(x=>x.month!==mo);
  r.electricityReadings.push({month:mo,oldReading:o,reading:nR,units:u,rate:rtN,amount:man?Number(man):u*rtN,manualAmt:man?Number(man):null});
  sched();closeM();if(vRoom)renderRoomDetail();else renderBilling();toast('✅ Reading saved');
}

// ── PRINT / PDF ──
function pdfName(title){return title.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')+'.pdf';}
function downloadPdfBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function sharePdfHtml(fullHtml,title,orientation){
  if(!window.html2pdf)return false;
  const name=pdfName(title);
  const frame=document.createElement('iframe');
  frame.style.cssText='position:fixed;left:-10000px;top:0;width:1200px;height:1800px;border:0;opacity:0;pointer-events:none;';
  document.body.appendChild(frame);
  try{
    const doc=frame.contentDocument||frame.contentWindow.document;
    doc.open();doc.write(fullHtml);doc.close();
    await new Promise(resolve=>setTimeout(resolve,700));
    toast('📄 Preparing PDF...',3000);
    const opt={
      margin:orientation==='landscape'?5:10,
      filename:name,
      image:{type:'jpeg',quality:0.98},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},
      jsPDF:{unit:'mm',format:'a4',orientation:orientation||'portrait'}
    };
    const blob=await html2pdf().set(opt).from(doc.body).outputPdf('blob');
    if(window.File&&navigator.canShare&&navigator.share){
      const file=new File([blob],name,{type:'application/pdf'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:title,text:title});
        toast('✅ PDF ready to share',2500);
        return true;
      }
    }
    downloadPdfBlob(blob,name);
    toast('📄 PDF downloaded — share it from Downloads',5000);
    return true;
  }catch(e){
    return false;
  }finally{
    if(frame.parentNode)frame.parentNode.removeChild(frame);
  }
}
// Reliable landscape PDF for monthly reports — dynamic iframe height avoids clipping multi-property reports
async function shareReportPdfBlob(fullHtml,title){
  if(!window.html2pdf){toast('❌ PDF library not loaded — try refresh',4000);return false;}
  const name=pdfName(title);
  const frame=document.createElement('iframe');
  frame.style.cssText='position:fixed;left:-10000px;top:0;width:1123px;height:10px;border:0;opacity:0;pointer-events:none;';
  document.body.appendChild(frame);
  try{
    const doc=frame.contentDocument||frame.contentWindow.document;
    doc.open();doc.write(fullHtml);doc.close();
    await new Promise(r=>setTimeout(r,800));
    // Resize iframe to fit ALL content — fixes landscape multi-property clipping
    const fullH=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight,doc.body.offsetHeight)+80;
    frame.style.height=fullH+'px';
    await new Promise(r=>setTimeout(r,200));
    toast('📄 Preparing PDF...',3000);
    const opt={
      margin:8,
      filename:name,
      image:{type:'jpeg',quality:0.95},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:1123,height:fullH},
      jsPDF:{unit:'mm',format:'a4',orientation:'landscape'},
      pagebreak:{mode:['avoid-all','css','legacy']}
    };
    const blob=await html2pdf().set(opt).from(doc.body).outputPdf('blob');
    if(window.File&&navigator.canShare&&navigator.share){
      const file=new File([blob],name,{type:'application/pdf'});
      if(navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file],title:title,text:title});
          toast('✅ Pick WhatsApp from share menu',3000);
          return true;
        }catch(err){
          if(err.name==='AbortError')return true; // user cancelled — that's fine
          // any other error → fall through to download
        }
      }
    }
    downloadPdfBlob(blob,name);
    toast('📄 PDF saved — open WhatsApp & attach from Downloads',5000);
    return true;
  }catch(e){
    console.error('Report PDF failed:',e);
    toast('❌ PDF generation failed — falling back to print',3000);
    return false;
  }finally{
    if(frame.parentNode)frame.parentNode.removeChild(frame);
  }
}
// ── pdfmake (lazy-loaded) — produces TRUE vector PDFs that match print preview quality ──
function loadPdfMake(){
  return new Promise((resolve,reject)=>{
    if(window.pdfMake&&window.pdfMake.vfs){resolve();return;}
    toast('📦 Loading PDF library (first time only)...',3000);
    const s1=document.createElement('script');
    s1.src='https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js';
    s1.onload=()=>{
      const s2=document.createElement('script');
      s2.src='https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.min.js';
      s2.onload=()=>resolve();
      s2.onerror=()=>reject(new Error('vfs_fonts load failed'));
      document.head.appendChild(s2);
    };
    s1.onerror=()=>reject(new Error('pdfmake load failed'));
    document.head.appendChild(s1);
  });
}

// Generate true vector PDF via pdfmake and share to WhatsApp / share sheet
async function shareMonthlyReportPdfMake(month,filterPropId){
  try{await loadPdfMake();}
  catch(e){console.error('pdfmake load failed:',e);return false;}
  if(!window.pdfMake)return false;
  const fileName=pdfName('KDC-Report-'+month);
  const fileTitle='KDC Monthly Report \u2014 '+ml(month);
  toast('📄 Building PDF...',2500);
  return new Promise(resolve=>{
    try{
      const docDef=buildMonthlyReportDocDef(month,filterPropId);
      pdfMake.createPdf(docDef).getBlob(async blob=>{
        try{
          if(window.File&&navigator.canShare&&navigator.share){
            const file=new File([blob],fileName,{type:'application/pdf'});
            if(navigator.canShare({files:[file]})){
              try{
                await navigator.share({files:[file],title:fileTitle,text:fileTitle});
                toast('✅ Pick WhatsApp from share menu',3000);
                resolve(true);return;
              }catch(err){
                if(err.name==='AbortError'){resolve(true);return;}
              }
            }
          }
          downloadPdfBlob(blob,fileName);
          toast('📄 PDF saved — open WhatsApp & attach from Downloads',5000);
          resolve(true);
        }catch(e){
          console.error('share step failed:',e);
          try{downloadPdfBlob(blob,fileName);resolve(true);}
          catch(e2){resolve(false);}
        }
      });
    }catch(e){
      console.error('pdfmake build failed:',e);
      toast('❌ PDF build failed — falling back',3000);
      resolve(false);
    }
  });
}

// Cleans a stored phone number into exactly 10 digits before it goes into a wa.me link.
// Strips spaces/dashes/+, strips a leading 91 (country code) if already present so it's
// never doubled up (e.g. saved as "917011195586" -> would become "91917011195586" otherwise),
// strips a leading 0, and returns null if what's left isn't a plausible 10-digit mobile number.
function cleanPhoneForWA(raw){
  let d=String(raw||'').replace(/[^0-9]/g,''); // digits only
  if(d.length===12&&d.startsWith('91'))d=d.slice(2);
  else if(d.length===11&&d.startsWith('0'))d=d.slice(1);
  if(d.length!==10)return null;
  return d;
}

let _pyPid=null,_pyRid=null;
// ── PER-MONTH BALANCE HELPERS ──
function prevMonth(mo){
  const[y,m]=mo.split('-').map(Number);
  const d=new Date(y,m-2);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function calcClosingBalance(r,mo){
  // Compute what's left unpaid after a given month, purely from payment history
  // This is deterministic — no stored state needed
  const elec=(r.electricityReadings||[]).find(x=>x.month===mo);
  const carryIn=getCarryIn(r,mo);
  const dedTotal=(r.deductions||[]).filter(d=>d.month===mo).reduce((s,d)=>s+Number(d.amount||0),0);
  const activeStart=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const rentAmt=activeStart?proratedRentForMonth(rentForMonth(r,mo),activeStart,mo):Number(r.rent||0);
  const secAdvDue=securityAdvanceDueForMonth(r,mo);
  const isMoveInMonth=activeStart&&sameMonthDate(activeStart,mo);
  const secPending=(secAdvDue&&isMoveInMonth)?secAdvDue.secPending:0;
  const due=rentAmt+Number((elec&&elec.amount)||0)+carryIn-dedTotal+secPending;
  const paid=(r.payments||[]).filter(x=>x.month===mo).reduce((s,x)=>s+Number(x.amount||0),0);
  return Math.max(0,due-paid);
}
const TRACKING_START_MONTH='2026-05';
function getCarryIn(r,mo,_depth){
  _depth=_depth||0;
  if(!r.balanceByMonth)r.balanceByMonth={};
  // Hard floor: May 2026 is the true start of data entry for every tenant, regardless of
  // what any individual tenant's stored move-in/lease-start date says. Some tenants ended
  // up with an earlier date on record (e.g. a blank date field defaulting to an earlier
  // "today" during initial setup), which the recursive calculation below would otherwise
  // trust and walk back from — inflating balances with months that predate real tracking.
  // Declaring May as a hard boundary sidesteps having to audit every tenant's exact stored
  // date individually.
  if(mo<=TRACKING_START_MONTH)return 0;
  const pm=prevMonth(mo);
  // First check stored history for previous month
  if(r.balanceByMonth[pm]!==undefined)return r.balanceByMonth[pm];
  // Safety guard against runaway recursion on malformed data (e.g. a corrupted date that
  // never resolves to "tenant didn't exist yet") — 240 months is 20 years, far beyond any
  // realistic tenancy.
  if(_depth>240)return 0;
  // Determine whether the tenant actually existed in the previous month at all — using
  // their move-in date (checked across all the places it can live), not just "did they
  // make a payment that month". A tenant who made ZERO payments in a month they were
  // present for (e.g. moved in but never paid) still owes that month's rent — that must
  // not be silently treated as "nothing owed" just because there's no payment record.
  const pmActiveStart=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const tenantExistedInPm=pmActiveStart&&pmActiveStart.slice(0,7)<=pm;
  const pmPayments=(r.payments||[]).filter(x=>x.month===pm);
  const pmElec=(r.electricityReadings||[]).find(x=>x.month===pm);
  const pmDed=(r.deductions||[]).filter(d=>d.month===pm).reduce((s,d)=>s+Number(d.amount||0),0);
  if(tenantExistedInPm||pmPayments.length>0){
    // Compute the previous month's closing balance — due minus whatever was actually paid
    // (zero payments is a valid, common case: it just means the full amount carries over).
    // Recurse to get pm's own carry-in (its balance from the month before it) — this must
    // be a genuine recursive call, not a direct cache read, otherwise a "cold" view (e.g.
    // opening August billing without ever having visited July) would only look one month
    // back correctly and silently drop anything further behind since the cache was never
    // populated by a prior write.
    const pmCarryIn=getCarryIn(r,pm,_depth+1);
    // Match what the billing row actually shows as "Total Due" for that month: prorated
    // rent (not flat rent) plus any pending security amount — otherwise a security amount
    // shown and included in one month's Total Due would silently vanish from the carry-in
    // chain instead of following through to the next month, the same way an unpaid rent
    // shortfall does.
    const pmRentAmt=proratedRentForMonth(rentForMonth(r,pm),pmActiveStart,pm);
    const pmSecAdvDue=securityAdvanceDueForMonth(r,pm);
    const pmIsMoveInMonth=pmActiveStart&&sameMonthDate(pmActiveStart,pm);
    const pmSecPending=(pmSecAdvDue&&pmIsMoveInMonth)?pmSecAdvDue.secPending:0;
    const pmDue=pmRentAmt+Number((pmElec&&pmElec.amount)||0)+pmCarryIn-pmDed+pmSecPending;
    const pmPaid=pmPayments.reduce((s,x)=>s+Number(x.amount||0),0);
    return Math.max(0,pmDue-pmPaid);
  }
  // No payments for prev month and nothing cached — nothing owed from before tracking began.
  return 0;
}
function setBalanceAfterMonth(r,mo,val){
  if(!r.balanceByMonth)r.balanceByMonth={};
  r.balanceByMonth[mo]=Math.max(0,val);
  r.balance=Math.max(0,val);
}
function _calcDue(r,mo){
  const elec=(r.electricityReadings||[]).find(x=>x.month===mo);
  const bal=getCarryIn(r,mo);
  const dedTotal=(r.deductions||[]).filter(d=>d.month===mo).reduce((s,d)=>s+Number(d.amount||0),0);
  return{elec,bal,dedTotal,due:Number(r.rent||0)+Number((elec&&elec.amount)||0)+bal-dedTotal};
}
