    if(!data){ body.insertAdjacentHTML('beforeend',`<div class="dv-msg">❌ Could not load ${_escHtml(f.name||'file')} — check internet.</div>`); continue; }
    _dv.files.push({name:f.label?(f.label.replace(/[\\/:*?"<>|]/g,'-')+((f.mime||'').includes('pdf')?'.pdf':'.jpg')):(f.name||'document'),mime:f.mime||(data.startsWith('data:application/pdf')?'application/pdf':'image/jpeg'),data});
    if((f.mime||'').includes('pdf')||data.startsWith('data:application/pdf')){
      try{
        await _ensurePdfJs();
        const pdf=await window.pdfjsLib.getDocument({data:_dataUrlToU8(data)}).promise;
        for(let i=1;i<=pdf.numPages;i++){
          const page=await pdf.getPage(i); const v1=page.getViewport({scale:1}); const vp=page.getViewport({scale:Math.min(2.2,1600/v1.width)});
          const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
          const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
          await page.render({canvasContext:x,viewport:vp}).promise;
          const img=c.toDataURL('image/jpeg',0.85); _dv.pages.push(img);
          body.insertAdjacentHTML('beforeend',`<img class="dv-page" src="${img}" alt="page ${i}"/>`);
        }
      }catch(e){ body.insertAdjacentHTML('beforeend',`<div class="dv-msg">This PDF can't be previewed here — use ⬇ Download to open it.</div>`); }
    }else{
      _dv.pages.push(data); body.insertAdjacentHTML('beforeend',`<img class="dv-page" src="${data}" alt="${_escHtml(f.name||'')}"/>`);
    }
  }
  ['dvShare','dvDl','dvPrint'].forEach(id=>{ const b=document.getElementById(id); if(b)b.disabled=!_dv.files.length; });
  if(!(navigator.canShare&&navigator.share)){ const b=document.getElementById('dvShare'); if(b)b.style.display='none'; }
}

function _dvFile(f){ const u=_dataUrlToU8(f.data); return new File([u],f.name,{type:f.mime}); }
async function dvShare(){

function driveScan(all){
  if(!driveOn())return 0; let n=0, changed=false;
  const visit=(loc)=>{
    const h=loc.h; if(!h||!h.name)return;
    if(!h.tkey){ if(!all&&loc.past)return; _ensureTkey(h); changed=true; }
    const pd=_profileData(loc); const hs=_hashStr(JSON.stringify(pd));
    const mine=_driveDone[h.tkey];
    if(!all&&h.driveHash!==hs&&mine&&mine.h===hs){ h.driveHash=hs; }        // already backed up from this phone — the cloud copy just hadn't caught up
    else if(all||h.driveHash!==hs){
      const why=all?'sync all':(!h.driveHash&&!mine?'new':'changed: '+(_pdDiff(mine&&mine.pd,pd)||'details'));
      _driveEnq({type:loc.past?'vacate':'profile',tkey:h.tkey,label:(h.name||'Tenant')+' – profile',why}); n++;
    }
    if(all){
      Object.keys(h.docs||{}).forEach(pk=>Object.keys(h.docs[pk]||{}).forEach(dk=>(h.docs[pk][dk]||[]).forEach(f=>{
        if(f.drive!=='done'){ _driveEnq({type:'file',tkey:h.tkey,person:pk,docKey:dk,ref:f.ref||(f.lr+'_'+f.lk),label:(h.name||'Tenant')+' – '+(f.name||dk)}); n++; }

  (S.pastTenants||[]).forEach(t=>{ if(all||t.tkey)visit({h:t,past:true}); });

}

async function _drivePost(body){

async function driveFlush(){
  if(_driveBusy||!driveOn()||!_driveQ.length||!navigator.onLine)return;
  _driveBusy=true; let dirty=false, budget=_driveQ.length, hadErr=false;
  try{
    while(_driveQ.length&&budget-->0){
      const job=_driveQ.shift(); _driveSaveQ(); _driveInflight=job.k;
      { const st=document.getElementById('driveStatus'); if(st)st.innerHTML=_driveStatusH(); }
      if(job.type==='report'||job.type==='backup'){
        try{ window._lastEdit=Date.now(); await _driveRunOther(job); dirty=true; sched();
          _driveLastOk=Date.now(); try{localStorage.setItem('rentdesk_drive_last',String(_driveLastOk));}catch(e){} }
        catch(e){ hadErr=true; job.tries=(job.tries||0)+1; _driveLastErr=String(e.message||e); if(job.tries<8)_driveQ.push(job); _driveSaveQ(); if(e instanceof TypeError)break; }
        continue;
      }
      const loc=_findByTkey(job.tkey);
      if(!loc)continue;                                                  // tenant record gone
      let f=null;
      try{
        const tenant=_folderInfo(loc);
        if(job.type==='file'){
          f=_findFile(loc.h,job.person,job.docKey,job.ref);
          if(!f)continue;                                                // file deleted before backup
          const data=await _getFileData(f);
          if(!data){ const e=new Error('Could not load '+(f.name||'file')+' from the app'); e.missing=true; throw e; }
          const dt=DOC_TYPES.find(d=>d.key===job.docKey)||{label:job.docKey};
          const pp=_docPersons(loc.h,loc.past?(loc.h.coTenants||[]):_roomCo(loc.r)).find(x=>x.key===job.person);
          const ext=(f.mime||'').includes('pdf')?'.pdf':'.jpg';
          const fileName=(job.person==='main'?'':'Co-tenant '+((pp&&pp.name)||'')+' – ')+(f.label?f.label:dt.label.split(' /')[0]+' – '+String(f.name||'file').replace(/\.[a-z0-9]+$/i,''))+ext;
          window._lastEdit=Date.now();                              // hold off background refresh while uploading
          await _drivePost({action:'file',tenant,fileName,data});
          { const cur=_findByTkey(job.tkey); const cf=cur&&_findFile(cur.h,job.person,job.docKey,job.ref); (cf||f).drive='done'; } dirty=true;
        }else{
          const pd=_profileData(loc);
          window._lastEdit=Date.now();
          await _drivePost({action:job.type,tenant,profile:pd});
          { const cur=_findByTkey(job.tkey)||loc; const npd=_profileData(cur); const hs=_hashStr(JSON.stringify(npd)); cur.h.driveHash=hs; _driveDone[job.tkey]={h:hs,pd:npd}; _driveDoneSave(); if(job.type==='vacate')cur.h.driveVacated=true; } dirty=true;
          sched();                                                   // save progress as we go
        }
        _driveLastOk=Date.now(); try{localStorage.setItem('rentdesk_drive_last',String(_driveLastOk));}catch(e){}
      }catch(e){
        hadErr=true; job.tries=(job.tries||0)+1; _driveLastErr=String(e.message||e);
        const network=e instanceof TypeError;                            // no internet / blocked
        if(e.missing&&job.tries>=3){ if(f){f.drive='failed';dirty=true;} }  // file no longer in the app — skip it
        else if(job.tries<12)_driveQ.push(job);
        _driveSaveQ();
        if(network)break;
      }
    }
    if(!hadErr)_driveLastErr='';
  }finally{
    _driveBusy=false; _driveInflight=null;
    if(dirty){ sched(); }
    const st=document.getElementById('driveStatus'); if(st)st.innerHTML=_driveStatusH();
    if(_driveQ.length&&!hadErr)setTimeout(driveFlush,1500);
  }
}

function getDistanceMetres(lat1, lng1, lat2, lng2){
  const R=6371000;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function calcHours(rec){
  if(!rec||!rec.checkIn||!rec.checkOut)return'—';
  const diff=(new Date(rec.checkOut)-new Date(rec.checkIn))/3600000;
  const h=Math.floor(diff),m=Math.round((diff-h)*60);
  return h+'h '+(m<10?'0'+m:m)+'m';
}

function setAttStatus(msg,color='var(--muted)'){
  const el=document.getElementById('attStatus');
  if(el){el.textContent=msg;el.style.color=color;}
}

function doCheckIn(){
  if(!navigator.geolocation){toast('❌ Location not supported on this browser');return;}
  setAttStatus('📡 Getting your location...','var(--muted)');
  document.getElementById('attBtn').classList.add('checking');
  document.getElementById('attBtn').disabled=true;

  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat=pos.coords.latitude,lng=pos.coords.longitude;
      const dist=getDistanceMetres(lat,lng,OFFICE_LAT,OFFICE_LNG);
      const mapUrl=`https://www.google.com/maps?q=${lat},${lng}`;

      if(dist>OFFICE_RADIUS_METRES&&!isAdmin){
        setAttStatus(`❌ You are ${Math.round(dist)}m from office. Must be within ${OFFICE_RADIUS_METRES}m to check in.`,'var(--red)');
        document.getElementById('attBtn').classList.remove('checking');
        document.getElementById('attBtn').disabled=false;
        return;
      }

      // Save check-in
      if(!S.attendance)S.attendance=[];
      const td=todayDate();
      // Remove any existing today record for this user (shouldn't happen but safety)
      S.attendance=S.attendance.filter(a=>!(a.date===td&&a.staffName===user));
      S.attendance.push({
        id:uid(),staffName:user,date:td,
        checkIn:nowISO(),checkInTime:nowTime(),
        checkInLat:lat,checkInLng:lng,checkInMapUrl:mapUrl,
        checkInDist:Math.round(dist),
        checkOut:null,checkOutTime:null,checkOutLat:null,checkOutLng:null,checkOutMapUrl:null
      });
      sched();
      toast('✅ Checked in at '+nowTime());
      renderAttendance();
    },
    err=>{
      const msgs={1:'Location permission denied — please allow location access',2:'Location unavailable — try again',3:'Location timed out — try again'};
      setAttStatus('❌ '+(msgs[err.code]||'Location error'),'var(--red)');
      const attBtn=document.getElementById('attBtn');if(attBtn)attBtn.classList.remove('checking');
      if(document.getElementById('attBtn'))document.getElementById('attBtn').disabled=false;
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

function doCheckOut(){
  if(!navigator.geolocation){toast('❌ Location not supported');return;}
  setAttStatus('📡 Getting your location...','var(--muted)');
  const btn=document.getElementById('attBtn');
  if(btn){btn.classList.add('checking');btn.disabled=true;}

  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat=pos.coords.latitude,lng=pos.coords.longitude;
      const mapUrl=`https://www.google.com/maps?q=${lat},${lng}`;
      const rec=getTodayRecord();
      if(!rec){toast('❌ No check-in found for today');return;}
      rec.checkOut=nowISO();
      rec.checkOutTime=nowTime();
      rec.checkOutLat=lat;rec.checkOutLng=lng;rec.checkOutMapUrl=mapUrl;
      sched();
      toast('✅ Checked out at '+nowTime()+' · '+calcHours(rec)+' today');
      renderAttendance();
    },
    err=>{
      const msgs={1:'Location permission denied',2:'Location unavailable',3:'Timed out'};
      setAttStatus('❌ '+(msgs[err.code]||'Location error'),'var(--red)');
      const btn=document.getElementById('attBtn');
      if(btn){btn.classList.remove('checking');btn.disabled=false;}
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

function saveEditPayment(pid, rid, payId){
  const amt=document.getElementById('epyA').value;
  if(!amt){toast('❌ Enter amount');return;}
  const p=S.properties.find(x=>x.id===pid);
  const r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  const py=((r&&r.payments)||[]).find(x=>x.id===payId);
  if(!py)return;
  { const _m=document.getElementById('epyMd').value, _rf=refRead('epyRef',_m,py.id); if(_rf===null)return; if(_rf)py.ref=_rf; else delete py.ref; }
  const oldMonth=py.month; // remember in case the month itself was changed
  py.month=document.getElementById('epyM').value;
  py.amount=Number(amt);
  py.mode=document.getElementById('epyMd').value;
  py.date=document.getElementById('epyD').value;
  py.notes=document.getElementById('epyNote').value;
  if(py.mode==='Cash'){ const _rv=(document.getElementById('epyRcv')||{}).value; if(_rv)py.receivedBy=_rv; else delete py.receivedBy; } else delete py.receivedBy;
  // Recalculate using the payment's own month (whichever is earlier, if it moved), not
  // today's real-world month — and match the same due formula used everywhere else:
  // prorated rent + electricity + carry-in - deductions + any pending security due.
  const targetMonth=(oldMonth&&oldMonth<py.month)?oldMonth:py.month;
  const elec=(r.electricityReadings||[]).find(x=>x.month===targetMonth);
  const bal=getCarryIn(r,targetMonth);
  const dedTotal=(r.deductions||[]).filter(d=>d.month===targetMonth).reduce((s,d)=>s+Number(d.amount||0),0);
  const activeStart=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const rentAmt=proratedRentForMonth(rentForMonth(r,targetMonth),activeStart,targetMonth);
  const secAdvDue=securityAdvanceDueForMonth(r,targetMonth);
  const isMoveInMonth=activeStart&&sameMonthDate(activeStart,targetMonth);
  const secPending=(secAdvDue&&isMoveInMonth)?secAdvDue.secPending:0;
  const due=rentAmt+Number((elec&&elec.amount)||0)+bal-dedTotal+secPending;
  const totalPaid=(r.payments||[]).filter(x=>x.month===targetMonth).reduce((s,x)=>s+Number(x.amount||0),0);
  setBalanceAfterMonth(r,targetMonth,due-totalPaid);
  sched();closeM();renderRoomDetail();toast('✅ Payment updated');
}

function delPayment(pid, rid, payId){

  const p=S.properties.find(x=>x.id===pid);
  const r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r)return;
  const py=((r.payments)||[]).find(x=>x.id===payId);
  const payMonth=py&&py.month;
  actLog('Deleted payment — '+(r.tenant&&r.tenant.name?r.tenant.name:'tenant')+' ₹'+((py&&py.amount)||0));
  r.payments=(r.payments||[]).filter(x=>x.id!==payId);
  // Recalculate using the deleted payment's own month, not today's real-world month —
  // matching the same due formula used everywhere else.
  const targetMonth=payMonth||mk();
  const elec=(r.electricityReadings||[]).find(x=>x.month===targetMonth);
  const bal=getCarryIn(r,targetMonth);
  const dedTotal=(r.deductions||[]).filter(d=>d.month===targetMonth).reduce((s,d)=>s+Number(d.amount||0),0);
  const activeStart=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const rentAmt=proratedRentForMonth(rentForMonth(r,targetMonth),activeStart,targetMonth);
  const secAdvDue=securityAdvanceDueForMonth(r,targetMonth);
  const isMoveInMonth=activeStart&&sameMonthDate(activeStart,targetMonth);
  const secPending=(secAdvDue&&isMoveInMonth)?secAdvDue.secPending:0;
  const due=rentAmt+Number((elec&&elec.amount)||0)+bal-dedTotal+secPending;
  const totalPaid=(r.payments||[]).filter(x=>x.month===targetMonth).reduce((s,x)=>s+Number(x.amount||0),0);

function buildMonthlyReportData(month, filterPropId=''){
  const props=[];
  const movements=[];
  const movementKeys=new Set();
  let totalRent=0,totalElec=0,totalCollected=0,totalExp=0,totalRooms=0,occupied=0;
  let moveInRent=0,moveOutDue=0,moveOutCollected=0;

  S.properties.filter(p=>!filterPropId||p.id===filterPropId).forEach(p=>{
    const rooms=sortRooms(p.rooms||[]);
    totalRooms+=rooms.length;
    const propRooms=[],propExpenses=[];
    let propRent=0,propElec=0,propDed=0,propDue=0,propPaid=0,propPend=0;
    let vacantCount=0;
    const vacantUnits=[];

    rooms.forEach(r=>{
      if(!isRoomOccupied(r)){vacantCount++;vacantUnits.push(r.type+(r.unitNo?' #'+r.unitNo:''));return;}
      // If this tenant's actual move-in is after the month being reported, they weren't
      // here yet — count as vacant for this month (they're occupied now, just not during
      // this month) rather than showing a zeroed tenant row or silently disappearing.
      const _moveInCheck=(r.tenant&&(r.tenant.activeFrom||r.tenant.moveInDate))||(r.lease&&r.lease.startDate)||'';
      if(_moveInCheck&&_moveInCheck.slice(0,7)>month){vacantCount++;vacantUnits.push(r.type+(r.unitNo?' #'+r.unitNo:''));return;}
      occupied++;
      const elec=(r.electricityReadings||[]).find(x=>x.month===month);
      const paid=(r.payments||[]).filter(x=>x.month===month).reduce((s,x)=>s+Number(x.amount||0),0);
      const bal=getCarryIn(r,month);
      const activeStart=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
      const rent=proratedRentForMonth(rentForMonth(r,month),activeStart,month);
      const elecAmt=Number((elec&&elec.amount)||0);
      const deds=(r.deductions||[]).filter(d=>d.month===month);
      const dedAmt=deds.reduce((s,d)=>s+Number(d.amount||0),0);
      const total=rent+elecAmt+bal-dedAmt;
      const pend=total-paid;
      const secTotal=Number((r.tenant&&(r.tenant.security||r.tenant.securityDeposit))||r.security||0);
      const secBalRaw=(r.tenant&&r.tenant.securityBalance!=null)?r.tenant.securityBalance:r.securityBalance;
      const secBal=secBalRaw!=null?Number(secBalRaw||0):null;
      const storedToken=Number((r.tenant&&(r.tenant.tokenAmount||r.tenant.tokenReceived||r.tenant.token))||0);
      const inferredToken=(!storedToken&&sameMonthDate(activeStart,month)&&secTotal>0&&secBal!=null)?Math.max(0,secTotal-secBal):0;
      // Token amount is a lifetime fact stored once on the tenant record — it has no
      // month attached to it, so it would otherwise show up unconditionally in every
      // month forever. Only show it in the tenant's actual move-in month; from the next
      // month onward, it's already reflected in the security balance and shouldn't repeat.
      const tokenAmount=sameMonthDate(activeStart,month)?(storedToken||inferredToken):0;
      const paymentDetails=(r.payments||[])
        .filter(x=>x.month===month)
        .map(x=>(x.mode||'Payment')+(x.date?' '+fd(x.date):'')+(x.notes?' - '+x.notes:''))
        .join('<br/>');

      const elecOld=elec?elec.oldReading:null;
      const elecNew=elec?elec.reading:null;
      const elecUnits=elec?elec.units:null;
      const elecRate=elec?Number(elec.rate||0):null;

      const closingBal=Math.max(0,pend);
      const depositsThisMonth=depositLedgerForMonth(r,month);
      propRooms.push({roomId:r.id,unit:r.type+(r.unitNo?' #'+r.unitNo:''),tenant:r.tenant.name,phone:(r.tenant&&r.tenant.phone)||'',rent,elec:elecAmt,elecOld,elecNew,elecUnits,elecRate,deds,dedAmt,total,paid,pend,closingBal,carryIn:bal,bal,tokenAmount,securityBalance:secBal,tokenDate:(r.tenant&&r.tenant.tokenDate)||'',paymentDetails,depositsThisMonth});
      propRent+=rent;propElec+=elecAmt;propDed+=dedAmt;propDue+=total;propPaid+=paid;propPend+=pend;
    });

    // Vacated tenants this month — include as full rows in propRooms
    (S.pastTenants||[])
      .filter(t=>(!filterPropId||t.propertyId===p.id)&&sameMonthDate(t.vacatingDate,month))
      .forEach(t=>{
        const moveKey=['vacated',t.propertyId||p.id||'',t.roomId||'',t.unitNo||'',(t.name||'').trim().toLowerCase(),t.moveInDate||'',t.vacatingDate||''].join('|');
        if(movementKeys.has(moveKey))return;
        movementKeys.add(moveKey);

        // Full row data from archived history
        const elecRec=(t.electricityHistory||[]).find(x=>x.month===month);
        const elecAmt=Number((elecRec&&elecRec.amount)||0);
        const elecOld=elecRec?elecRec.oldReading:null;
        const elecNew=elecRec?elecRec.reading:null;
        const elecUnits=elecRec?elecRec.units:null;
        const elecRate=elecRec?Number(elecRec.rate||0):null;
        const deds=(t.deductionHistory||[]).filter(d=>d.month===month);
        const dedAmt=deds.reduce((s,d)=>s+Number(d.amount||0),0);
        const monthPaid=(t.paymentHistory||[]).filter(x=>x.month===month).reduce((s,x)=>s+Number(x.amount||0),0);
        const secAdj=Number((t.settlement&&t.settlement.securityAdjusted)||0);
        const totalPaidThisMonth=monthPaid+secAdj; // cash paid + security adjusted
        // Rent due: actual rent CHARGED this month (prorated to rent-payable-till date),
        // not the pending/unpaid balance — falls back to legacy records for old data.
        const rentDue=t.finalMonthRentCharged!=null?Number(t.finalMonthRentCharged||0):Number(t.settlement&&t.settlement.rentPending!=null?t.settlement.rentPending:t.rentAmount||0);
        const total=rentDue+elecAmt-dedAmt; // what was owed this month
        const pend=Math.max(0,total-totalPaidThisMonth);
        const closingBal=pend;
        const secHeld=Number(t.securityHeld||0);
        const secLeft=Math.max(0,secHeld-secAdj);
        const paymentDetails=(t.paymentHistory||[]).filter(x=>x.month===month)
          .map(x=>(x.mode||'Payment')+(x.date?' '+fd(x.date):'')+(x.notes?' - '+x.notes:'')).join('<br/>');
        const netRefund=Number(t.settlement&&t.settlement.netRefund||0);

        propRooms.push({
          roomId:t.roomId||'',
          unit:(t.roomType||'')+(t.unitNo?' #'+t.unitNo:''),
          tenant:t.name||'—',
          phone:t.phone||'',
          rent:rentDue,
          elec:elecAmt,elecOld,elecNew,elecUnits,elecRate,
          deds,dedAmt,
          total,paid:totalPaidThisMonth,pend,closingBal,
          carryIn:0,bal:0,
          tokenAmount:0,
          securityBalance:secLeft,
          tokenDate:'',
          paymentDetails,
          isVacated:true,
          vacatedOn:t.vacatingDate,
          securityHeld:secHeld,
          securityAdjusted:secAdj,
          netRefund,
          balanceStatus:t.settlement&&t.settlement.balanceStatus||'',
          refundLabel:refundLabelText(t),refundTone:refundTone(t),
        });
        propRent+=rentDue;propElec+=elecAmt;propDed+=dedAmt;propDue+=total;propPaid+=totalPaidThisMonth;propPend+=pend;

        // Also add to movements for the movement card
        movements.push({
          kind:'vacated',
          unit:(t.roomType||'')+(t.unitNo?' #'+t.unitNo:''),
          tenant:t.name||'—',
          start:t.moveInDate||'',
          end:t.vacatingDate||'',
          rent:rentDue,
          due:total,
          paid:totalPaidThisMonth,
          pending:pend,
          reason:t.vacatingReason||'—',
          status:t.settlement&&t.settlement.refundStatus||'na',
          securityHeld:secHeld,
          securityAdjusted:secAdj,
          netRefund,
        });
        moveOutDue+=pend;
        moveOutCollected+=totalPaidThisMonth;
      });

    // Pre-booked future tenants for this month
    rooms.forEach(r=>{
      const bk=roomBookingInfo(r);
      if(!bk||isRoomOccupied(r))return;
      if(!sameMonthDate(bk.moveInDate,month))return;
      const moveKey=[
        'prebooked',
        p.id||'',
        r.id||'',
        r.unitNo||'',
        (bk.name||'').trim().toLowerCase(),
        bk.moveInDate||''
      ].join('|');
      if(movementKeys.has(moveKey))return;
      movementKeys.add(moveKey);
      const rent=proratedRentForMonth(bk.agreedRent||r.rent||0,bk.moveInDate,month);
      const secBal=bk.securityBalance!=null?bk.securityBalance:Math.max(0,Number(bk.securityDeposit||0)-Number(bk.amount||0));
      movements.push({
        kind:'prebooked',
        unit:r.type+(r.unitNo?' #'+r.unitNo:''),
        tenant:bk.name||'—',
        start:bk.moveInDate||'',
        end:'',
        rent,
        token:Number(bk.amount||0),
        securityBalance:secBal,
        due:rent,
        paid:0,
        pending:rent,
        status:'pending',
      });
      moveInRent+=rent;
    });

    // Property expenses for this month
    (S.expenses||[]).filter(e=>e.propertyId===p.id&&e.month===month).forEach(exp=>{
      (exp.items||[]).forEach(i=>{
        propExpenses.push({desc:i.desc,amount:Number(i.amount||0),date:exp.date||'',paidBy:exp.paidBy||exp.addedBy||''});
        totalExp+=Number(i.amount||0);
      });
    });

    totalRent+=propRent;totalElec+=propElec;totalCollected+=propPaid;

    if(propRooms.length||propExpenses.length){
      // same order as Billing: each row in its room's slot, a tenant who vacated this month just before the room's new tenant
      { const ord={}; rooms.forEach((r,i)=>ord[r.id]=i);
        propRooms.forEach((x,i)=>x._o=i);
        propRooms.sort((a,b)=>((ord[a.roomId]??9999)-(ord[b.roomId]??9999))||((b.isVacated?1:0)-(a.isVacated?1:0))||(a._o-b._o)); }
      props.push({name:p.name,address:p.address||'',rooms:propRooms,vacantCount,vacantUnits,expenses:propExpenses,totalRent:propRent,totalElec:propElec,totalDed:propDed,totalDue:propDue,totalPaid:propPaid,totalPend:propPend});
    }
  });

  // Other expenses (no property) — only include in grand total, not per-property filter
  if(!filterPropId){
    (S.expenses||[]).filter(e=>!e.propertyId&&e.month===month).forEach(exp=>{
      (exp.items||[]).forEach(i=>totalExp+=Number(i.amount||0));
    });
  }

  return{props,movements,totalRent,totalElec,totalCollected,totalExp,totalRooms,occupied,moveInRent,moveOutDue,moveOutCollected,settlements:settlementsForMonth(month,filterPropId)};
}

  //   1. pdfmake (true vector PDF, matches print preview) → 2. html2pdf (raster fallback) → 3. browser print
  if(shareMode){
    if(await shareMonthlyReportPdfMake(month,filterPropId))return;
    if(await shareReportPdfBlob(html,'KDC-Report-'+month))return;
  }

  // Mobile-safe: open a printable page, then trigger the browser print/PDF flow.
  try{
    const blob=new Blob([html],{type:'text/html'});
    const url=URL.createObjectURL(blob);
    const w=window.open(url,'_blank');
    if(w){
      setTimeout(()=>{try{w.print();}catch(e){}},900);
      toast('📄 Choose Save as PDF or Share in the print screen',5000);
    }else{
      const a=document.createElement('a');
      a.href=url;a.target='_blank';a.rel='noopener';

      toast('📄 Opened printable report — use browser Print / Save as PDF',5000);

    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){
    const w=window.open('','_blank');
    if(w){w.document.write(html);w.document.close();}
    else toast('❌ Allow popups in browser settings');
  }
}

function openDeduction(pid, rid, mo){
  const p=S.properties.find(x=>x.id===pid);
  const r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r)return;
  const defMo=mo||mk();
  openM('➖ Add Tenant Deduction',`
    <div style="background:#F5F3FF;border:1px solid var(--purple-dim);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#6D28D9;">
      💡 Use this when a tenant pays an expense on your behalf and deducts it from rent.<br/>
      e.g. Plumbing repair ₹1,500 — tenant paid, deduct from this month's rent.
    </div>
    <div class="frow">
      <div><label class="flabel">Month *</label><input class="finput" type="month" id="dedM" value="${defMo}"/></div>
      <div><label class="flabel">Amount (₹) *</label><input class="finput" type="number" id="dedA" placeholder="e.g. 1500"/></div>
    </div>
    <div class="frow1"><label class="flabel">Description *</label><input class="finput" id="dedDesc" placeholder="e.g. Plumbing repair, Electrician charges, Paint material"/></div>
    <div class="frow1"><label class="flabel">Notes <span style="color:var(--muted);font-weight:400;text-transform:none;">optional</span></label><input class="finput" id="dedNote" placeholder="Any additional details"/></div>`,
    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button>
     <button class="btn btn-purple" onclick="saveDeduction('${pid}','${rid}')">Save Deduction</button>`
  );
}
function saveDeduction(pid, rid){
  const amt=document.getElementById('dedA').value;
  const desc=document.getElementById('dedDesc').value.trim();
  if(!amt){toast('❌ Enter amount');return;}
  if(!desc){toast('❌ Enter description');return;}
  const p=S.properties.find(x=>x.id===pid);
  const r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r.deductions)r.deductions=[];
  const mo=document.getElementById('dedM').value;
  r.deductions.push({
    id:uid(),month:mo,
    amount:Number(amt),
    desc,
    note:document.getElementById('dedNote').value,
    addedBy:user,date:today()
  });
  // Recalculate balance — prorated rent + security-due term, matching the formula used
  // everywhere else so this cached value stays consistent with what billing displays.
  const elec=(r.electricityReadings||[]).find(x=>x.month===mo);
  const dedTotal=r.deductions.filter(d=>d.month===mo).reduce((s,d)=>s+Number(d.amount||0),0);

  <style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Inter,sans-serif;padding:30px;background:#fff;max-width:700px;margin:0 auto;}.header{background:#F97316;color:#fff;padding:16px 20px;border-radius:8px;margin-bottom:20px;display:flex;justify-content:space-between;}.total-box{background:#1A1A1A;color:#fff;padding:14px 20px;border-radius:8px;display:flex;justify-content:space-between;font-size:16px;font-weight:700;margin-top:16px;}button{display:none;}</style>

  ${propSections||'<div style="text-align:center;padding:40px;color:#9CA3AF;">No expenses for this month</div>'}

function onVacateDateChange(pid,rid){
  // Keep rent-till in sync by default when room-vacant date changes,
  // unless the user has already deliberately set a different rent-till date — then recalculate.
  const vd=document.getElementById('vs_date'),rt=document.getElementById('vs_rent_till');
  if(!vd||!rt)return;
  if(!rt.dataset.touched)rt.value=vd.value;
  if(pid&&rid)recalcVacateRent(pid,rid);
}
function recalcVacateRent(pid,rid){
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r)return;
  const rtEl=document.getElementById('vs_rent_till');
  const rentTill=(rtEl&&rtEl.value)||today();
  const vm=rentTill.slice(0,7); // the month the rent ends in (not necessarily this month)
  const elec=(r.electricityReadings||[]).find(x=>x.month===vm);
  const elecAmt=Number((elec&&elec.amount)||0);
  const carryIn=getCarryIn(r,vm);
  const _as=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const proratedRent=proratedVacateRent(rentForMonth(r,vm),_as,vm,rentTill);
  const alreadyPaid=(r.payments||[]).filter(x=>x.month===vm).reduce((s,x)=>s+Number(x.amount||0),0);
  const totalDue=Math.max(0,proratedRent+elecAmt+carryIn-alreadyPaid);
  const duesEl=document.getElementById('vs_dues');
  if(duesEl){duesEl.value=totalDue;calcVacateRefund();}
  const info=document.getElementById('vs_rent_info');
  if(info){
    const full=rentForMonth(r,vm), days=vacateDays(_as,vm,rentTill);
    info.innerHTML='🧮 Rent for '+ml(vm)+': '+fm(full)+' ÷ 30 × '+days+' day'+(days!==1?'s':'')+' = <strong>'+fm(proratedRent)+'</strong>'
      +(elecAmt?' · Electricity '+fm(elecAmt):'')+(carryIn?' · Previous balance '+fm(carryIn):'')+(alreadyPaid?' · Already paid −'+fm(alreadyPaid):'')
      +' → <strong>Rent due '+fm(totalDue)+'</strong>';
  }
}

function calcVacateRefund(){
  const sec=Number(document.getElementById('vs_sec').value||0);
  const dues=Number(document.getElementById('vs_dues').value||0);
  const clean=Number(document.getElementById('vs_clean').value||0);
  const damage=Number(document.getElementById('vs_damage').value||0);
  const other=Number(document.getElementById('vs_other').value||0);
  const secAdj=Number(document.getElementById('vs_secadj').value||0);
  const cashPaid=Number(document.getElementById('vs_cashpaid').value||0);
  const totalDues=dues+clean+damage+other;
  const totalPaid=secAdj+cashPaid;
  const secLeft=Math.max(0,sec-secAdj); // security remaining to refund
  const balance=secLeft-(totalDues-cashPaid-secAdj); // positive = we owe tenant, negative = tenant owes us

  // Simpler: finalBalance = sec - totalDues + cashPaid
  // if positive: refund secLeft to tenant (dues covered by cash+secAdj, leftover sec returned)
  // if negative: tenant still owes
  const net=sec-totalDues+cashPaid; // >0 means refund to tenant, <0 means tenant owes

  document.getElementById('vs_r_sec').textContent='₹'+sec.toLocaleString('en-IN');
  document.getElementById('vs_r_ded').textContent='₹'+totalDues.toLocaleString('en-IN');
  document.getElementById('vs_r_secadj').textContent='₹'+secAdj.toLocaleString('en-IN');
  document.getElementById('vs_r_cash').textContent='₹'+cashPaid.toLocaleString('en-IN');
  document.getElementById('vs_r_secleft').textContent='₹'+secLeft.toLocaleString('en-IN');
  const netEl=document.getElementById('vs_r_net');
  if(net>0){
    netEl.textContent='₹'+net.toLocaleString('en-IN')+' to refund to tenant';
    netEl.style.color='var(--green)';
    document.getElementById('vs_r_explain').textContent='We still need to return ₹'+net.toLocaleString('en-IN')+' to '+' the tenant.';
  } else if(net<0){
    netEl.textContent='₹'+Math.abs(net).toLocaleString('en-IN')+' tenant still owes';
    netEl.style.color='var(--red)';
    document.getElementById('vs_r_explain').textContent='Tenant needs to pay ₹'+Math.abs(net).toLocaleString('en-IN')+' more.';
  } else {
    netEl.textContent='✓ Fully settled';
    netEl.style.color='var(--green)';
    document.getElementById('vs_r_explain').textContent='Account fully settled.';
  }
}

function confirmVacating(pid,rid){
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r||!p)return;
  const vDate=document.getElementById('vs_date').value;
  const rentTillDate=(document.getElementById('vs_rent_till')||{}).value||vDate;
  if(!vDate){toast('❌ Room vacant date required');return;}
  if(!rentTillDate){toast('❌ Rent-payable-till date required');return;}
  const sec=Number(document.getElementById('vs_sec').value||0);
  const dues=Number(document.getElementById('vs_dues').value||0); // this is PENDING (unpaid) rent portion, not total rent charged
  const clean=Number(document.getElementById('vs_clean').value||0);
  const damage=Number(document.getElementById('vs_damage').value||0);
  const other=Number(document.getElementById('vs_other').value||0);
  const secAdj=Number(document.getElementById('vs_secadj').value||0);
  const cashPaid=Number(document.getElementById('vs_cashpaid').value||0);
  const payMode=document.getElementById('vs_mode').value;
  const totalDed=dues+clean+damage+other;
  const netRefund=sec-totalDed+cashPaid; // positive=we owe tenant, negative=tenant owes us
  const reason=document.getElementById('vs_reason').value;
  const note=document.getElementById('vs_note').value;

  // Recompute the ACTUAL rent charged for the vacating month using the rent-till date,
  // separately from "dues" (which is the pending/unpaid amount). This fixes the bug where
  // a tenant who fully paid before vacating showed ₹0 rent for that month in billing —
  // that field was really "amount still owed," not "rent charged."
  // IMPORTANT: use the vacating month itself (from vDate), not today's real-world month —
  // otherwise a tenant who vacated in a past month gets their rent calculated against the
  // wrong month entirely, producing 0 or garbage (e.g. someone who vacated in June, viewed
  // in August, would have their rent computed for August instead of June).
  const vm=vDate.slice(0,7);
  const elecForVm=(r.electricityReadings||[]).find(x=>x.month===vm);
  const elecAmtForVm=Number((elecForVm&&elecForVm.amount)||0);
  const _asForVm=(r.tenant&&((r.tenant.activeFrom||r.tenant.moveInDate)||''))||(r.lease&&r.lease.startDate)||'';
  const actualRentCharged=proratedVacateRent(rentForMonth(r,vm),_asForVm,vm,rentTillDate);
  const alreadyPaidForVm=(r.payments||[]).filter(x=>x.month===vm).reduce((s,x)=>s+Number(x.amount||0),0);

  // Archive tenant
  try{_settleLegacyDocs(p,r);}catch(e){}
  if(!S.pastTenants)S.pastTenants=[];
  const cm=mk();
  const totalRentCollected=(r.payments||[]).reduce((s,x)=>s+Number(x.amount||0),0);
  const pastRecord={
    id:uid(),
    propertyId:pid,
    propertyName:p.name,
    roomId:rid,
    roomType:r.type,
    unitNo:r.unitNo||'',
    name:r.tenant&&r.tenant.name||'',
    phone:r.tenant&&r.tenant.phone||'',
    aadhaar:r.tenant&&r.tenant.aadhaar||'',
    dob:r.tenant&&r.tenant.dob||'',
    address:r.tenant&&r.tenant.address||'',
    fatherName:r.tenant&&r.tenant.fatherName||'',
    moveInDate:r.tenant&&r.tenant.moveInDate||'',
    vacatingDate:vDate,
    rentPayableTill:rentTillDate,
    vacatingReason:reason,
    rentAmount:Number(r.rent||0),
    finalMonthRentCharged:actualRentCharged,
    finalMonthRentPaid:alreadyPaidForVm,
    securityHeld:sec,
    totalRentCollected,
    depositLedger:[...(r.depositLedger||[])],
    settlement:{
      rentPending:dues,
      cleaningCharge:clean,
      damageDeductions:damage,
      otherDeductions:other,
      totalDeductions:totalDed,
      securityAdjusted:secAdj,
      cashPaidOnDay:cashPaid,
      paymentMode:payMode,
      netRefund,
      balanceStatus:netRefund>0?'refund_pending':netRefund<0?'payment_pending':'settled',
      refundStatus:netRefund>0?'pending':netRefund<0?'owed':'na',
      refundDate:null,
      refundNote:''
    },
    paymentHistory:[...(r.payments||[])],
    electricityHistory:[...(r.electricityReadings||[])],
    deductionHistory:[...(r.deductions||[])],
    notes:note,
    archivedBy:user,
    archivedAt:today(),
    coTenants:r.coTenants||[],
    ...((r.tenant&&r.tenant.docs)?{docs:r.tenant.docs}:{}),...((r.tenant&&r.tenant.tkey)?{tkey:r.tenant.tkey}:{}),
    relation:(r.tenant&&r.tenant.relation)||'',pan:(r.tenant&&r.tenant.pan)||'',office:(r.tenant&&r.tenant.office)||''
  };
  const dupIdx=S.pastTenants.findIndex(t=>
    (t.propertyId||'')===pid&&
    (t.roomId||'')===rid&&
    (t.vacatingDate||'')===vDate&&
    ((t.name||'').trim().toLowerCase())===((pastRecord.name||'').trim().toLowerCase())&&
    (t.moveInDate||'')===(pastRecord.moveInDate||'')
  );
  if(dupIdx>=0)S.pastTenants[dupIdx]={...S.pastTenants[dupIdx],...pastRecord,id:S.pastTenants[dupIdx].id||pastRecord.id};
  else S.pastTenants.push(pastRecord);

  // Close this tenant's lease so it doesn't keep showing as "expired / urgent" after they've left.
  // Matched by room + tenant name so a lease already made for an incoming pre-booked tenant is untouched.
  (S.leases||[]).forEach(l=>{
    if(l.roomId===rid&&(l.status==='active'||l.status==='expired')&&((l.lesseeName||'').trim().toLowerCase())===((pastRecord.name||'').trim().toLowerCase())){
      l.status='closed';l.closedOn=vDate;l.closedBy=user;
    }
  });

  // Clear room for next tenant — deposit ledger is archived above, so safe to reset here.
  // balanceByMonth is also cleared: it's a per-room cache, and left behind it would
  // silently carry into whoever moves in next as a phantom "carry-in" balance.
  r.tenant=null;
  delete r.docs;
  r.coTenants=[];
  r.notice=null;
  r.balance=0;
  r.balanceByMonth={};
  r.payments=[];
  r.electricityReadings=[];
  r.deductions=[];
  r.depositLedger=[];

  sched();
  closeM();

  // Step 2 — prompt for new tenant
  const hasToken=!!r.token;
  setTimeout(()=>{
    openM('✅ Vacated Successfully',`
      <div style="text-align:center;padding:16px 0;">
        <div style="font-size:2.5rem;margin-bottom:8px;">🎉</div>
        <div style="font-family:var(--font-head,serif);font-size:1.2rem;font-weight:600;margin-bottom:6px;">${pastRecord.name||'Tenant'} vacated</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">Settlement confirmed. ${netRefund>0?'Refund of ₹'+netRefund.toLocaleString('en-IN')+' pending.':netRefund<0?'Tenant owes ₹'+Math.abs(netRefund).toLocaleString('en-IN'):''}</div>
        ${hasToken?`<div style="background:var(--orange-dim);border:1px solid var(--orange);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;text-align:left;">
          <strong>🔑 Token exists:</strong> ${r.token.name} is ready to move in on ${fd(r.token.moveInDate)}.
          Token of ₹${Number(r.token.amount||0).toLocaleString('en-IN')} will be adjusted against security deposit.
        </div>`:''}
        <p style="font-size:13px;color:var(--ink2);">Would you like to add the new tenant now?</p>
      </div>`,
      `<button class="btn btn-ghost" onclick="closeM();renderRoomDetail();renderDash();">No — Leave ${hasToken?'Pre-booked':'Vacant'}</button>
       <button class="btn btn-orange" onclick="closeM();onboardNewTenant('${pid}','${rid}');">Yes — Add New Tenant →</button>`);
  },300);
}

function saveNewTenant(pid,rid){
  const p=S.properties.find(x=>x.id===pid),r=((p&&p.rooms)||[]).find(x=>x.id===rid);
  if(!r||!p)return;
  const name=(document.getElementById('nt_name').value||'').trim();
  const phone=(document.getElementById('nt_phone').value||'').trim();
  const rent=document.getElementById('nt_rent').value;
  const movein=document.getElementById('nt_movein').value;
  if(!name){toast('❌ Tenant name required');return;}
  if(!rent){toast('❌ Monthly rent required');return;}
  if(!movein){toast('❌ Move-in date required');return;}
  let _ntRef='';
  { const _pm=document.getElementById('nt_pay_mode').value||'Cash', _any=Number(document.getElementById('nt_sec_paid').value||0)+Number(document.getElementById('nt_adv_paid').value||0);
    if(_any>0){ _ntRef=refRead('nt_pay_ref',_pm); if(_ntRef===null)return; } }
  const tokenAmt=Number((r.token&&r.token.amount)||0);
  const secTotal=Number(document.getElementById('nt_sec').value||0);
  const secBal=Math.max(0,secTotal-tokenAmt);
  r.token={
    name,phone,
    aadhaar:document.getElementById('nt_aadhaar').value,
    dob:(document.getElementById('nt_dob')||{}).value||'',
    fatherName:document.getElementById('nt_father').value,
    address:document.getElementById('nt_addr').value,
    moveInDate:movein,
    agreedRent:Number(rent),
    securityDeposit:secTotal,
    securityBalance:secBal,
    amount:tokenAmt,
    tokenDate:(r.token&&r.token.tokenDate)||today(),
    advanceRent:Number(document.getElementById('nt_adv').value||0),
    advanceRentStatus:'pending',
    createdAt:(r.token&&r.token.createdAt)||today(),
    coTenants:_collectCoTenants(),
    ...((r.token&&r.token.docs)?{docs:r.token.docs}:{}),...((r.token&&r.token.tkey)?{tkey:r.token.tkey}:{})
  };
  r.coTenants=_collectCoTenants();
  r.rent=Number(rent);
  r.balance=0;
  r.payments=[];
  r.electricityReadings=[];
  r.deductions=[];
  r.tenant=null;
  // Log any money received right now into the dated deposit ledger
  const payDate=document.getElementById('nt_pay_date').value||today();
  const payMode=document.getElementById('nt_pay_mode').value||'Cash';
  const secPaidNow=Number(document.getElementById('nt_sec_paid').value||0);
  const advPaidNow=Number(document.getElementById('nt_adv_paid').value||0);
  if(secPaidNow>0)addDepositEntry(r,'security',secPaidNow,payDate,payMode,'Collected at pre-booking',_ntRef?{ref:_ntRef}:null);
  if(advPaidNow>0)addDepositEntry(r,'advance',advPaidNow,payDate,payMode,'Collected at pre-booking',_ntRef?{ref:_ntRef}:null);
  if(tokenAmt>0&&!depositLedgerTotal(r,'token'))addDepositEntry(r,'token',tokenAmt,(r.token&&r.token.tokenDate)||today(),'Cash','Token amount');
  syncBalancesFromLedger(r);
  sched();closeM();renderRoomDetail();renderDash();
  toast('✅ New tenant '+name+' saved as pre-booked'+((secPaidNow||advPaidNow)?' — payment logged':''));
}

function numToWords(n){
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  n=parseInt(n||0);
  if(!n||isNaN(n))return'';
  if(n>=10000000)return numToWords(Math.floor(n/10000000))+' Crore '+(n%10000000?numToWords(n%10000000):'');
  if(n>=100000)return numToWords(Math.floor(n/100000))+' Lakh '+(n%100000?numToWords(n%100000):'');
  if(n>=1000)return numToWords(Math.floor(n/1000))+' Thousand '+(n%1000?numToWords(n%1000):'');
  if(n>=100)return numToWords(Math.floor(n/100))+' Hundred '+(n%100?numToWords(n%100):'');
  if(n>=20)return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');
  return ones[n];
}
function toWords(n){const w=numToWords(n).trim();return w?w+' Only':'';}

// ── LEASE STATUS HELPERS ──
// A lease deed is "expired" when its end date has passed and it hasn't been renewed or closed.
function leaseState(l){
  if(!l)return'active';
  if(l.status==='draft')return'draft';
  if(l.status==='renewed')return'renewed';
  if(l.status==='closed')return'closed';
  const d=l.leaseEnd?dl(l.leaseEnd):null;
  if(l.status==='expired'||(d!==null&&d<0))return'expired';
  if(d!==null&&d<=30)return'expiring';
  return'active';
}
function leaseUnitLabel(l){return (l&&(l.unitName||l.propUnit))||'';}
function leaseStatusBadge(l){
  const st=leaseState(l),d=l.leaseEnd?dl(l.leaseEnd):null;
  if(st==='draft')return`<span class="lease-status-draft">📝 Draft — awaiting signature</span>`;
  if(st==='expired')return`<span class="lease-status-urgent">🚨 EXPIRED</span>`;
  if(st==='expiring')return`<span class="lease-status-soon">⏳ ${d===0?'Ends today':'Expiring'}</span>`;
  if(st==='renewed')return`<span class="lease-status-renewed">Renewed</span>`;
  if(st==='closed')return`<span class="lease-status-closed">Closed</span>`;
  return`<span class="lease-status-active">Active</span>`;
}
function _addMonthsEnd(start,months){
  if(!start||!months)return'';
  const d=new Date(start+'T00:00:00');d.setMonth(d.getMonth()+Number(months));d.setDate(d.getDate()-1);
  return localDate(d);
}
function _dayAfter(s){if(!s)return today();const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+1);return localDate(d);}
function _findLeaseRoom(l){
  if(!l||!l.roomId)return null;
  for(const p of (S.properties||[])){const r=(p.rooms||[]).find(x=>x.id===l.roomId);if(r)return{p,r};}
  return null;
}
// Works out a room's current lease end from the tenant's own dates, in this order:
// lease end date → lease start + tenure → lease start + 11 months → move-in + 11 months.
function _roomLeaseEnd(r){
  const L=r.lease||{};
  if(L.endDate)return{end:L.endDate,start:L.renewedStart||L.startDate||'',est:''};
  const start=L.startDate||'';
  const ten=parseInt(L.tenure)||0;
  if(start&&ten)return{end:_addMonthsEnd(start,ten),start,est:''};
  if(start)return{end:_addMonthsEnd(start,11),start,est:'11-month term assumed'};
  const mi=(r.tenant&&(r.tenant.moveInDate||r.tenant.activeFrom))||'';
  if(mi)return{end:_addMonthsEnd(mi,11),start:mi,est:'from move-in date, 11-month term assumed'};
  return null;
}
// The end date that actually applies to a room — an active lease deed wins over the room's own dates.
function roomLeaseEndDate(r){
  const deed=(S.leases||[]).find(l=>l.roomId===r.id&&(l.status==='active'||l.status==='expired'));
  if(deed&&deed.leaseEnd)return deed.leaseEnd;
  const i=_roomLeaseEnd(r);return i?i.end:'';
}
// Every lease that has expired or ends within 30 days — from lease deeds AND from each
// occupied room's own lease / move-in dates (for tenants who have no deed in the Lease tab).
function allLeaseAlerts(){
  const out=[];
  (S.leases||[]).forEach(l=>{
    const st=leaseState(l);
    if(st!=='expired'&&st!=='expiring')return;
    const dr=(S.leases||[]).find(x=>x.status==='draft'&&x.renewedFrom===l.id);
    out.push({key:'L_'+l.id,kind:'deed',leaseId:l.id,name:l.lesseeName||'—',prop:l.propertyName||'',unit:leaseUnitLabel(l),start:l.leaseStart,end:l.leaseEnd,days:l.leaseEnd?dl(l.leaseEnd):-1,rent:Number(l.rentAmt||0),est:'',draftId:dr?dr.id:null});
  });
  const deedRooms=new Set((S.leases||[]).filter(l=>l.roomId&&(l.status==='active'||l.status==='expired')).map(l=>l.roomId));
  (S.properties||[]).forEach(p=>(p.rooms||[]).forEach(r=>{
    if(!isRoomOccupied(r)||deedRooms.has(r.id))return;
    { const nm=String((r.tenant&&r.tenant.name)||'').trim().toLowerCase(); if(nm&&out.some(o=>o.kind==='deed'&&o.prop===p.name&&String(o.name).trim().toLowerCase()===nm))return; }
    const info=_roomLeaseEnd(r);if(!info||!info.end)return;
    const d=dl(info.end);if(d===null||d>30)return;
    const dr=(S.leases||[]).find(x=>x.status==='draft'&&x.renewedFromRoom===r.id);
    out.push({key:'R_'+r.id,kind:'room',pid:p.id,rid:r.id,name:r.tenant.name||'—',prop:p.name,unit:r.type+(r.unitNo?' #'+r.unitNo:''),start:info.start,end:info.end,days:d,rent:Number(r.rent||0),est:info.est,draftId:dr?dr.id:null});
  }));
  return out.sort((a,b)=>a.days-b.days);
}
function expiredAlerts(){return allLeaseAlerts().filter(a=>a.days<0);}
function _alertRenewCall(a){return a.kind==='deed'?`openMarkRenewed('${a.leaseId}')`:`openMarkRoomRenewed('${a.pid}','${a.rid}')`;}

    </div>
    <details style="margin-top:10px;font-size:12px;"><summary style="cursor:pointer;color:var(--muted);">Already signed on paper? Skip the draft</summary>
      ${m.rm?`<label style="display:flex;gap:8px;align-items:flex-start;margin:8px 0;cursor:pointer;color:var(--ink2);"><input type="checkbox" id="mr_upd" checked style="margin-top:2px;"/><span>Also update room rent (now ${fm(roomRent)}) from the new start month. Earlier months keep the old rent.</span></label>`:''}
      <button class="btn btn-green btn-sm" style="margin-top:6px;" onclick="saveMarkRenewed()">✅ Mark Renewed Now</button>
    </details>`,
    `<button class="btn btn-ghost" onclick="closeM()">Cancel</button>${extraBtns}
     <button class="btn btn-orange" onclick="draftRenewalFromModal()">📄 Draft Renewal Deed</button>`);

}
function mrCalc(fromEsc){
  const s=(document.getElementById('mr_start')||{}).value,t=(document.getElementById('mr_ten')||{}).value;
  const e=document.getElementById('mr_end');if(e)e.value=_addMonthsEnd(s,t);
  if(fromEsc){
    const r=document.getElementById('mr_rent');
    const pct=parseFloat((document.getElementById('mr_esc')||{}).value||0);
    if(r)r.value=Math.round(Number(r.dataset.old||0)*(1+pct/100));
  }
}
function _applyRoomRenewal(r,start,end,ten,rent,esc,updRent){
  if(!r.lease)r.lease={};
  if(!r.lease.renewals)r.lease.renewals=[];
  r.lease.renewals.push({prevStart:r.lease.renewedStart||r.lease.startDate||'',prevEnd:r.lease.endDate||'',prevRent:Number(r.rent||0),newStart:start,newEnd:end,newRent:rent,on:today(),by:user});
  // startDate is left untouched on purpose — billing uses it as a move-in fallback.
  r.lease.renewedStart=start;r.lease.endDate=end;r.lease.tenure=String(ten);r.lease.escalation=String(esc);
  if(updRent&&Number(r.rent||0)!==rent){
    if(!r.rentHistory)r.rentHistory=[];
    if(!r.rentHistory.length)r.rentHistory.push({rent:Number(r.rent||0),effectiveFrom:TRACKING_START_MONTH});
    const effMonth=start.slice(0,7);
    const entry={rent,effectiveFrom:effMonth+'-01'};
    const di=r.rentHistory.findIndex(h=>h.effectiveFrom&&h.effectiveFrom.slice(0,7)===effMonth);
    if(di>=0)r.rentHistory[di]=entry;else r.rentHistory.push(entry);
    r.rent=rent;r.balanceByMonth={};r.balance=0;
    return' · room rent '+fm(rent)+' from '+ml(effMonth);
  }
  return'';
}
function saveMarkRenewed(){
  const m=_mr;if(!m)return;
  const start=document.getElementById('mr_start').value;
  const ten=parseInt(document.getElementById('mr_ten').value)||0;
  const rent=Number(document.getElementById('mr_rent').value||0);
  const esc=parseFloat(document.getElementById('mr_esc').value||0);
  const note=((document.getElementById('mr_note')||{}).value||'').trim();
  const upd=document.getElementById('mr_upd');
  if(!start){toast('❌ New start date required');return;}
  if(!ten){toast('❌ Tenure required');return;}
  if(!rent){toast('❌ New rent required');return;}
  const end=_addMonthsEnd(start,ten);
  let roomMsg='';
  if(m.kind==='deed'){
    const old=(S.leases||[]).find(x=>x.id===m.leaseId);if(!old)return;
    const preset=['11','12','24','36'];
    // Old deed → renewed (stays in history); new active deed carries the new period/rent
    old.status='renewed';old.renewedOn=today();old.renewedBy=user;
    const newL={...old,
      id:uid(),status:'active',renewedFrom:m.leaseId,renewalCount:(old.renewalCount||0)+1,
      agrDate:start,leaseStart:start,leaseEnd:end,
      leaseTenure:preset.includes(String(ten))?String(ten):'custom',
      customTenure:preset.includes(String(ten))?'':String(ten),
      escalation:String(esc),rentAmt:String(rent),rentWords:toWords(rent),settledEscalation:esc,
      stampPaper:'no',stampFileName:'',stampFileType:'',stampFileData:'',stampRef:'',
      markedRenewed:true,renewalNote:note,createdAt:today(),createdBy:user};
    delete newL.renewedOn;delete newL.renewedBy;
    S.leases.push(newL);
  }
  if(m.rm)roomMsg=_applyRoomRenewal(m.rm.r,start,end,ten,rent,esc,!!(upd&&upd.checked));
  actLog('Lease marked renewed — '+m.name+' till '+fd(end)+', rent ₹'+rent.toLocaleString('en-IN')+' ('+esc+'%)'+(note?' · '+note:''));
  _mr=null;
  sched();closeM();renderTab();
  toast('✅ Renewed till '+fd(end)+roomMsg,4500);
}

function draftRenewalFromModal(){

let _lsQ='', _lsOpen=null;
function _lsState(){ if(!_lsOpen){ try{_lsOpen=JSON.parse(localStorage.getItem('rentdesk_lease_sections')||'null');}catch(e){} if(!_lsOpen)_lsOpen={cur:true,past:false,rooms:false}; } return _lsOpen; }

function _lsMatch(l){ if(!_lsQ)return true; const q=_lsQ.toLowerCase(); return [l.lesseeName,l.propertyName,leaseUnitLabel(l)].join(' ').toLowerCase().includes(q); }
function _lsSec(k,title,count,body,extra){

function renderLease(){
  if(!S.leases)S.leases=[];
  const mc=document.getElementById('mc');
  updateLeaseBadge();
  const all=S.leases||[];
  // renewal drafts sit inside the card of the lease they renew (if that lease is still current)
  const drafts={}; all.forEach(x=>{ if(x.status==='draft'&&x.renewedFrom)drafts[x.renewedFrom]=x; });
  const curIds=new Set(all.filter(l=>['expired','expiring','active'].includes(leaseState(l))).map(l=>l.id));
  const rank={expired:0,draft:1,expiring:1,active:2,renewed:3,closed:4};
  const sorted=all.slice().sort((a,b)=>{
    const ra=rank[leaseState(a)],rb=rank[leaseState(b)];
    if(ra!==rb)return ra-rb;
    if(ra>=3)return (b.leaseEnd||'').localeCompare(a.leaseEnd||'');
    return (a.leaseEnd||'9999').localeCompare(b.leaseEnd||'9999');
  });
  const cur=sorted.filter(l=>{ const st=leaseState(l); if(st==='renewed'||st==='closed')return false; if(st==='draft'&&l.renewedFrom&&curIds.has(l.renewedFrom))return false; return true; });

  const curF=cur.filter(l=>_lsQ?_lsMatch(l):!inAlert.has(l.id)), pastF=past.filter(_lsMatch);

  // Rooms (occupied / pre-booked): ones with no lease deed first

  rooms.sort((a,b)=>a.has-b.has);

    return `<div class="ls-room"><div style="min-width:0;"><div style="font-weight:600;font-size:13px;">${p.name} · ${r.type+(r.unitNo?' #'+r.unitNo:'')}</div>

      <button class="btn btn-ghost btn-xs" onclick="openLeaseDeed(null,'${p.id}','${r.id}')">📄 Create Lease</button></div>`;

  mc.innerHTML=`
  ${dashLeaseUrgentH()}
  ${_lsSec('cur','📄 Current Leases',cur.length,curBody,tools)}
  ${past.length?_lsSec('past','🗂 Past Leases',past.length,pastBody,''):''}
  ${rooms.length?_lsSec('rooms','🏠 Create Lease for a Room',noDeed?noDeed+' without lease':rooms.length,roomsBody,''):''}`;
}

function leaseLoadSiteLessor(){
  const pid=(_leaseDraftBase&&_leaseDraftBase.propertyId)||'';
  const les=siteLessor(pid);
  if(!les){ toast(pid?'No owner saved for this site yet — using default':'This lease has no site — using default'); }
  const L=applyLessor({},les);
  const set=(id,v)=>{const el=document.getElementById(id); if(el)el.value=v;};
  set('lf_lessorName',L.lessorName); set('lf_lessorRelation',L.lessorRelation); set('lf_lessorFather',L.lessorFather); set('lf_lessorAddr',L.lessorAddr); set('lf_lessorGender',L.lessorGender);
  if(typeof _livePreview==='function')_livePreview();
  leaseLoadSiteAddr(true);
  if(les)toast('✅ Loaded latest owner details & property address for '+((_leaseDraftBase&&_leaseDraftBase.propertyName)||'site'));
}
function leaseLoadSiteAddr(quiet){
  const pid=(_leaseDraftBase&&_leaseDraftBase.propertyId)||'';
  const p=(S.properties||[]).find(x=>x.id===pid);
  if(!p||!p.address){ if(!quiet)toast(p?'No address saved on this site yet':'This lease isn’t linked to a site'); return; }
  const el=document.getElementById('lf_propAddr'); if(el)el.value=p.address;
  if(typeof _livePreview==='function')_livePreview();
  if(!quiet)toast('✅ Property address updated from '+p.name);
}
function leaseSaveSiteLessor(){
  const pid=(_leaseDraftBase&&_leaseDraftBase.propertyId)||'';
  const p=(S.properties||[]).find(x=>x.id===pid);
  if(!p){ toast('❌ This lease isn’t linked to a site'); return; }
  const v=id=>((document.getElementById(id)||{}).value||'').trim();
  if(!v('lf_lessorName')){ toast('❌ Enter the owner name first'); return; }
  const old=p.lessor?{...p.lessor}:null;
  p.lessor={name:v('lf_lessorName'),relation:(document.getElementById('lf_lessorRelation')||{}).value||'',father:v('lf_lessorFather'),addr:v('lf_lessorAddr'),gender:v('lf_lessorGender')||'his'};
  actLog('Owner (lessor) details saved for '+p.name+' — '+p.lessor.name);
  const nL=syncSiteLessorToLeases(p,old,p.lessor,true,_curLeaseId);
  sched(); toast('💾 Saved as '+p.name+'’s owner'+(nL?' · updated in '+nL+' other lease'+(nL>1?'s':''):' — new leases for this site will use it'));
}

function openLeaseDeed(leaseId=null,pid=null,rid=null){
  if(!S.leases)S.leases=[];
  _curLeaseId=null;_isRenewal=false;
  let L={
    id:null,roomId:'',propertyId:'',propertyName:'',unitName:'',
    agrDate:today(),agrPlace:'Gurgaon',
    lessorName:DEFAULT_LESSOR.name,lessorRelation:DEFAULT_LESSOR.relation,lessorFather:DEFAULT_LESSOR.father,
    lessorAddr:DEFAULT_LESSOR.addr,lessorGender:DEFAULT_LESSOR.gender,
    lesseeName:'',lesseeAadhaar:'',lesseeRelation:'S/O',lesseeFather:'',lesseeAddr:'',lesseeGender:'her',
    propType:'',propUnit:'',propAddr:'',
    leaseStart:'',leaseEnd:'',leaseTenure:'11',
    rentAmt:'',rentWords:'',secAmt:'',secWords:'',elecRate:'10',rentDay:'7',escalation:'10',cleanCharge:'1000',
    maintType:'inclusive',maintAmt:'',maintWords:'',
    lockIn:'6',noticePeriod:'One month',
    wit1:'',wit2:'',stampPaper:'no',stampFileName:'',stampFileType:'',stampFileData:'',stampRef:'',customTenure:'',
    createdAt:today(),createdBy:user,status:'active',renewedFrom:null,renewalCount:0
  };
  if(leaseId){
    const found=(S.leases||[]).find(x=>x.id===leaseId);
    if(found){L={...found};_curLeaseId=leaseId;}
  } else if(pid&&rid){
    const p=(S.properties||[]).find(x=>x.id===pid);
    const r=((p&&p.rooms)||[]).find(x=>x.id===rid);
    if(p&&r){
      L.propertyId=p.id;L.propertyName=p.name;L.unitName=r.type+(r.unitNo?' #'+r.unitNo:'');
      L.roomId=r.id;
      if(siteLessor(p.id))applyLessor(L,siteLessor(p.id));
      // For pre-booked rooms, tenant details are in r.token; fall back gracefully
      const t=r.tenant||{};const tk=r.token||{};
      L.lesseeName=t.name||tk.name||'';
      L.lesseeAadhaar=t.aadhaar||tk.aadhaar||'';
      L.lesseeRelation=t.relation||tk.relation||'S/O';
      L.lesseeFather=t.fatherName||t.father||tk.fatherName||tk.father||'';
      { const m=String(L.lesseeFather).trim().match(/^(S\/O|D\/O|W\/O|C\/O)\.?\s*(.*)$/i); if(m){ L.lesseeRelation=m[1].toUpperCase(); L.lesseeFather=m[2]; } }
      L.lesseeAddr=t.address||tk.address||'';
      L.rentAmt=r.rent||tk.agreedRent||'';L.rentWords=toWords(L.rentAmt);
      L.secAmt=r.security||tk.securityDeposit||'';L.secWords=toWords(L.secAmt);
      L.leaseStart=(r.lease&&r.lease.startDate)||t.moveInDate||tk.moveInDate||'';
      L.leaseEnd=(r.lease&&r.lease.endDate)||'';
      L.leaseTenure=(r.lease&&r.lease.tenure)||'11';
      L.lockIn=(r.lease&&r.lease.lockIn)||'6';
      L.escalation=(r.lease&&r.lease.escalation)||'10';
      if(r.lease&&r.lease.noticePeriod)L.noticePeriod=r.lease.noticePeriod;
      L.propType=r.type||'';L.propUnit=r.unitNo||'';L.propAddr=p.address||'';
      L.elecRate=p.electricityRate||'10';
      // Auto-populate co-lessees from room co-tenants
      const roomCoT=r.coTenants||(r.token&&r.token.coTenants)||[];
      L.coLessees=roomCoT.map(c=>({name:c.name||'',aadhaar:c.aadhaar||'',relation:c.relation||'S/O',fatherName:c.fatherName||'',address:c.address||t.address||tk.address||''}));
    }
  }
  const ov=document.getElementById('leaseOverlay');
  document.getElementById('loTitle').textContent=leaseId?'View / Edit Lease':'New Lease Deed';
  document.getElementById('renewalBanner').style.display='none';
  // Show print button only for admin
  const printBtn=document.getElementById('loPrintBtn');
  if(printBtn)printBtn.style.display=isAdmin?'':'none';
  ov.classList.add('open');
  if(!leaseId&&L.ptSet==null)L.ptSet=S.deedDefaultSet||'';
  _leaseDraftBase={...L};
  _ptEditing=null;
  _buildLeaseForm(L);
  _renderDeed(L);
  _refreshLoSign();
}
// Lease editor behaves like its own screen: phone back gesture / ← closes it instead of leaving the app
let _loHist=false,_loSnap='',_loClosing=false;
function _loSnapNow(){ try{ return JSON.stringify(_collectLease()); }catch(e){ return ''; } }
function _loDirty(){ const ov=document.getElementById('leaseOverlay'); return !!(ov&&ov.classList.contains('open')&&_loSnap&&_loSnapNow()!==_loSnap); }
function _loAskLeave(){ // true = ok to close
  if(!_loDirty())return true;
  if(confirm('You have unsaved changes.\n\nOK = Save and close\nCancel = more options')){ saveLease(); return !_loDirty(); }
  return confirm('Close WITHOUT saving your changes?');
}
function _closeLeaseDeedCore(){document.getElementById('leaseOverlay').classList.remove('open');}
function closeLeaseDeed(force){
  if(!force&&!_loAskLeave())return;
  _closeLeaseDeedCore();
}
(function(){
  const ov=document.getElementById('leaseOverlay'); if(!ov)return;
  new MutationObserver(()=>{
    const open=ov.classList.contains('open');
    if(open&&!_loHist){ try{history.pushState({rdLease:1},'');_loHist=true;}catch(e){} setTimeout(()=>{_loSnap=_loSnapNow();},0); }
    else if(!open&&_loHist){ _loHist=false; _loClosing=true; try{history.back();}catch(e){_loClosing=false;} }
  }).observe(ov,{attributes:true,attributeFilter:['class']});
  window.addEventListener('popstate',()=>{
    if(_loClosing){_loClosing=false;return;}
    if(!_loHist)return;
    _loHist=false;
    if(_loAskLeave()){ _closeLeaseDeedCore(); }
    else { try{history.pushState({rdLease:1},'');_loHist=true;}catch(e){} }
  });
})();

    elecRate:_lfv('lf_elecRate'),rentDay:_lfv('lf_rentDay'),
    escalation:_lfv('lf_escalation'),cleanCharge:_lfv('lf_cleanCharge'),
    maintType,maintAmt:_lfv('lf_maintAmt'),maintWords:_lfv('lf_maintWords'),

function _collectCoLessees(){
  const results=[];
  document.querySelectorAll('[id^="lcl_name_"]').forEach(el=>{
    const i=el.id.split('_').pop();
    const name=(el.value||'').trim();if(!name)return;
    results.push({name,aadhaar:(document.getElementById('lcl_aadhaar_'+i)||{}).value||'',
      relation:(document.getElementById('lcl_rel_'+i)||{}).value||'S/O',
      fatherName:(document.getElementById('lcl_father_'+i)||{}).value||'',
      address:(document.getElementById('lcl_addr_'+i)||{}).value||''});
  });return results;
}

// Each lease remembers which default set it started from (L.ptSet; '' = built-in), so changing the
// defaults later never changes the wording of leases already made. Per-lease changes:
// L.ptEdit {id:text}, L.ptDel [ids], L.ptAdd [{id,sec,text}].
function _basePoints(L){ const set=L&&L.ptSet&&S.deedPointSets&&S.deedPointSets[L.ptSet]; return (set&&set.points)||DEFAULT_DEED_POINTS; }
function resolvePoints(L,includeRemoved){
  const ed=(L&&L.ptEdit)||{}, del=new Set((L&&L.ptDel)||[]), add=(L&&L.ptAdd)||[];
  const out=[];
  [1,2,3].forEach(sec=>{
    _basePoints(L).filter(p=>p.sec===sec).forEach(p=>{
      const removed=del.has(p.id); if(removed&&!includeRemoved)return;
      out.push({id:p.id,sec,text:ed[p.id]!=null?ed[p.id]:p.text,orig:p.text,edited:ed[p.id]!=null,removed,added:false});
    });
    add.filter(p=>p.sec===sec).forEach(p=>out.push({id:p.id,sec,text:p.text,orig:'',edited:false,removed:false,added:true}));
  });
  return out;
}
function _roman(n){ const m=[[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']]; let r=''; for(const [v,c] of m){ while(n>=v){r+=c;n-=v;} } return r; }
function _ptVals(L,tenure){ return {'rent due day':L.rentDay||'7','security amount':L.secAmt||'______','security in words':L.secWords||toWords(L.secAmt)||'_______',
  'electricity rate':L.elecRate||'10','notice period':L.noticePeriod||'One month','tenure months':tenure||L.leaseTenure||'11','escalation %':L.escalation||'10',
  'lock-in months':L.lockIn||'6','cleaning charge':L.cleanCharge||'1000'}; }
function _fmtPoint(text,vals){ return _escHtml(text).replace(/\n/g,'<br/>').replace(/\{([^{}]+)\}/g,(m,k)=>{ const v=vals[k.trim().toLowerCase()]; return v==null?m:'<strong>'+_escHtml(String(v))+'</strong>'; }); }
function _renderPointsHTML(L,tenure){
  const vals=_ptVals(L,tenure), pts=resolvePoints(L);
  return [1,2,3].map((sec,si)=>{ const list=pts.filter(p=>p.sec===sec); if(!list.length)return'';
    return `<p class="deed-cl"${si?' style="margin-top:16px;"':''}>${DEED_SECTIONS[sec]}</p>\n<ol>\n${list.map((p,i)=>`<li>${_roman(i+1)}. &nbsp;${_fmtPoint(p.text,vals)}</li>`).join('\n')}\n</ol>`; }).join('\n\n');
}

    const addIdx=p.added?(L.ptAdd||[]).filter(a=>a.sec===p.sec).findIndex(a=>a.id===p.id):-1, addCount=(L.ptAdd||[]).filter(a=>a.sec===p.sec).length;
    return `<div class="pt-row${p.removed?' pt-removed':''}"><div class="pt-txt">${tag}${short}</div><div class="pt-btns">

  };
  return [1,2,3].map(sec=>{ const list=pts.filter(p=>p.sec===sec); let n=0;
    return `<div class="pt-sec">${DEED_SECTIONS[sec].replace(/:-$/,'')}</div>`
      +list.map(p=>{ if(!p.removed)n++; return row(p).replace('<div class="pt-txt">',`<div class="pt-txt"><b>${p.removed?'—':_roman(n)}.</b> `); }).join('')
      +(_ptEditing==='new:'+sec?`<div class="pt-row pt-editing"><textarea class="ftextarea" id="lf_pt_txt" style="min-height:90px;" placeholder="Type the new point, e.g. That the LESSEE shall not keep pets without written permission of the LESSOR."></textarea>
         <div class="pt-tags">Auto values you can use: ${DEED_TAGS.map(t=>`<code>{${t}}</code>`).join(' ')}</div>
         <div style="display:flex;gap:6px;margin-top:6px;"><button class="btn btn-orange btn-xs" type="button" onclick="_ptSave('new:${sec}')">Add point</button><button class="btn btn-ghost btn-xs" type="button" onclick="_ptEditing=null;_ptRefresh()">Cancel</button></div></div>`
        :`<button class="btn btn-ghost btn-xs" type="button" style="margin:4px 0 10px;" onclick="_ptEditing='new:${sec}';_ptRefresh()">+ Add point here</button>`);
  }).join('')
  +`<div class="pt-foot">${changed?`<b>${changed}</b> change${changed>1?'s':''} for this lease only. `:'Using the standard points. '}Signed leases always reprint with their own wording.
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
      <button class="btn btn-ghost btn-xs" type="button" onclick="_ptSaveDefault()">⭐ Save these as default for new leases</button>
      ${S.deedDefaultSet?`<button class="btn btn-ghost btn-xs" type="button" onclick="_ptResetDefault()">↺ Go back to original default points</button>`:''}
    </div></div>`;
}
function _collectLeaseSafe(){ try{ return document.getElementById('lf_agrDate')?_collectLease():{}; }catch(e){ return {}; } }
function _ptRefresh(){ const el=document.getElementById('lf_points'); if(el)el.innerHTML=_pointsEditorH(); _livePreview(); const t=document.getElementById('lf_pt_txt'); if(t)t.focus(); }
function _ptSave(id){
  const txt=((document.getElementById('lf_pt_txt')||{}).value||'').trim(); if(!txt){toast('Type the point first');return;}
  const L=_ptL();
  if(id.startsWith('new:')){ L.ptAdd=[...(L.ptAdd||[]),{id:'pa_'+uid(),sec:Number(id.slice(4)),text:txt}]; }
  else if((L.ptAdd||[]).some(a=>a.id===id)){ L.ptAdd=L.ptAdd.map(a=>a.id===id?{...a,text:txt}:a); }
  else { const base=_basePoints(L).find(p=>p.id===id); L.ptEdit={...(L.ptEdit||{})}; if(base&&base.text===txt)delete L.ptEdit[id]; else L.ptEdit[id]=txt; }
  _ptEditing=null; _ptRefresh();
}
function _ptRemove(id){
  const L=_ptL();
  if((L.ptAdd||[]).some(a=>a.id===id)){ if(!confirm('Delete this added point?'))return; L.ptAdd=L.ptAdd.filter(a=>a.id!==id); }
  else { L.ptDel=[...new Set([...(L.ptDel||[]),id])]; }
  _ptEditing=null; _ptRefresh();
}
function _ptRestore(id){ const L=_ptL(); L.ptDel=(L.ptDel||[]).filter(x=>x!==id); if(L.ptEdit&&L.ptEdit[id]!=null){ L.ptEdit={...L.ptEdit}; delete L.ptEdit[id]; } _ptEditing=null; _ptRefresh(); }
function _ptMove(id,dir){
  const L=_ptL(), arr=[...(L.ptAdd||[])], i=arr.findIndex(a=>a.id===id); if(i<0)return;
  let j=i+dir; while(j>=0&&j<arr.length&&arr[j].sec!==arr[i].sec)j+=dir; if(j<0||j>=arr.length)return;
  [arr[i],arr[j]]=[arr[j],arr[i]]; L.ptAdd=arr; _ptRefresh();
}
function _ptSaveDefault(){
  if(!confirm('Make these points the default for every NEW lease?\n\nLeases already made keep their own wording.'))return;
  const L=_ptL(), pts=resolvePoints(L).map(p=>({id:p.id,sec:p.sec,text:p.text}));
  const sid='ps_'+uid(); if(!S.deedPointSets)S.deedPointSets={};
  S.deedPointSets[sid]={created:today(),by:user,points:pts}; S.deedDefaultSet=sid;
  L.ptSet=sid; L.ptEdit={}; L.ptDel=[]; L.ptAdd=[];
  actLog('Lease default points updated ('+pts.length+' points)'); sched(); _ptRefresh(); toast('⭐ Saved as default for new leases');
}
function _ptResetDefault(){
  if(!confirm('New leases will start with the original built-in points again. Existing leases are not changed.'))return;

}

function _autoWords(srcId,dstId){

function _compressStampImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1200;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.78));
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function _handleStampFile(input){
  const file=input&&input.files&&input.files[0];
  if(!file)return;
  const okTypes=['application/pdf','image/jpeg','image/png','image/webp','image/heic','image/heif'];
  const isPdf=file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf');
  const isHeic=file.type==='image/heic'||file.type==='image/heif'||/\.heic$|\.heif$/i.test(file.name);
  if(!okTypes.includes(file.type)&&!isPdf&&!isHeic){toast('❌ Please attach PDF, JPG, PNG, or WEBP');input.value='';return;}
  if(isHeic){toast('⚠️ HEIC photos from iPhone may not display correctly. If this fails, try taking a screenshot of the photo instead and attaching that.',6000);}
  toast('⏳ Processing stamp paper...',4000);
  try{
    let data='';
    let type='image/jpeg';
    if(isPdf){
      if(!window.pdfjsLib){
        await new Promise((resolve,reject)=>{
          const s=document.createElement('script');
          s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          s.onload=resolve;s.onerror=reject;
          document.head.appendChild(s);
        });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      const ab=await file.arrayBuffer();
      const pdf=await window.pdfjsLib.getDocument({data:ab}).promise;
      const page=await pdf.getPage(1);
      const vp=page.getViewport({scale:2.5});
      const canvas=document.createElement('canvas');
      canvas.width=vp.width;canvas.height=vp.height;
      await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
      data=canvas.toDataURL('image/jpeg',0.92);
    }else{
      data=await _compressStampImage(file);
    }
    if(data.length>950000){toast('❌ Stamp file is too large after processing. Please use a smaller file.');input.value='';return;}
    const ref='stamp_'+uid();
    toast('⏳ Uploading stamp paper...',6000);
    const up=await saveDocToFS('lease',ref,data,file.name,type);
    if(!up){toast('❌ Could not upload the stamp paper — check internet and attach again',5000);input.value='';return;}
    _stampCache[ref]=data;
    const L={..._collectLease(),stampPaper:'file',stampFileName:file.name,stampFileType:type,stampFileData:'',stampRef:ref};
    _leaseDraftBase={...L};
    _buildLeaseForm(L);
    _renderDeed(L);
    toast('✅ Stamp paper attached. Press Save to keep it with this lease.');
  }catch(e){
    console.error(e);
    toast('❌ Could not attach stamp paper');
  }
}
function _clearStampFile(){
  const L={..._collectLease(),stampPaper:'no',stampFileName:'',stampFileType:'',stampFileData:'',stampRef:''};
  _leaseDraftBase={...L};
  _buildLeaseForm(L);
  _renderDeed(L);
  toast('Stamp paper removed. Press Save to update the lease.');
}
function calcRoomLeaseEnd(){
  const st=(document.getElementById('lS')||{}).value;
  const ten=parseInt((document.getElementById('lTen')||{}).value)||0;

function saveLease(){
  if(!S.leases)S.leases=[];
  const L=_collectLease();
  if(!L.lesseeName){toast('❌ Lessee name is required');return;}
  if(!L.agrDate){toast('❌ Agreement date is required');return;}
  const wasEdit=!!_curLeaseId;
  if(_curLeaseId){
    const idx=S.leases.findIndex(x=>x.id===_curLeaseId);
    if(idx>=0){S.leases[idx]={...S.leases[idx],...L,id:_curLeaseId};}
    else{L.id=_curLeaseId;S.leases.push(L);}
  } else {
    const newId=uid();
    _curLeaseId=newId;
    L.id=newId;
    L.createdAt=today();L.createdBy=user;
    if(!L.status)L.status='active';
    S.leases.push(L);
  }
  const saved=(S.leases||[]).find(x=>x.id===_curLeaseId)||L;
  _leaseDraftBase={...saved};
  try{localStorage.setItem('rentdesk_backup',JSON.stringify(S));localStorage.setItem('rentdesk_backup_time',Date.now());}catch(e){}
  _loSnap=_loSnapNow();
  sched();
  actLog((wasEdit?'Lease edited — ':'Lease created — ')+L.lesseeName);
  _refreshLoSign();
  if(curTab==='lease'||curTab==='dash')renderTab();
  toast(saved.status==='draft'?'📝 Renewal draft saved — print it, get it signed, then Mark Signed':'✅ Lease saved',3500);
}

function applyRenewal(leaseId){

    newEnd=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

// Page balancer — runs inside the print window just before printing.
// Lays the deed out in A4-page-sized columns (same page-breaking rules the printer uses), then:
//   1. last page well filled (≥25%) and no big blank at the bottom of any page → leave as is
//   2. otherwise try a slight tighten (line spacing ≥1.6, clause gaps ≥75%; font & margins never change) to save a page
//   3. otherwise spread spacing evenly (up to 2.0 / 150%) so the last page is ≥25% full (20% minimum)
function _deedBalancer(doc){

    var pages=bottoms.length, gaps=0; for(var p=0;p<pages-1;p++)gaps=Math.max(gaps,1-(bottoms[p]||0)/H);
    return{lh:lh,gs:gs,pages:pages,last:(bottoms[pages-1]||0)/H,gaps:gaps};
  }
  var base=measure(1.8,1), tight=[], spread=[];
  [[1.76,0.94],[1.72,0.88],[1.68,0.82],[1.64,0.78],[1.6,0.75]].forEach(function(v){tight.push(measure(v[0],v[1]));});
  for(var t=1;t<=10;t++)spread.push(measure(+(1.8+0.02*t).toFixed(2),+(1+0.05*t).toFixed(2)));
  var all=[base].concat(tight,spread), minGap=Math.min.apply(null,all.map(function(m){return m.gaps;}));
  var gapLimit=Math.max(0.12,minGap+0.03);
  function ok(m){ return m.last>=0.2&&m.gaps<=gapLimit; }
  var pick=null;
  if(ok(base)&&base.last>=0.25)pick=base;
  if(!pick)for(var a=0;a<tight.length&&!pick;a++)if(tight[a].pages<base.pages&&ok(tight[a]))pick=tight[a];
  if(!pick)for(var b=0;b<spread.length&&!pick;b++)if(spread[b].pages<=base.pages&&ok(spread[b])&&(spread[b].last>=0.25||spread[b].pages<base.pages))pick=spread[b];
  if(!pick&&ok(base))pick=base;
  if(!pick){ // nothing perfect — closest to the goal without adding a page, preferring normal spacing on ties
    var score=function(m){return Math.max(0,0.2-m.last)*2+Math.max(0,m.gaps-gapLimit)+(m.pages>base.pages?9:0);};
    pick=all.reduce(function(x,y){return score(y)<score(x)-0.001?y:x;},base);
  }
  root.style.setProperty('--lh',pick.lh); root.style.setProperty('--gs',pick.gs);
  if(next)parent.insertBefore(wrap,next); else parent.appendChild(wrap);
  box.parentNode.removeChild(box);
  root.setAttribute('data-balance',JSON.stringify({base:base,pick:pick}));
  return{base:base,pick:pick};
}
